            onMouseLeave={e=>{e.currentTarget.style.background="linear-gradient(180deg,rgba(0,0,0,0.06),rgba(0,0,0,0.14))";}}
            >{isHost?"Sonraki ▶":"Tamam"}</button>
          </div>

        </div>{/* /içerik */}
      </div>{/* /kağıt gövde */}

    </div>{/* /wrapper */}
  </div>;
}

// ── GAME LOG ──────────────────────────────────────────────────────────────────
function GameLog({logs,isHost,showAll}){
  const scrollRef=useRef();
  useEffect(()=>{if(scrollRef.current)scrollRef.current.scrollTop=scrollRef.current.scrollHeight;},[logs]);
  const tipMeta={
    kill:{icon:"💀",label:"Ölüm",color:"#e74c3c"},
    protect:{icon:"🛡️",label:"Koruma",color:"#27ae60"},
    reveal:{icon:"🔮",label:"Rol Bak",color:"#a78bfa"},
    vote:{icon:"⚖️",label:"Oylama",color:"#f39c12"},
    phase:{icon:"🌙",label:"Faz",color:"#a78bfa"},
    announce:{icon:"👑",label:"Duyuru",color:"#f39c12"},
    revive:{icon:"✨",label:"Dirilt",color:"#27ae60"},
    day_announce:{icon:"📢",label:"Sabah",color:"#f39c12"},
    block:{icon:"🚫",label:"Engel",color:"#e74c3c"},
    default:{icon:"📜",label:"",color:"rgba(255,255,255,0.4)"},
  };
  const renderPart=(part,i)=>{
    if(part.t==="player"){
      if(isHost){const c=part.rol?.renk||T.primary;return <span key={i} style={{color:c,fontWeight:700}}>{part.rol?.emoji} {part.v}</span>;}
      return <span key={i} style={{color:T.primary,fontWeight:700}}>{part.v}</span>;
    }
    if(part.t==="role"){
      if(isHost){const c=part.data?.renk||T.accent;return <span key={i} style={{color:c,fontWeight:700}}>{part.data?.emoji} {part.v}</span>;}
      return <span key={i} style={{color:T.accent,fontWeight:700}}>{part.v}</span>;
    }
    return <span key={i} style={part.style||{}}>{part.v}</span>;
  };
  const visibleLogs=(isHost||showAll)?logs:logs.filter(l=>["phase","vote","death_reveal","day_announce","geveze_reveal"].includes(l.tip));
  return <GlassCard style={{padding:T.s16}}>
    <div style={{display:"flex",alignItems:"center",gap:T.s8,marginBottom:T.s12}}>
      <span>📜</span>
      <span style={{fontFamily:"'IM Fell English',serif",color:T.primary,fontSize:15,letterSpacing:2}}>Oyun Günlüğü</span>
      <Tag color={T.accent} size="sm">{visibleLogs.length} kayıt</Tag>
      {!isHost&&<Tag color={T.textMuted} size="sm">Oyuncu Görünümü</Tag>}
    </div>
    <div ref={scrollRef} style={{maxHeight:300,overflowY:"auto",display:"flex",flexDirection:"column",gap:T.s4}}>
      {visibleLogs.length===0&&<p style={{fontSize:12,color:T.textMuted,textAlign:"center",padding:T.s16}}>Henüz bir şey olmadı...</p>}
      {visibleLogs.map((log,i)=>{
        if(log.tip==="phase"){
          return <div key={i} style={{display:"flex",alignItems:"center",gap:T.s10||10,margin:"10px 0"}}>
            <div style={{flex:1,height:1,background:"linear-gradient(90deg,transparent,rgba(167,139,250,0.4))"}}/>
            <span style={{fontFamily:"'IM Fell English',serif",fontSize:11,letterSpacing:2,color:T.accent,whiteSpace:"nowrap",padding:"2px 4px"}}>✦ {log.label||"Faz Değişti"} ✦</span>
            <div style={{flex:1,height:1,background:"linear-gradient(90deg,rgba(167,139,250,0.4),transparent)"}}/>
          </div>;
        }
        const meta=tipMeta[log.tip]||tipMeta.default;
        return <div key={i} style={{display:"flex",gap:T.s8,alignItems:"flex-start",background:log.isNight?"rgba(88,80,180,0.10)":"rgba(255,255,255,0.03)",borderRadius:T.sm,padding:`${T.s6} ${T.s12}`,borderLeft:`3px solid ${meta.color}`,marginBottom:2}}>
          <span style={{fontSize:13,flexShrink:0,marginTop:2}}>{meta.icon}</span>
          <div style={{flex:1}}>
            <div style={{display:"flex",alignItems:"center",gap:T.s4,marginBottom:2}}>
              {meta.label&&<span style={{fontSize:9,color:meta.color,fontWeight:700,letterSpacing:1,textTransform:"uppercase",background:meta.color+"18",borderRadius:3,padding:"1px 5px"}}>{meta.label}</span>}
              <span style={{fontSize:9,color:T.textMuted}}>{log.zaman}</span>
              {log.isNight&&<span style={{fontSize:9,color:T.accent,letterSpacing:1,background:T.accentDim,borderRadius:3,padding:"1px 5px"}}>GECE</span>}
            </div>
            <span style={{fontSize:12,color:T.textSecondary,lineHeight:1.6}}>{(log.parts||[{t:"text",v:log.mesaj||""}]).map((part,j)=>renderPart(part,j))}</span>
          </div>
        </div>;
      })}
    </div>
  </GlassCard>;
}

// ── GECE ÖZETİ (sabah, sadece yöneticiye) ──────────────────────────────────────
function NightRecapCard({recap,players}){
  const[open,setOpen]=useState(false);
  if(!recap||!Array.isArray(recap.actions))return null;
  const skips=recap.actions.filter(a=>a.tip==="skip");
  const real=recap.actions.filter(a=>a.tip!=="skip");
  const tipLabel={kill:"🔪 Öldürme Girişimi",witch_kill:"🔪 Öldürme İksiri",witch_protect:"🛡️ Koruma İksiri",protect:"🛡️ Koruma",reveal:"🔮 Rol Bak",kabus_block:"🚫 Engelleme",sheriff_shoot:"🔫 Ateş",revive:"✨ Diriltme"};
  const killTips=["kill","witch_kill","sheriff_shoot"];
  const protects=real.filter(a=>a.tip==="protect"||a.tip==="witch_protect");
  const totalCount=real.length+skips.length;
  return <GlassCard style={{padding:T.s12,marginBottom:T.s16,border:`1px solid ${T.accentBorder}`}}>
    <button onClick={()=>setOpen(o=>!o)} style={{width:"100%",display:"flex",alignItems:"center",gap:T.s8,background:"transparent",border:"none",cursor:"pointer",padding:0}}>
      <span style={{fontSize:16}}>🌙</span>
      <span style={{fontFamily:"'IM Fell English',serif",color:T.accent,fontSize:14,letterSpacing:1.5}}>Geçen Gece Özeti — {recap.round}. Gece</span>
      <Tag color={T.textMuted} size="sm">Sadece sende görünür</Tag>
      {totalCount>0&&<Tag color={T.accent} size="sm">{totalCount}</Tag>}
      <span style={{marginLeft:"auto",fontSize:12,color:T.textMuted}}>{open?"▲ Gizle":"▼ Detay Göster"}</span>
    </button>
    {open&&<div style={{marginTop:T.s12,paddingTop:T.s12,borderTop:`1px solid ${T.border}`}}>
      {totalCount===0?<p style={{fontSize:12,color:T.textMuted}}>Bu gece kimse yeteneğini kullanmadı.</p>:
      <div style={{display:"flex",flexDirection:"column",gap:T.s8}}>
        {real.map((a,i)=>{
          const actor=a.actorId?players.find(p=>p.id===a.actorId):players.find(p=>p.rol?.id===a.roleId);
          const target=players.find(p=>p.id===a.targetId);
          let extra=null;
          if(killTips.includes(a.tip)&&target){
            const savedBy=protects.find(pr=>pr.targetId===target.id);
            const saver=savedBy?(savedBy.actorId?players.find(p=>p.id===savedBy.actorId):players.find(p=>p.rol?.id===savedBy.roleId)):null;
            extra=saver?<span style={{color:T.success}}> — {saver.ad} korudu, {target.ad} sağ kaldı</span>:<span style={{color:T.danger}}> — {target.ad} öldürüldü</span>;
          }
          if(a.tip==="reveal"&&target){
            extra=<span style={{color:T.accent}}> — rolü öğrenildi: {target.rol?.emoji} {target.rol?.ad||"?"}</span>;
          }
          return <div key={i} style={{fontSize:12,color:T.textSecondary,display:"flex",gap:T.s6,alignItems:"center",flexWrap:"wrap"}}>
            <span style={{fontSize:9,color:T.accent,background:T.accentDim,borderRadius:3,padding:"1px 5px",fontWeight:700,letterSpacing:0.5}}>{tipLabel[a.tip]||a.tip}</span>
            <span style={{color:T.textPrimary,fontWeight:600}}>{actor?.ad||"?"}</span>
            {target&&<><span>→</span><span style={{color:T.textPrimary,fontWeight:600}}>{target.ad}</span></>}
            {extra}
          </div>;
        })}
        {skips.map((a,i)=>{
          const actor=a.actorId?players.find(p=>p.id===a.actorId):players.find(p=>p.rol?.id===a.roleId);
          return <div key={"skip"+i} style={{fontSize:12,color:T.textMuted,display:"flex",gap:T.s6,alignItems:"center",flexWrap:"wrap"}}>
            <span style={{fontSize:9,color:T.textMuted,background:"rgba(255,255,255,0.06)",borderRadius:3,padding:"1px 5px",fontWeight:700,letterSpacing:0.5}}>⏭ ATLADI</span>
            <span style={{color:T.textPrimary,fontWeight:600}}>{actor?.ad||"?"}</span>
            <span>geceyi atladı, yeteneğini kullanmadı</span>
          </div>;
        })}
      </div>}
    </div>}
  </GlassCard>;
}

// ── VOTING PANEL ──────────────────────────────────────────────────────────────
function VotingPanel({players,round,onLynch,isHost,lobbyCode,myName,fb,onSkipToNight}){
  const alive=players.filter(p=>p.durum==="canlı"&&!p.isHost);
  const majority=Math.floor(alive.length/2)+1;
  const[vphase,setVphase]=useState(round===1?"no_vote":"poll");
  const[rtgts,setRtgts]=useState(null);
  const[fbVotes,setFbVotes]=useState({});
  const[pollVotes,setPollVotes]=useState({});

  useEffect(()=>{
    if(!fb||!lobbyCode)return;
    const vRef=fb.ref(fb.db,`lobbies/${lobbyCode}/votes`);
    const unsub=fb.onValue(vRef,(snap)=>{
      const d=snap.val();
      if(d){
        setFbVotes(d.votes||{});
        setVphase(d.phase||(round===1?"no_vote":"poll"));
        setRtgts(d.rtgts||null);
        setPollVotes(d.pollVotes||{});
      } else {
        setFbVotes({});
        setVphase(round===1?"no_vote":"poll");
        setRtgts(null);
        setPollVotes({});
      }
    });
    return()=>unsub();
  },[fb,lobbyCode,round]);

  const pushVoteState=(v,ph,rt,pv)=>{ if(!fb||!lobbyCode)return; fb.set(fb.ref(fb.db,`lobbies/${lobbyCode}/votes`),{votes:v||{},phase:ph,rtgts:rt||null,pollVotes:pv||pollVotes}); };

  const myPlayer=players.find(p=>p.ad===myName);
  const canVote=myPlayer&&myPlayer.durum==="canlı"&&!isHost;

  const vc=alive.reduce((acc,voter)=>{const t=fbVotes[String(voter.id)];if(t!=null)acc[t]=(acc[t]||0)+(voter.oySayisi||1);return acc;},{});
  const sorted=Object.entries(vc).sort((a,b)=>b[1]-a[1]);
  const top=sorted[0]?.[1]||0;
  const leaders=sorted.filter(([,c])=>c===top);
  const hasMaj=top>=majority;
  const isTie=leaders.length>1;
  const getName=id=>alive.find(p=>p.id===parseInt(id))?.ad||players.find(p=>p.id===parseInt(id))?.ad||"?";

  const pollYes=alive.filter(p=>pollVotes[String(p.id)]==="evet").length;
  const pollNo=alive.filter(p=>pollVotes[String(p.id)]==="hayir").length;
  const pollMaj=Math.floor(alive.length/2)+1;
  const pollDone=pollYes>=pollMaj||pollNo>=pollMaj;

  const castPollVote=(v)=>{
    if(!canVote||vphase!=="poll_open")return;
    const newPv={...pollVotes,[String(myPlayer.id)]:v};
    pushVoteState(fbVotes,vphase,rtgts,newPv);
  };

  const castVote=(targetId)=>{
    if(!canVote||(vphase!=="voting"&&vphase!=="revote"))return;
    if(myVote!=null)return; // Oy değiştirme engeli
    const newVotes={...fbVotes,[String(myPlayer.id)]:targetId};
    pushVoteState(newVotes,vphase,rtgts);
  };

  const submit=()=>{
    if(!isHost||!hasMaj)return;
    if(isTie){const rt=leaders.map(([id])=>id);pushVoteState({},vphase==="revote"?vphase:"revote",rt);return;}
    pushVoteState(fbVotes,"confirm",rtgts);
  };
  const doLynch=()=>{
    if(!isHost)return;
    onLynch(parseInt(leaders[0][0]));
    pushVoteState({},"lynched",null);
  };
  const reset=()=>{ pushVoteState({},"poll",null,{}); };
  const disp=vphase==="revote"?alive.filter(p=>rtgts?.includes(String(p.id))):alive;
  const myVote=fbVotes[String(myPlayer?.id)];
  const myPollVote=pollVotes[String(myPlayer?.id)];

  return <GlassCard style={{padding:T.s24}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:T.s16,flexWrap:"wrap",gap:T.s8}}>
      <div style={{display:"flex",alignItems:"center",gap:T.s8}}>
        <span>⚖️</span>
        <span style={{fontFamily:"'IM Fell English',serif",color:T.primary,fontSize:16,letterSpacing:2}}>Gündüz — {round}. Gün</span>
      </div>
      {isHost&&vphase!=="no_vote"&&<Btn variant="icon" onClick={reset} ariaLabel="Sıfırla">↺</Btn>}
    </div>

    {vphase==="no_vote"&&<div style={{textAlign:"center",padding:`${T.s24} 0`}}>
      <div style={{fontSize:48,marginBottom:T.s12}}>☀️</div>
      <p style={{fontFamily:"'IM Fell English',serif",color:T.primary,fontSize:16,marginBottom:T.s8}}>Oyun başladı!</p>
      <p style={{fontSize:13,color:T.textMuted,marginBottom:T.s24}}>İlk gündüz kimse idam edilmez.</p>
      {isHost&&<Btn variant="accent" onClick={()=>{if(onSkipToNight)onSkipToNight();}} style={{justifyContent:"center",gap:T.s8,padding:"12px 24px"}}>🌙 Geceye Geç</Btn>}
      {!isHost&&<p style={{color:T.textMuted,fontSize:13}}>Yönetici geceyi başlatacak...</p>}
    </div>}

    {vphase==="poll"&&<>
      {isHost&&<div style={{textAlign:"center",padding:`${T.s24} 0`}}>
        <div style={{fontSize:48,marginBottom:T.s12}}>⚖️</div>
        <p style={{fontFamily:"'IM Fell English',serif",color:T.primary,fontSize:16,marginBottom:T.s8}}>Bugün oylama yapılsın mı?</p>
        <p style={{fontSize:12,color:T.textMuted,marginBottom:T.s24}}>Butona basınca oyuncular evet/hayır oyu kullanabilecek.</p>
        <Btn variant="primary" onClick={()=>pushVoteState({},"poll_open",null,{})} style={{justifyContent:"center",gap:T.s8,padding:"12px 24px"}}>⚖️ Oylamayı Oyunculara Sor</Btn>
        <div style={{marginTop:T.s12}}><Btn variant="ghost" onClick={()=>{if(onSkipToNight)onSkipToNight();}} style={{justifyContent:"center",gap:T.s4}}>🌙 Geceye Geç</Btn></div>
      </div>}
      {!isHost&&<div style={{textAlign:"center",padding:`${T.s32} 0`}}>
        <div style={{fontSize:48,marginBottom:T.s12}}>☀️</div>
        <p style={{color:T.textMuted,fontSize:13}}>Yönetici oylama kararı bekliyor...</p>
      </div>}
    </>}

    {vphase==="poll_open"&&<>
      <div style={{background:"rgba(167,139,250,0.08)",border:`1px solid ${T.accentBorder}`,borderRadius:T.md,padding:T.s16,marginBottom:T.s16,textAlign:"center"}}>
        <p style={{fontFamily:"'IM Fell English',serif",color:T.accent,fontSize:15,marginBottom:T.s8}}>Bugün oylama yapılsın mı?</p>
        <p style={{fontSize:12,color:T.textMuted}}>Evet ({pollYes}) / Hayır ({pollNo}) — Çoğunluk: {pollMaj}</p>
        {pollDone&&<p style={{fontSize:12,color:T.success,marginTop:T.s8,fontWeight:700}}>{pollYes>=pollMaj?"✓ Oylama yapılacak!":"✕ Oylama yapılmayacak."}</p>}
      </div>
      {canVote&&!myPollVote&&<div style={{display:"flex",gap:T.s8,marginBottom:T.s16}}>
        <button onClick={()=>castPollVote("evet")} style={{flex:1,padding:T.s12,borderRadius:T.md,cursor:"pointer",fontWeight:700,fontSize:13,background:T.successDim,border:`1px solid ${T.successBorder}`,color:T.success}}>✓ Evet</button>
        <button onClick={()=>castPollVote("hayir")} style={{flex:1,padding:T.s12,borderRadius:T.md,cursor:"pointer",fontWeight:700,fontSize:13,background:T.dangerDim,border:`1px solid ${T.dangerBorder}`,color:T.danger}}>✕ Hayır</button>
      </div>}
      {canVote&&myPollVote&&<div style={{background:T.surface,borderRadius:T.md,padding:T.s12,marginBottom:T.s16,textAlign:"center"}}>
        <p style={{fontSize:12,color:T.success}}>✓ Oyunuz: <strong>{myPollVote==="evet"?"Evet":"Hayır"}</strong></p>
      </div>}
      {isHost&&<div style={{display:"flex",gap:T.s8}}>
        <Btn variant="success" disabled={!pollDone||pollNo>=pollMaj} onClick={()=>pushVoteState({},"voting",null,pollVotes)} style={{flex:1,justifyContent:"center",gap:T.s4}}>⚖️ Oylamayı Başlat</Btn>
        <Btn variant="ghost" onClick={()=>{pushVoteState({},"no_lynch",null,pollVotes);}} style={{justifyContent:"center",gap:T.s4}}>⏭ Atla</Btn>
      </div>}
      {!isHost&&<p style={{textAlign:"center",fontSize:12,color:T.textMuted,marginTop:T.s8}}>Yönetici kararı için bekleniyor...</p>}
    </>}

    {(vphase==="lynched"||vphase==="no_lynch")&&<div className="enter" style={{textAlign:"center",padding:`${T.s32} 0`}}>
      <div style={{fontSize:48,marginBottom:T.s12}}>{vphase==="lynched"?"⚖️":"🕊️"}</div>
      <p style={{fontFamily:"'IM Fell English',serif",fontSize:18,color:vphase==="lynched"?T.danger:T.accent}}>{vphase==="lynched"?`${getName(leaders[0]?.[0])} idam edildi!`:"Bugün kimse idam edilmedi."}</p>
      {vphase==="lynched"&&(()=>{const lp=players.find(p=>p.id===parseInt(leaders[0]?.[0]));return lp?.rol?<div style={{marginTop:T.s8,display:"flex",justifyContent:"center"}}><Tag color={lp.rol.renk||T.danger}>{lp.rol.emoji} {lp.rol.ad}</Tag></div>:null;})()}
      {isHost&&<div style={{display:"flex",gap:T.s8,justifyContent:"center",marginTop:T.s24}}>
        <Btn variant="secondary" onClick={reset} style={{justifyContent:"center"}}>↺ Yeni Oylama</Btn>
        <Btn variant="accent" onClick={()=>{if(onSkipToNight)onSkipToNight();}} style={{justifyContent:"center",gap:T.s4}}>🌙 Geceye Geç</Btn>
      </div>}
    </div>}

    {vphase==="confirm"&&<div className="enter" style={{textAlign:"center",padding:`${T.s16} 0`}}>
      <div style={{fontSize:32,margin:`0 auto ${T.s12}`}}>⚠️</div>
      <p style={{fontFamily:"'IM Fell English',serif",color:T.textPrimary,fontSize:16,marginBottom:T.s8}}><span style={{color:T.danger}}>{getName(leaders[0]?.[0])}</span> idam edilsin mi?</p>
      <p style={{fontSize:12,color:T.textMuted,marginBottom:T.s24}}>{top}/{alive.length} oy. Rolü herkese açıklanacak</p>
      {isHost&&<div style={{display:"flex",gap:T.s8,justifyContent:"center"}}>
        <Btn variant="danger" onClick={doLynch} style={{gap:T.s8,justifyContent:"center"}}>✓ Onayla</Btn>
        <Btn variant="ghost" onClick={()=>pushVoteState(fbVotes,"voting",rtgts)} style={{justifyContent:"center"}}>Geri Dön</Btn>
      </div>}
      {!isHost&&<p style={{color:T.textMuted,fontSize:13}}>Yönetici onayı bekleniyor...</p>}
    </div>}

    {(vphase==="voting"||vphase==="revote")&&<>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:T.s12}}>
        <Tag color={T.accent}>Çoğunluk: {majority}</Tag>
        {vphase==="revote"&&<Tag color={T.warning}>Beraberlik. Yeniden oy</Tag>}
      </div>
      {vphase==="revote"&&<div style={{background:"rgba(243,156,18,0.08)",border:`1px solid ${T.primaryBorder}`,borderRadius:T.md,padding:`${T.s8} ${T.s12}`,marginBottom:T.s12}}>
        <p style={{fontSize:13,color:T.warning}}>⚖️ Beraberlik: {rtgts?.map(id=>getName(parseInt(id))).join(" vs ")}</p>
      </div>}
      <div style={{display:"flex",flexDirection:"column",gap:T.s12,marginBottom:T.s16}}>
        {disp.map(target=>{
          const tv=vc[target.id]||0;
          const pct=majority>0?Math.min((tv/majority)*100,100):0;
          const isL=leaders[0]?.[0]===String(target.id)&&top>0;
          const votersForTarget=alive.filter(v=>fbVotes[String(v.id)]===target.id);
          return <div key={target.id} style={{background:"rgba(255,255,255,0.025)",borderRadius:T.md,padding:`${T.s12} ${T.s16}`,border:`1px solid ${isL&&hasMaj?T.dangerBorder:T.border}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:T.s8}}>
              <span style={{fontWeight:700,color:T.textPrimary,fontSize:14}}>{target.ad}{target.oySayisi>1&&<span style={{color:T.primary,fontSize:11}}> ×{target.oySayisi}</span>}</span>
              <Tag color={tv>=majority?T.danger:"#666"}>{tv}/{majority}</Tag>
            </div>
            <div style={{height:4,background:"rgba(255,255,255,0.06)",borderRadius:4,marginBottom:T.s12,overflow:"hidden"}}>
              <div style={{height:"100%",width:`${pct}%`,background:tv>=majority?`linear-gradient(90deg,${T.danger},#c0392b)`:`linear-gradient(90deg,${T.accent},#8e44ad)`,borderRadius:4,transition:`width ${T.base}`}}/>
            </div>
            {votersForTarget.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:T.s4,marginBottom:T.s8}}>
              {votersForTarget.map(v=><Tag key={v.id} color={T.danger} size="sm">{v.ad}</Tag>)}
            </div>}
            {canVote&&target.id!==myPlayer?.id&&myVote==null&&<button onClick={()=>castVote(target.id)} style={{padding:`${T.s4} ${T.s12}`,borderRadius:20,fontSize:12,cursor:"pointer",fontWeight:700,background:T.surface,border:`1px solid ${T.border}`,color:T.textMuted,marginTop:T.s4}}>Oy Ver</button>}
            {canVote&&target.id!==myPlayer?.id&&myVote===target.id&&<div style={{padding:`${T.s4} ${T.s12}`,borderRadius:20,fontSize:12,fontWeight:700,background:T.dangerDim,border:`1px solid ${T.dangerBorder}`,color:T.danger,display:"inline-block",marginTop:T.s4}}>✓ Oyum Var (Kilitledi)</div>}
          </div>;
        })}
      </div>
      {isHost&&<div style={{display:"flex",gap:T.s8}}>
        <Btn variant={hasMaj?"danger":"ghost"} onClick={submit} disabled={!hasMaj} style={{flex:1,justifyContent:"center",gap:T.s8}}>{isTie&&hasMaj?"⚖️ Yeniden Oy":"⚖️ İdama Gönder"}</Btn>
        <Btn variant="ghost" onClick={()=>pushVoteState(fbVotes,"no_lynch",null)} style={{justifyContent:"center",gap:T.s4}}>⏭ Atla</Btn>
      </div>}
      {!isHost&&<div style={{textAlign:"center",paddingTop:T.s8}}>
        {myVote!=null?<p style={{fontSize:12,color:T.success}}>✓ Oyunuz verildi. Yönetici kararı için bekleniyor...</p>:<p style={{fontSize:12,color:T.textMuted}}>Yukarıdan oy verebilirsiniz.</p>}
      </div>}
      {!hasMaj&&top>0&&isHost&&<p style={{textAlign:"center",fontSize:11,color:T.textMuted,marginTop:T.s8}}>İdam için {majority} oy gerekli ({majority-top} daha)</p>}
    </>}
  </GlassCard>;
}

// ── NIGHT ACTION QUEUE ────────────────────────────────────────────────────────
function NightActionQueue({players,nightOrder,roles,onResolve,onDayStart,nightNum,isHost,lobbyCode,myName,fb,hostStep,hostActions,hostDocHist,onHostStep,onHostActions,onHostDocHist,externalResolving,nightResolved}){
  const roleMap=Object.fromEntries(roles.map(r=>[r.id,r]));
  const alive=players.filter(p=>p.durum==="canlı"&&!p.isHost);

  const myPlayer=players.find(p=>p.ad===myName);
  const myRoleId=myPlayer?.rol?.id;
  const myRole=myPlayer?.rol;
  const myAbility=myRole?.isWitch?myRole.abilities.find(a=>(myPlayer?.abilityUses?.[a.id]??a.kullanim)!==0):myRole?.abilities?.find(a=>["kill","protect","reveal","revive","announce","special","sheriff_shoot","kabus_block","witch_kill","witch_protect"].includes(a.tip));
  const hasNightTurn=nightOrder.includes(myRoleId)&&alive.some(p=>p.id===myPlayer?.id)&&(myRole?.isWitch?myRole.abilities.some(a=>(myPlayer?.abilityUses?.[a.id]??a.kullanim)!==0):myAbility?(myAbility.oneTime?(myPlayer?.abilityUses?.[myAbility.id]??myAbility.kullanim)!==0:true):myRole?.abilities?.length===0?false:true);

  // ALL HOOKS AT TOP — never call hooks after a conditional return
  const[playerChoice,setPlayerChoice]=useState(null);
  const[deathNote,setDeathNote]=useState("");
  const[playerSubmitted,setPlayerSubmitted]=useState(false);
  const[witchAbility,setWitchAbility]=useState(null);
  const[dualAbility,setDualAbility]=useState(null);
  const[hostTarget,setHostTarget]=useState(null);
  const[playerSuggestion,setPlayerSuggestion]=useState(null);
  const[playerDeathNote,setPlayerDeathNote]=useState(null);
  const[playerWitchTip,setPlayerWitchTip]=useState(null);
  const[playerSkipped,setPlayerSkipped]=useState(false);
  const[hostDualChoice,setHostDualChoice]=useState(null);
  const[hostWitchAbility,setHostWitchAbility]=useState(null);
  const[nightSubmissions,setNightSubmissions]=useState({});
  const actionsRef=useRef([]);
  const resolving=externalResolving||false;

  useEffect(()=>{
    if(!fb||!lobbyCode||isHost||!myPlayer)return;
    const pRef=fb.ref(fb.db,`lobbies/${lobbyCode}/nightActions/${nightNum}/${myPlayer.id}`);
    fb.get(pRef).then(snap=>{
      if(snap.exists()){const d=snap.val();setPlayerChoice(d.targetId);setPlayerSubmitted(true);}
      else{setPlayerChoice(null);setPlayerSubmitted(false);}
    });
  },[nightNum,myPlayer?.id]);

  // hostSkipped: yönetici manuel atladıysa oyuncu ekranı da kilitleniyor
  useEffect(()=>{
    if(!fb||!lobbyCode||isHost||!myPlayer)return;
    const pRef=fb.ref(fb.db,`lobbies/${lobbyCode}/nightActions/${nightNum}/${myPlayer.id}`);
    const unsub=fb.onValue(pRef,(snap)=>{
      if(snap.exists()){
        const d=snap.val();
        if(d.hostSkipped){setPlayerChoice(null);setPlayerSubmitted(true);setPlayerSkipped(true);}
      }
    });
    return()=>unsub();
  },[fb,lobbyCode,isHost,nightNum,myPlayer?.id]);

  useEffect(()=>{
    if(!fb||!lobbyCode||isHost)return;
    const rRef=fb.ref(fb.db,`lobbies/${lobbyCode}/nightResolved`);
    const unsub=fb.onValue(rRef,(snap)=>{
      if(snap.val()===nightNum){setPlayerSubmitted(false);setPlayerChoice(null);}
    });
    return()=>unsub();
  },[fb,lobbyCode,nightNum]);

  // Doktor: docHist Firebase listener (oyuncu tarafı)
  const[fbDocHist,setFbDocHist]=useState({});
  useEffect(()=>{
    if(!fb||!lobbyCode||isHost)return;
    const dRef=fb.ref(fb.db,`lobbies/${lobbyCode}/docHist`);
    const unsub=fb.onValue(dRef,(snap)=>{setFbDocHist(snap.val()||{});});
    return()=>unsub();
  },[fb,lobbyCode,isHost]);

  // Host: gece boyunca kimin seçim yapıp yapmadığını takip et
  useEffect(()=>{
    if(!fb||!lobbyCode||!isHost)return;
    const naRef=fb.ref(fb.db,`lobbies/${lobbyCode}/nightActions/${nightNum}`);
    const unsub=fb.onValue(naRef,(snap)=>{
      setNightSubmissions(snap.val()||{});
    });
    return()=>unsub();
  },[fb,lobbyCode,isHost,nightNum]);

  // stepsKey and steps: player-based — aynı rolden birden fazla oyuncu varsa her biri ayrı adım
  const stepsKey_top=nightOrder.join(',')+alive.map(p=>p.id).join(',');
  const steps_top=nightOrder.flatMap(rid=>alive.filter(p=>p.rol?.id===rid).map(p=>({roleId:rid,playerId:p.id})));
  const step_top=hostStep!==undefined?hostStep:0;

  useEffect(()=>{
    if(playerSuggestion!=null)setHostTarget(playerSuggestion);
  },[playerSuggestion]);

  useEffect(()=>{
    if(!playerWitchTip)return;
    const stepObj=steps_top[step_top];
    const cr=roleMap[stepObj?.roleId];
    if(cr?.isDualAbility)setHostDualChoice(playerWitchTip);
  },[playerWitchTip]);

  useEffect(()=>{
    setHostTarget(null);
    setHostDualChoice(null);
    setHostWitchAbility(null);
    setPlayerSuggestion(null);
    setPlayerDeathNote(null);
    setPlayerWitchTip(null);
    setPlayerSkipped(false);
    if(!fb||!lobbyCode||step_top>=steps_top.length)return;
    const stepObj=steps_top[step_top];
    const crid=stepObj?.roleId;
    const stepPlayerId=stepObj?.playerId;
    // Rahip: ölü oyuncu yoksa otomatik geç
    if(crid==="rahip"){
      const allDead=players.filter(p=>p.durum==="ölü"&&!p.isHost);
      if(allDead.length===0){setTimeout(()=>setStep(s=>s+1),0);return;}
    }
    const actor=alive.find(p=>p.id===stepPlayerId);
    if(!actor){return;}
    // Rolü olmayan veya hakkı bitmiş rolleri otomatik atla
    const rolDef=actor.rol;
    if(!rolDef)return;
    // Yetenek yoksa veya tüm oneTime yetenek hakları bittiyse otomatik atla
    const hasUsableAbility=rolDef.abilities&&rolDef.abilities.length>0&&rolDef.abilities.some(a=>{
      const uses=actor.abilityUses?.[a.id]??a.kullanim;
      return uses!==0; // -1 sonsuz, >0 var
    });
    if(!hasUsableAbility){setTimeout(()=>setStep(s=>s+1),0);return;}
    // Hedef bulunamıyorsa da otomatik atla (örn. şerif mermisi bitince eligible boş döner)
    const ab_check=rolDef.isWitch
      ?(rolDef.abilities.find(a=>(actor.abilityUses?.[a.id]??a.kullanim)!==0))
      :(rolDef.abilities?.find(a=>["kill","protect","reveal","revive","announce","special","kabus_block","witch_kill","witch_protect","sheriff_shoot"].includes(a.tip))||rolDef.abilities?.[0]);
    if(ab_check){
      const{targets:autoTgts,selfAction:autoSelf}=getEligible(crid,ab_check,actor,players,nightNum,hostDocHist||{});
      if(!autoSelf&&autoTgts.length===0){setTimeout(()=>setStep(s=>s+1),800);return;}
    }
    const pRef=fb.ref(fb.db,`lobbies/${lobbyCode}/nightActions/${nightNum}/${actor.id}`);
    const unsub=fb.onValue(pRef,(snap)=>{
      if(snap.exists()){
        const d=snap.val();
        // Oyuncu atlama seçti → host otomatik ilerler
        if(d.tip==="skip"||d.skipped){
          setPlayerSkipped(true);
          setTimeout(()=>setStep(s=>s+1),1200);
          return;
        }
        setPlayerSuggestion(d.targetId??null);setPlayerDeathNote(d.deathNote||null);setPlayerWitchTip(d.tip||null);
        // Cadı oyuncusu seçim yaptıysa yöneticide de o iksiri işaretle
        if(d.tip&&["reveal","witch_kill","witch_protect"].includes(d.tip)){setHostWitchAbility(d.tip);}
      }
      else{setPlayerSuggestion(null);setPlayerDeathNote(null);setPlayerWitchTip(null);}
    });
    return()=>unsub();
  },[step_top,nightNum,stepsKey_top]);

  const submitPlayerChoice=(tid,overrideTip)=>{
    if(!fb||!lobbyCode||!myPlayer||playerSubmitted)return;
    const pRef=fb.ref(fb.db,`lobbies/${lobbyCode}/nightActions/${nightNum}/${myPlayer.id}`);
    const tipToUse=overrideTip||myAbility?.tip||"special";
    const isKiller=tipToUse==="kill"||tipToUse==="witch_kill";
    // Cadı için hangi iksiri seçtiğini de kaydet
    const abilityId=overrideTip?myRole?.abilities?.find(a=>a.tip===overrideTip)?.id:myAbility?.id;
    fb.set(pRef,{targetId:tid,roleId:myRoleId,actorId:myPlayer?.id,tip:tipToUse,abilityId:abilityId||null,...(isKiller&&deathNote.trim()?{deathNote:deathNote.trim()}:{})});
    setPlayerChoice(tid);setPlayerSubmitted(true);
  };

  if(!isHost){
    if(!myPlayer||myPlayer.durum!=="canlı"||!hasNightTurn||(!myRole?.isWitch&&(!myAbility||myAbility.kullanim===0))){
      return <GlassCard style={{padding:T.s24,textAlign:"center"}}>
        <div style={{fontSize:48,marginBottom:T.s16}}>🌙</div>
        <p style={{fontFamily:"'IM Fell English',serif",color:T.accent,fontSize:16}}>Gece vakti...</p>
        <p style={{color:T.textMuted,fontSize:13,marginTop:T.s8}}>Bu gece yapacak bir şeyin yok. Sabahı bekle.</p>
      </GlassCard>;
    }
    const playerDocHist=isHost?(hostDocHist||{}):fbDocHist;
    const{targets:eligible}=getEligible(myRoleId,myAbility,myPlayer,players,nightNum,playerDocHist);
    // Doktor için kilitli hedefler: üst üste 2 gece korunan kişiler
    const lockedTargets=myAbility?.tip==="protect"
      ?players.filter(p=>p.durum==="canlı"&&!p.isHost&&!eligible.find(e=>e.id===p.id))
      :[];

    if(playerSubmitted){
      const chosenName=players.find(p=>p.id===playerChoice)?.ad||"?";
      return <GlassCard style={{padding:T.s24,textAlign:"center"}}>
        <div style={{fontSize:48,marginBottom:T.s12}}>{myRole.emoji}</div>
        <p style={{fontFamily:"'IM Fell English',serif",color:myRole.renk,fontSize:16,marginBottom:T.s8}}>{myRole.ad}</p>
        <div style={{background:T.successDim,border:`1px solid ${T.successBorder}`,borderRadius:T.md,padding:T.s12,marginBottom:T.s12}}>
          <p style={{color:T.success,fontSize:14}}>✓ Seçiminiz kaydedildi: <strong>{chosenName}</strong></p>
          <p style={{fontSize:11,color:T.textMuted,marginTop:T.s4}}>Seçim kilitlendi. Değiştirilemez.</p>
        </div>
        <p style={{color:T.textMuted,fontSize:12}}>Gündüz olması bekleniyor...</p>
        {myRole.id==="serif"&&<div style={{marginTop:T.s12,padding:T.s8,background:"rgba(230,126,34,0.1)",borderRadius:T.md,border:"1px solid rgba(230,126,34,0.3)"}}>
          <p style={{fontSize:11,color:"#e67e22"}}>🔫 Kalan mermi: {(myPlayer.abilityUses?.a8??2)}</p>
        </div>}
      </GlassCard>;
    }

    // Cadı: iksir seçim ekranı
    if(myRole.isWitch){
      const usedAbilities=(myPlayer.abilityUses)||{};
      const allUsed=myRole.abilities.every(a=>(usedAbilities[a.id]??a.kullanim)===0);
      if(allUsed){
        return <GlassCard style={{padding:T.s24,textAlign:"center"}}>
          <div style={{fontSize:48,marginBottom:T.s12}}>🧙‍♀️</div>
          <p style={{fontFamily:"'IM Fell English',serif",color:myRole.renk,fontSize:16}}>Tüm iksirler bitti.</p>
          <p style={{color:T.textMuted,fontSize:13,marginTop:T.s8}}>Bu gece yapacak bir şeyin yok.</p>
        </GlassCard>;
      }
      const activeAb=myRole.abilities.find(a=>a.id===witchAbility);
      const{targets:wEligible}=activeAb?getEligible(myRoleId,activeAb,myPlayer,players,nightNum,{}):{targets:[]};
      return <GlassCard style={{padding:T.s24}}>
        <div style={{display:"flex",alignItems:"center",gap:T.s12,marginBottom:T.s16}}>
          <span style={{fontSize:28}}>🧙‍♀️</span>
          <div style={{fontFamily:"'IM Fell English',serif",color:myRole.renk,fontSize:16}}>Cadı — İksir Seç</div>
        </div>
        <div style={{display:"flex",gap:T.s8,marginBottom:T.s16,flexWrap:"wrap"}}>
          {myRole.abilities.map(a=>{
            const used=(usedAbilities[a.id]??a.kullanim)===0;
            return <button key={a.id} onClick={()=>!used&&setWitchAbility(witchAbility===a.id?null:a.id)} disabled={used} style={{flex:1,minWidth:90,padding:`${T.s8} ${T.s12}`,borderRadius:T.md,cursor:used?"not-allowed":"pointer",opacity:used?0.4:1,background:witchAbility===a.id?myRole.renk+"33":T.surface,border:`1px solid ${witchAbility===a.id?myRole.renk:T.border}`,color:witchAbility===a.id?myRole.renk:T.textSecondary,fontWeight:700,fontSize:12}}>
              {a.tip==="reveal"?"🔮 Rol Bak":a.tip==="witch_kill"?"💀 Öldür":"🛡️ Koru"}{used?" (bitti)":""}
            </button>;
          })}
        </div>
        {witchAbility&&!playerSubmitted&&<>
          <div style={{display:"flex",flexDirection:"column",gap:T.s8,marginBottom:T.s12}}>
            {wEligible.map(p=><div key={p.id} onClick={()=>setPlayerChoice(p.id===playerChoice?null:p.id)}
              style={{padding:`${T.s12} ${T.s16}`,borderRadius:T.md,cursor:"pointer",
                background:playerChoice===p.id?myRole.renk+"22":T.surface,
                border:`1px solid ${playerChoice===p.id?myRole.renk+"77":T.border}`,
                fontWeight:playerChoice===p.id?700:400,fontSize:14,
                color:playerChoice===p.id?T.textPrimary:T.textSecondary}}>
              {p.ad}
            </div>)}
            {wEligible.length===0&&<p style={{color:T.textMuted,fontSize:13,textAlign:"center"}}>Bu iksir için hedef yok.</p>}
          </div>
          {activeAb?.tip==="witch_kill"&&<div style={{marginBottom:T.s8}}>
            <label style={{fontSize:11,color:T.textMuted,letterSpacing:1,display:"block",marginBottom:T.s4}}>ÖLÜM NOTU (opsiyonel)</label>
            <textarea value={deathNote} onChange={e=>setDeathNote(e.target.value)} maxLength={120} rows={2} placeholder="Kurbanın yanında bırakacağın not..." style={{width:"100%",background:"rgba(255,255,255,0.05)",border:`1px solid ${T.dangerBorder}`,borderRadius:T.md,padding:`${T.s8} ${T.s12}`,color:T.textPrimary,fontSize:12,outline:"none",resize:"none",fontFamily:"'Nunito',sans-serif"}}/>
          </div>}
          {wEligible.length>0&&<Btn variant="accent" onClick={()=>{if(playerChoice!=null&&activeAb){submitPlayerChoice(playerChoice,activeAb.tip);}}} disabled={playerChoice===null} style={{width:"100%",justifyContent:"center",padding:"12px 0"}}>
            ✓ İksiri Uygula ve Kilitle
          </Btn>}
        </>}
        {!playerSubmitted&&<Btn variant="ghost" onClick={()=>{
          if(!fb||!lobbyCode||!myPlayer||playerSubmitted)return;
          const pRef=fb.ref(fb.db,`lobbies/${lobbyCode}/nightActions/${nightNum}/${myPlayer.id}`);
          fb.set(pRef,{targetId:null,roleId:myRoleId,actorId:myPlayer?.id,tip:"skip",skipped:true});
          setPlayerChoice(null);setWitchAbility(null);setPlayerSubmitted(true);
        }} style={{width:"100%",justifyContent:"center",padding:"10px 0",marginTop:T.s4}}>
          ⏭ Bu Geceyi Atla (iksir harcama)
        </Btn>}
      </GlassCard>;
    }
    // Dual ability roles (gozcu_vampir, kabus_vampir)
    if(myRole.isDualAbility){
      const vampirAlive=players.some(p=>p.rol?.id==="vampir"&&p.durum==="canlı");
      const primaryAb=myRole.abilities[0];
      const killAb=myRole.abilities[1];
      const{targets:dEligible}=getEligible(myRoleId,dualAbility?myRole.abilities.find(a=>a.id===dualAbility):primaryAb,myPlayer,players,nightNum,{});
      return <GlassCard style={{padding:T.s24}}>
        <div style={{display:"flex",alignItems:"center",gap:T.s12,marginBottom:T.s16}}>
          <span style={{fontSize:28}}>{myRole.emoji}</span>
          <div style={{fontFamily:"'IM Fell English',serif",color:myRole.renk,fontSize:16}}>{myRole.ad}</div>
        </div>
        <div style={{display:"flex",gap:T.s8,marginBottom:T.s16}}>
          <button onClick={()=>setDualAbility(primaryAb.id)} style={{flex:1,padding:`${T.s8} ${T.s12}`,borderRadius:T.md,cursor:"pointer",background:dualAbility===primaryAb.id||!dualAbility?myRole.renk+"33":T.surface,border:`1px solid ${dualAbility===primaryAb.id||!dualAbility?myRole.renk:T.border}`,color:dualAbility===primaryAb.id||!dualAbility?myRole.renk:T.textSecondary,fontWeight:700,fontSize:12}}>
            {primaryAb.tip==="reveal"?"🔮 Rol Gör":"🚫 Engelle"}
          </button>
          <button onClick={()=>!vampirAlive&&setDualAbility(killAb.id)} disabled={vampirAlive} style={{flex:1,padding:`${T.s8} ${T.s12}`,borderRadius:T.md,cursor:vampirAlive?"not-allowed":"pointer",opacity:vampirAlive?0.4:1,background:dualAbility===killAb.id?myRole.renk+"33":T.surface,border:`1px solid ${dualAbility===killAb.id?myRole.renk:T.border}`,color:dualAbility===killAb.id?myRole.renk:T.textSecondary,fontWeight:700,fontSize:12}}>
            💀 Öldür {vampirAlive?"🔒":""}
          </button>
        </div>
        {vampirAlive&&<p style={{fontSize:11,color:T.textMuted,marginBottom:T.s12,textAlign:"center"}}>⚠️ Oyunda vampir varken öldür seçeneği kilitli.</p>}
        <div style={{display:"flex",flexDirection:"column",gap:T.s8,marginBottom:T.s12}}>
          {dEligible.map(p=><div key={p.id} onClick={()=>setPlayerChoice(p.id===playerChoice?null:p.id)}
            style={{padding:`${T.s12} ${T.s16}`,borderRadius:T.md,cursor:"pointer",background:playerChoice===p.id?myRole.renk+"22":T.surface,border:`1px solid ${playerChoice===p.id?myRole.renk+"77":T.border}`,fontWeight:playerChoice===p.id?700:400,fontSize:14,color:playerChoice===p.id?T.textPrimary:T.textSecondary}}>
            {p.ad}
          </div>)}
        </div>
        <Btn variant="accent" onClick={()=>{if(playerChoice!=null){const selAb=myRole.abilities.find(a=>a.id===(dualAbility||primaryAb.id));submitPlayerChoice(playerChoice,selAb?.tip);}}} disabled={playerChoice===null} style={{width:"100%",justifyContent:"center",padding:"12px 0"}}>✓ Seçimi Onayla ve Kilitle</Btn>
        <Btn variant="ghost" onClick={()=>{if(!fb||!lobbyCode||!myPlayer||playerSubmitted)return;const pRef=fb.ref(fb.db,`lobbies/${lobbyCode}/nightActions/${nightNum}/${myPlayer.id}`);fb.set(pRef,{targetId:null,roleId:myRoleId,tip:"skip",skipped:true});setPlayerChoice(null);setPlayerSubmitted(true);}} style={{width:"100%",justifyContent:"center",padding:"10px 0",marginTop:T.s4}}>⏭ Bu Geceyi Atla</Btn>
      </GlassCard>;
    }

    return <GlassCard style={{padding:T.s24}}>
      <div style={{display:"flex",alignItems:"center",gap:T.s12,marginBottom:T.s8}}>
        <span style={{fontSize:28}}>{myRole.emoji}</span>
        <div>
          <div style={{fontFamily:"'IM Fell English',serif",color:myRole.renk,fontSize:16}}>{myRole.ad} — {myAbility.ad}</div>
          <div style={{fontSize:11,color:T.textMuted,marginTop:T.s4}}>⚠️ Sadece isimler görünür. Seçim sonrası kilitlenir.</div>
        </div>
      </div>
      {lockedTargets.length>0&&<div style={{background:"rgba(231,76,60,0.08)",border:"1px solid rgba(231,76,60,0.25)",borderRadius:T.md,padding:`${T.s8} ${T.s12}`,marginBottom:T.s8,display:"flex",alignItems:"center",gap:T.s8}}>
        <span style={{fontSize:14}}>🔒</span>
        <span style={{fontSize:12,color:T.danger}}>Üst üste 2 gece korunan kişi tekrar seçilemez.</span>
      </div>}
      <div style={{display:"flex",flexDirection:"column",gap:T.s8,margin:`${T.s12} 0`}}>
        {eligible.map(p=><div key={p.id} onClick={()=>setPlayerChoice(p.id)}
          style={{padding:`${T.s12} ${T.s16}`,borderRadius:T.md,cursor:"pointer",
            background:playerChoice===p.id?(myRole.renk||T.accent)+"22":T.surface,
            border:`1px solid ${playerChoice===p.id?(myRole.renk||T.accent)+"77":T.border}`,
            fontWeight:playerChoice===p.id?700:400,fontSize:14,
            color:playerChoice===p.id?T.textPrimary:T.textSecondary}}>
          {p.ad}
        </div>)}
        {lockedTargets.map(p=><div key={p.id}
          style={{padding:`${T.s12} ${T.s16}`,borderRadius:T.md,cursor:"not-allowed",
            background:"rgba(231,76,60,0.06)",
            border:"1px solid rgba(231,76,60,0.2)",
            fontSize:14,color:"rgba(255,255,255,0.25)",
            display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span>{p.ad}</span>
          <span style={{fontSize:12,color:"rgba(231,76,60,0.6)",display:"flex",alignItems:"center",gap:4}}>🔒 <span style={{fontSize:11}}>Üst üste 2× korundu</span></span>
        </div>)}
        {eligible.length===0&&lockedTargets.length===0&&<p style={{color:T.textMuted,fontSize:13,textAlign:"center"}}>Hedef yok.</p>}
      </div>
      {myAbility?.tip==="kill"&&<div style={{marginBottom:T.s8}}>
        <label style={{fontSize:11,color:T.textMuted,letterSpacing:1,display:"block",marginBottom:T.s4}}>ÖLÜM NOTU (opsiyonel)</label>
        <textarea value={deathNote} onChange={e=>setDeathNote(e.target.value)} maxLength={120} rows={2} placeholder="Kurbanın yanında bırakacağın not..." style={{width:"100%",background:"rgba(255,255,255,0.05)",border:`1px solid ${T.dangerBorder}`,borderRadius:T.md,padding:`${T.s8} ${T.s12}`,color:T.textPrimary,fontSize:12,outline:"none",resize:"none",fontFamily:"'Nunito',sans-serif"}}/>
      </div>}
      {eligible.length>0&&<Btn variant="accent" onClick={()=>playerChoice!=null&&submitPlayerChoice(playerChoice)}
        disabled={playerChoice===null} style={{width:"100%",justifyContent:"center",padding:"12px 0"}}>
        ✓ Seçimi Onayla ve Kilitle
      </Btn>}
      <Btn variant="ghost" onClick={()=>{
        if(!fb||!lobbyCode||!myPlayer||playerSubmitted)return;
        const pRef=fb.ref(fb.db,`lobbies/${lobbyCode}/nightActions/${nightNum}/${myPlayer.id}`);
        fb.set(pRef,{targetId:null,roleId:myRoleId,actorId:myPlayer?.id,tip:"skip",skipped:true});
        setPlayerChoice(null);setPlayerSubmitted(true);
      }} style={{width:"100%",justifyContent:"center",padding:"10px 0",marginTop:T.s4}}>
        ⏭ Bu Geceyi Atla
      </Btn>
    </GlassCard>;
  }

  // ── YÖNETİCİ KISMI ───────────────────────────────────────────────────────
  const stepsKey=stepsKey_top;
  const steps=steps_top;
  const step=step_top;
  const setStep=(v)=>{if(onHostStep)onHostStep(typeof v==="function"?v(step):v);};
  const actions=hostActions||[];
  const setActions=(v)=>{if(onHostActions)onHostActions(typeof v==="function"?v(actions):v);};
  const docHist=hostDocHist||{};
  const setDocHist=(v)=>{if(onHostDocHist)onHostDocHist(typeof v==="function"?v(docHist):v);}; 

  // TÜM ROLLER BİTTİ → Özet ekranı
  if(step>=steps.length){
    const kills=actions.filter(a=>a.tip==="kill"||a.tip==="witch_kill"||a.tip==="sheriff_shoot");
    const protects=actions.filter(a=>a.tip==="protect"||a.tip==="witch_protect");
    const reveals=actions.filter(a=>a.tip==="reveal");
    const revives=actions.filter(a=>a.tip==="revive");
    const preview=players.filter(p=>!p.isHost).map(p=>{
      const k=kills.find(x=>x.targetId===p.id);
      if(!k)return null;
      const isWitchKill=k.tip==="witch_kill";
      // Cadı öldürmesini doktor kurtaramaz, ama cadı koruma iksiri her şeyi kurtarır
      const witchProt=protects.find(x=>x.targetId===p.id&&x.tip==="witch_protect");
      const prot=witchProt||(isWitchKill?null:protects.find(x=>x.targetId===p.id));
      let blocked=false;
      if(witchProt){blocked=!isWitchKill;} // cadı korur; cadı öldürmesini cadı koruması da durduramaz
      else if(prot){const pr=roles.find(r=>r.id===prot.roleId),kr=roles.find(r=>r.id===k.roleId);if((pr?.defType==="ultimate"?2:pr?.defType==="standard"?1:0)>=(kr?.killType==="ultimate"?2:1))blocked=true;}
      const killerName=(k.actorId?players.find(x=>x.id===k.actorId):players.find(x=>x.rol?.id===k.roleId))?.ad||k.roleId;
      const protName=prot?players.find(x=>x.rol?.id===prot.roleId)?.ad||prot.roleId:"";
      return{p,k,blocked,killerName,protName,deathNote:k.deathNote};
    }).filter(Boolean);

    actionsRef.current=actions;
    const handleStartDay=async()=>{
      if(resolving)return;
      if(!nightResolved){
        await onResolve(actionsRef.current);
      }
      if(onDayStart)onDayStart();
    };

    return <GlassCard style={{padding:T.s24}}>
      <div style={{display:"flex",alignItems:"center",gap:T.s8,marginBottom:T.s16,paddingBottom:T.s12,borderBottom:`1px solid ${T.border}`}}>
        <span style={{fontSize:22}}>🌙</span>
        <span style={{fontFamily:"'IM Fell English',serif",color:T.accent,fontSize:17,letterSpacing:2}}>Gece Özeti</span>
        <Tag color={T.accent} size="sm">Gece {nightNum}</Tag>
      </div>

      {preview.length>0&&<div style={{marginBottom:T.s16}}>
        <p style={{fontSize:11,color:T.textMuted,letterSpacing:1,marginBottom:T.s8}}>⚔️ SALDIRILAR</p>
        <div style={{display:"flex",flexDirection:"column",gap:T.s8}}>
          {preview.map(({p,blocked,killerName,protName,deathNote},i)=><div key={i} style={{background:blocked?T.successDim:T.dangerDim,borderRadius:T.md,padding:`${T.s12} ${T.s16}`,border:`1px solid ${blocked?T.successBorder:T.dangerBorder}`}}>
            <div style={{display:"flex",alignItems:"center",gap:T.s8,marginBottom:deathNote&&!blocked?T.s4:0}}>
              <span style={{fontSize:20}}>{blocked?"🛡️":"💀"}</span>
              <div style={{flex:1}}>
                <span style={{fontWeight:700,color:blocked?T.success:T.danger,fontSize:13}}>
                  {blocked
                    ?`${killerName} saldırdı → ${p.ad} kurtuldu! (${protName} korudu)`
                    :`${killerName} öldürdü → ${p.ad} hayatını kaybetti!`}
                </span>
                <div style={{display:"flex",gap:T.s4,marginTop:T.s4}}>
                  <Tag color={p.rol?.renk||T.accent} size="sm">{p.rol?.emoji} {p.rol?.ad}</Tag>
                  {!blocked&&<Tag color={T.danger} size="sm">ÖLÜ</Tag>}
                  {blocked&&<Tag color={T.success} size="sm">SAĞ</Tag>}
                </div>
              </div>
            </div>
            {!blocked&&deathNote&&<p style={{fontSize:11,color:T.danger,fontStyle:"italic",marginTop:T.s4,paddingTop:T.s4,borderTop:"1px solid rgba(231,76,60,0.2)"}}>📝 "{deathNote}"</p>}
          </div>)}
        </div>
      </div>}

      {/* Cadı iksiri kullanımı özeti */}
      {(()=>{const witchActions=actions.filter(a=>a.roleId==="kadin"&&["witch_kill","witch_protect","reveal"].includes(a.tip));if(witchActions.length===0)return null;return<div style={{marginBottom:T.s16}}><p style={{fontSize:11,color:T.textMuted,letterSpacing:1,marginBottom:T.s8}}>🧙‍♀️ CADI İKSİRİ</p><div style={{display:"flex",flexDirection:"column",gap:T.s8}}>{witchActions.map((a,i)=>{const tgt=players.find(p=>p.id===a.targetId);const label=a.tip==="witch_kill"?"💀 Öldür İksiri":a.tip==="witch_protect"?"🛡️ Koru İksiri":"🔮 Rol Bak İksiri";return<div key={i} style={{background:"rgba(211,84,0,0.1)",borderRadius:T.md,padding:`${T.s8} ${T.s16}`,border:"1px solid rgba(211,84,0,0.3)",display:"flex",alignItems:"center",gap:T.s8}}><span style={{fontSize:14}}>{a.tip==="witch_kill"?"💀":a.tip==="witch_protect"?"🛡️":"🔮"}</span><span style={{fontSize:13,color:"#d35400"}}><strong>{label}</strong>{tgt?<> → <strong style={{color:T.textPrimary}}>{tgt.ad}</strong></>:null}</span></div>;})}</div></div>;})()} 
      {/* Engelleme özeti */}
      {(()=>{const blockActs=actions.filter(a=>a.tip==="kabus_block");if(blockActs.length===0)return null;return<div style={{marginBottom:T.s16}}><p style={{fontSize:11,color:T.textMuted,letterSpacing:1,marginBottom:T.s8}}>🚫 ENGELLEME</p><div style={{display:"flex",flexDirection:"column",gap:T.s8}}>{blockActs.map((a,i)=>{const blocker=a.actorId?players.find(p=>p.id===a.actorId):players.find(p=>p.rol?.id===a.roleId);const tgt=players.find(p=>p.id===a.targetId);return<div key={i} style={{background:"rgba(231,76,60,0.08)",borderRadius:T.md,padding:`${T.s8} ${T.s16}`,border:"1px solid rgba(231,76,60,0.25)",display:"flex",alignItems:"center",gap:T.s8}}><span style={{fontSize:14}}>🚫</span><span style={{fontSize:13,color:T.danger}}><strong style={{color:T.textPrimary}}>{blocker?.ad||"?"}</strong> → <strong style={{color:T.textPrimary}}>{tgt?.ad||"?"}</strong> engelledi (rol kullanamadı)</span></div>;})}</div></div>;})()}
      {reveals.length>0&&<div style={{marginBottom:T.s16}}>
        <p style={{fontSize:11,color:T.textMuted,letterSpacing:1,marginBottom:T.s8}}>🔮 ROL GÖRME</p>
        <div style={{display:"flex",flexDirection:"column",gap:T.s8}}>
          {reveals.map((r,i)=>{
            const tgt=players.find(p=>p.id===r.targetId);
            const seer=r.actorId?players.find(p=>p.id===r.actorId):players.find(p=>p.rol?.id===r.roleId);
            return <div key={i} style={{background:T.accentDim,borderRadius:T.md,padding:`${T.s12} ${T.s16}`,border:`1px solid ${T.accentBorder}`,display:"flex",alignItems:"center",gap:T.s8}}>
              <span style={{fontSize:16}}>🔮</span>
              <span style={{fontSize:13,color:T.accent}}><strong style={{color:T.textPrimary}}>{seer?.ad}</strong> → <strong style={{color:T.textPrimary}}>{tgt?.ad}</strong> rolünü gördü: <span style={{color:tgt?.rol?.renk||T.accent}}>{tgt?.rol?.emoji} {tgt?.rol?.ad}</span></span>
            </div>;
          })}
        </div>
      </div>}

      {revives.length>0&&<div style={{marginBottom:T.s16}}>
        <p style={{fontSize:11,color:T.textMuted,letterSpacing:1,marginBottom:T.s8}}>✨ DİRİLTME</p>
        <div style={{display:"flex",flexDirection:"column",gap:T.s8}}>
          {revives.map((r,i)=>{
            const tgt=players.find(p=>p.id===r.targetId);
            return <div key={i} style={{background:T.successDim,borderRadius:T.md,padding:`${T.s12} ${T.s16}`,border:`1px solid ${T.successBorder}`,display:"flex",alignItems:"center",gap:T.s8}}>
              <span style={{fontSize:16}}>✨</span>
              <span style={{fontSize:13,color:T.success}}><strong style={{color:T.textPrimary}}>{tgt?.ad}</strong> diriltildi ve oyuna geri döndü!</span>
            </div>;
          })}
        </div>
      </div>}

      {actions.length===0&&<div style={{textAlign:"center",padding:`${T.s24} 0`,marginBottom:T.s16}}>
        <div style={{fontSize:40,marginBottom:T.s8}}>🌙</div>
        <p style={{fontSize:13,color:T.textMuted}}>Bu gece sessiz geçti. Kimse bir şey yapmadı.</p>
      </div>}

      <div style={{display:"flex",flexDirection:"column",gap:T.s8,marginTop:T.s8}}>
        <Btn variant="success" onClick={handleStartDay} disabled={resolving} style={{width:"100%",justifyContent:"center",gap:T.s8,padding:"14px 0",fontSize:15}}>
          {resolving?<><div style={{width:18,height:18,border:"2px solid rgba(255,255,255,0.2)",borderTopColor:"#fff",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/> Uygulanıyor...</>:<>☀️ Gündüzü Başlat</>}
        </Btn>
      </div>
    </GlassCard>;
  }

  const stepObj=steps[step];
  const crid=stepObj?.roleId;
  const stepPlayerId=stepObj?.playerId;
  const cr=roleMap[crid]||roles.find(r=>r.id===crid);
  const actor=alive.find(p=>p.id===stepPlayerId);
  // Cadı için yönetici seçilen iksir, diğer roller için ilk uygun yetenek
  const ab_default=cr?.isWitch
    ?(hostWitchAbility?cr.abilities.find(a=>a.tip===hostWitchAbility):cr.abilities.find(a=>(actor?.abilityUses?.[a.id]??a.kullanim)!==0))
    :(cr?.abilities?.find(a=>["kill","protect","reveal","revive","announce","special","kabus_block","witch_kill","witch_protect","sheriff_shoot"].includes(a.tip))||cr?.abilities?.[0]);
  const ab=(cr?.isDualAbility&&hostDualChoice)?(cr.abilities.find(a=>a.tip===hostDualChoice)||ab_default):ab_default;
  const{targets:eligible,reason:noReason,selfAction}=getEligible(crid,ab,actor,players,nightNum,docHist);
  const noTgts=!selfAction&&eligible.length===0;

  const confirmAction=()=>{
    if(selfAction){
      setActions(a=>[...a,{roleId:crid,actorId:actor?.id,targetId:actor?.id,tip:ab?.tip||"special"}]);
      setHostTarget(null);setStep(s=>s+1);return;
    }
    if(hostTarget===null)return;
    let usedTip=ab?.tip||"special";
    // Dual ability: use hostDualChoice if set
    if(cr?.isDualAbility&&hostDualChoice){usedTip=hostDualChoice;}
    // Cadı: seçilen iksir tipini kullan
    if(cr?.isWitch&&hostWitchAbility){usedTip=hostWitchAbility;}
    if(usedTip==="protect"||usedTip==="witch_protect"){
      // Her doktorun gecmisi ayri tutulur: { [actorId]: { [targetId]: [geceler...] } }
      const actorKey=String(actor?.id);
      const targetKey=String(hostTarget);
      setDocHist(h=>{
        const actorHist=h[actorKey]||{};
        const updated={
          ...h,
          [actorKey]:{
            ...actorHist,
            [targetKey]:[...(actorHist[targetKey]||[]),nightNum]
          }
        };
        if(fb&&lobbyCode)fb.set(fb.ref(fb.db,`lobbies/${lobbyCode}/docHist`),updated);
        return updated;
      });
    }
    const isKillTip=usedTip==="kill"||usedTip==="witch_kill"||usedTip==="sheriff_shoot";
    // Rol görme: hemen Firebase'e yaz (sabah beklemeden yönetici onayında)
    if(usedTip==="reveal"&&hostTarget!=null&&fb&&lobbyCode&&!isEffectivelyBlocked(actor?.id,crid,usedTip,actions)){
      const seer=actor;
      const tgt=players.find(p=>p.id===hostTarget);
      if(seer&&tgt&&tgt.rol){
        fb.set(fb.ref(fb.db,`lobbies/${lobbyCode}/revealedRoles/${seer.id}`),{
          targetId:tgt.id,targetName:tgt.ad,
          targetRol:{id:tgt.rol.id||"",ad:tgt.rol.ad||"?",emoji:tgt.rol.emoji||"❓",renk:tgt.rol.renk||T.accent,takim:tgt.rol.takim||"nötr"},
          round:nightNum,ts:Date.now()
        });
      }
    }
    setActions(a=>[...a,{roleId:crid,actorId:actor?.id,targetId:hostTarget,tip:usedTip,...(isKillTip&&playerDeathNote?{deathNote:playerDeathNote}:{})}]);
    setHostTarget(null);setHostDualChoice(null);setHostWitchAbility(null);setStep(s=>s+1);
  };

  const suggestionName=players.find(p=>p.id===playerSuggestion)?.ad||"?";

  return <GlassCard style={{padding:T.s24}}>
    <div style={{display:"flex",gap:T.s4,marginBottom:T.s16,flexWrap:"wrap",alignItems:"center"}}>
      <span style={{fontSize:11,color:T.textMuted,letterSpacing:1,marginRight:T.s4}}>SIRA:</span>
      {steps.map((sobj,i)=>{
        const rid=sobj?.roleId||sobj;
        const pid=sobj?.playerId;
        const r=roleMap[rid]||roles.find(x=>x.id===rid);
        const act=pid?alive.find(p=>p.id===pid):alive.find(p=>p.rol?.id===rid);
        return <div key={String(rid)+(pid||'')+i} style={{display:"flex",alignItems:"center",gap:T.s4,padding:"3px 10px",borderRadius:20,background:i===step?(r?.renk||T.accent)+"22":"rgba(255,255,255,0.04)",border:`1px solid ${i===step?(r?.renk||T.accent)+"66":i<step?"rgba(255,255,255,0.08)":"rgba(255,255,255,0.04)"}`,opacity:i<step?0.4:1}}>
          <span style={{fontSize:13}}>{r?.emoji}</span>
          <span style={{fontSize:11,color:i===step?(r?.renk||T.accent):T.textMuted,fontWeight:i===step?700:400}}>{act?.ad||r?.ad}</span>
          {i===step&&<span style={{width:6,height:6,borderRadius:"50%",background:r?.renk||T.accent,display:"inline-block",animation:"pulse 1s ease infinite"}}/>}
        </div>;})}
    </div>
    {/* Gece seçim durumu: kimler seçimini yaptı, kimler yapmadı */}
    {(()=>{
      const pendingSteps=steps.slice(step);
      if(pendingSteps.length===0)return null;
      const waiting=pendingSteps.filter(sobj=>{
        const act=alive.find(p=>p.id===sobj.playerId);
        if(!act)return false;
        const submitted=nightSubmissions[String(act.id)];
        return!submitted;
      });
      const submitted=pendingSteps.filter(sobj=>{
        const act=alive.find(p=>p.id===sobj.playerId);
        if(!act)return false;
        return!!nightSubmissions[String(act.id)];
      });
      if(submitted.length===0&&waiting.length===0)return null;
      return <div style={{display:"flex",gap:T.s8,marginBottom:T.s12,flexWrap:"wrap",alignItems:"flex-start"}}>
        {submitted.length>0&&<div style={{flex:1,minWidth:140,background:"rgba(39,174,96,0.08)",border:"1px solid rgba(39,174,96,0.25)",borderRadius:T.md,padding:`${T.s6} ${T.s10||"10px"}`}}>
          <p style={{fontSize:9,color:T.success,letterSpacing:1,marginBottom:T.s4}}>✓ SEÇİM YAPTI</p>
          <div style={{display:"flex",flexWrap:"wrap",gap:T.s4}}>
            {submitted.map(sobj=>{const act=alive.find(p=>p.id===sobj.playerId);const r=roleMap[sobj.roleId]||roles.find(x=>x.id===sobj.roleId);const sub=nightSubmissions[String(act?.id)];return<span key={sobj.playerId} style={{fontSize:11,color:T.success,background:"rgba(39,174,96,0.12)",borderRadius:10,padding:"1px 7px",border:"1px solid rgba(39,174,96,0.3)"}}>{r?.emoji} {act?.ad}{sub?.skipped?" ⏭":""}</span>;})}</div>
        </div>}
        {waiting.length>0&&<div style={{flex:1,minWidth:140,background:"rgba(231,76,60,0.06)",border:"1px solid rgba(231,76,60,0.22)",borderRadius:T.md,padding:`${T.s6} ${T.s10||"10px"}`}}>
          <p style={{fontSize:9,color:T.warning,letterSpacing:1,marginBottom:T.s4}}>⏳ BEKLİYOR</p>
          <div style={{display:"flex",flexWrap:"wrap",gap:T.s4}}>
            {waiting.map(sobj=>{const act=alive.find(p=>p.id===sobj.playerId);const r=roleMap[sobj.roleId]||roles.find(x=>x.id===sobj.roleId);return<span key={sobj.playerId} style={{fontSize:11,color:T.warning,background:"rgba(243,156,18,0.10)",borderRadius:10,padding:"1px 7px",border:"1px solid rgba(243,156,18,0.28)",animation:sobj.playerId===stepPlayerId?"pulse 1.4s ease infinite":undefined}}>{r?.emoji} {act?.ad}</span>;})}</div>
        </div>}
      </div>;
    })()}

    <div style={{display:"flex",alignItems:"center",gap:T.s12,marginBottom:T.s12,background:(cr?.renk||T.accent)+"18",borderRadius:T.md,padding:`${T.s12} ${T.s16}`,border:`1px solid ${(cr?.renk||T.accent)+"44"}`}}>
      <span style={{fontSize:32}}>{cr?.emoji}</span>
      <div style={{flex:1}}>
        <div style={{fontFamily:"'IM Fell English',serif",color:cr?.renk||T.accent,fontSize:17,fontWeight:700}}>{cr?.ad}</div>
        <div style={{fontSize:12,color:T.textMuted}}>{step+1}/{steps.length} — {ab?.ad||"Eylem"}</div>
      </div>
      <div style={{textAlign:"right"}}>
        <div style={{fontWeight:700,color:T.textPrimary,fontSize:14}}>{actor?.ad||"?"}</div>
        <Tag color={cr?.renk||T.accent} size="sm">{TEAMS[cr?.takim]?.label||cr?.takim||"?"}</Tag>
        {cr?.id==="serif"&&ab&&<div style={{fontSize:10,color:T.warning,marginTop:2}}>🔫 {actor?.abilityUses?.a8??ab.kullanim} mermi kaldı</div>}
        {cr?.isWitch&&<div style={{fontSize:10,color:cr.renk,marginTop:2}}>
          {cr.abilities.map(a=>{const used=(actor?.abilityUses?.[a.id]??a.kullanim)===0;const label=a.tip==="reveal"?"🔮 Rol Bak":a.tip==="witch_kill"?"💀 Öldür":"🛡️ Koru";const isSelected=actions.some(x=>x.roleId==="kadin"&&x.tip===a.tip);const selTgt=isSelected?players.find(p=>p.id===actions.find(x=>x.roleId==="kadin"&&x.tip===a.tip)?.targetId)?.ad:null;return<span key={a.id} style={{marginLeft:4,color:isSelected?"#fff":used?"#666":cr.renk,background:isSelected?cr.renk+"55":"transparent",borderRadius:4,padding:"1px 4px",border:isSelected?`1px solid ${cr.renk}`:undefined}}>{label}{used&&!isSelected?" ✗":""}{isSelected?` ✓ ${selTgt||""}`:""}</span>;})}
        </div>}
      </div>
    </div>

    {playerSkipped&&
      <div style={{background:"rgba(243,156,18,0.10)",border:`1px solid ${T.primaryBorder}`,borderRadius:T.md,padding:`${T.s12} ${T.s16}`,marginBottom:T.s12,display:"flex",alignItems:"center",gap:T.s8}}>
        <span style={{fontSize:16}}>⏭</span>
        <p style={{fontSize:13,color:T.warning,fontWeight:700}}>{actor?.ad||"?"} bu geceyi atladı. Otomatik ilerlenecek...</p>
      </div>}

    {playerSuggestion!=null&&!noTgts&&
      <div style={{background:(cr?.renk||T.accent)+"10",border:`1px solid ${(cr?.renk||T.accent)+"55"}`,borderRadius:T.md,padding:`${T.s12} ${T.s16}`,marginBottom:T.s12}}>
        <p style={{fontSize:12,color:cr?.renk||T.accent,fontWeight:700}}>✓ Oyuncunun seçimi: <span style={{color:T.textPrimary}}>{suggestionName}</span>{cr?.isWitch&&playerWitchTip&&<span style={{color:cr.renk,marginLeft:6}}>{playerWitchTip==="witch_kill"?"💀 Öldür İksiri":playerWitchTip==="witch_protect"?"🛡️ Koru İksiri":playerWitchTip==="reveal"?"🔮 Rol Bak İksiri":""}</span>}</p>
        {playerDeathNote&&<p style={{fontSize:11,color:T.danger,marginTop:T.s4}}>📝 Ölüm notu: <em>"{playerDeathNote}"</em></p>}
        <p style={{fontSize:11,color:T.textMuted,marginTop:2}}>Aşağıda işaretlendi. Onaylayın veya farklı hedef seçin.</p>
      </div>}

    {noTgts

// ── JOIN / CREATE LOBBY SCREEN ────────────────────────────────────────────────
function JoinScreen({onJoined}){
  const savedSess=useMemo(()=>loadSession(),[]);
  const[name,setName]=useState(savedSess?.myName||"");
  const[code,setCode]=useState(savedSess?.lobbyCode||"");
  const[tab,setTab]=useState("join");
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState("");
  const[lobbyPwd,setLobbyPwd]=useState("");
  const[showPwd,setShowPwd]=useState(false);
  const[fbReady,setFbReady]=useState(!!window.__FB);

  useEffect(()=>{
    const params=new URLSearchParams(window.location.search);
    const c=params.get("lobi");
    if(c){setCode(c.toUpperCase());setTab("join");}
  },[]);
  useEffect(()=>{
    if(window.__FB){setFbReady(true);return;}
    const interval=setInterval(()=>{if(window.__FB){setFbReady(true);clearInterval(interval);}},200);
    return()=>clearInterval(interval);
  },[]);

  const doCreate=async()=>{
    if(!name.trim()){setErr("İsim gir.");return;}
    if(!fbReady){setErr("Bağlantı kuruluyor...");return;}
    const fb2=window.__FB;
    setLoading(true);setErr("");
    try{
      const pwdRef=fb2.ref(fb2.db,LOBBY_PASSWORD_PATH);
      const snap=await fb2.get(pwdRef);
      const correctPwd=snap.exists()?snap.val():DEFAULT_LOBBY_PASSWORD;
      if(lobbyPwd!==correctPwd){setErr("Lobi kurma şifresi yanlış.");setLoading(false);return;}
    }catch(e){if(lobbyPwd!==DEFAULT_LOBBY_PASSWORD){setErr("Lobi kurma şifresi yanlış.");setLoading(false);return;}}
    const lobbyCode=genLobbyCode();
    const lobbyRef=fb2.ref(fb2.db,`lobbies/${lobbyCode}`);
    await fb2.set(lobbyRef,{code:lobbyCode,status:"waiting",createdAt:Date.now(),players:{[name.trim()]:{name:name.trim(),isHost:true,joinedAt:Date.now()}}});
    setLoading(false);
    onJoined({lobbyCode,myName:name.trim(),isHost:true});
  };

  const doJoin=async()=>{
    if(!name.trim()){setErr("İsim gir.");return;}
    if(!code.trim()||code.trim().length<4){setErr("Geçerli bir lobi kodu gir.");return;}
    if(!fbReady){setErr("Bağlantı kuruluyor...");return;}
    setLoading(true);setErr("");
    const fb2=window.__FB;
    const upperCode=code.trim().toUpperCase();
    const lobbyRef=fb2.ref(fb2.db,`lobbies/${upperCode}`);
    const snap=await fb2.get(lobbyRef);
    if(!snap.exists()){setErr("Lobi bulunamadı. Kodu kontrol et.");setLoading(false);return;}
    const data=snap.val();
    const lobbyStatus=data.status;

    // Oyun bitmemiş ama lobi "ended" veya null: giriş yasak
    if(lobbyStatus==="ended"||lobbyStatus===null){
      // Oyun bitti mi diye kontrol: gameOver verisi varsa replay göster
      if(data.game&&data.gameLog){
        setLoading(false);
        onJoined({lobbyCode:upperCode,myName:name.trim(),isHost:false,isReplay:true});
        return;
      }
      setErr("Bu lobi kapanmış. Yeni bir lobiye katıl.");
      setLoading(false);
      return;
    }

    // Oyun bitmeden yönetici/oyuncular ayrıldıysa (abandoned) — giriş yasak
    if(lobbyStatus==="abandoned"){
      setErr("Bu lobi terk edildi. Yeni bir lobiye katıl.");
      setLoading(false);
      return;
    }

    // Replay: "finished" durumdaki lobi — sadece izle
    if(lobbyStatus==="finished"){
      setLoading(false);
      onJoined({lobbyCode:upperCode,myName:name.trim(),isHost:false,isReplay:true});
      return;
    }

    const isGamePlaying=lobbyStatus==="playing";
    // Oyun devam ediyorsa ve bu isim zaten oyuncuların arasındaysa → yeniden bağlan
    if(isGamePlaying&&data.players&&data.players[name.trim()]){
      // Presence güncelle — yeniden bağlandı
      const presRef=fb2.ref(fb2.db,`lobbies/${upperCode}/presence/${name.trim()}`);
      await fb2.set(presRef,{online:true,ts:Date.now(),isHost:false});
      setLoading(false);
      onJoined({lobbyCode:upperCode,myName:name.trim(),isHost:false});
      return;
    }
    if(data.players&&data.players[name.trim()]){setErr("Bu isim zaten alınmış.");setLoading(false);return;}
    if(isGamePlaying){
      const specRef=fb2.ref(fb2.db,`lobbies/${upperCode}/spectators/${name.trim()}`);
      await fb2.set(specRef,{name:name.trim(),joinedAt:Date.now(),isSpectator:true});
      setLoading(false);
      onJoined({lobbyCode:upperCode,myName:name.trim(),isHost:false,isSpectator:true});
      return;
    }
    const playerRef=fb2.ref(fb2.db,`lobbies/${upperCode}/players/${name.trim()}`);
    await fb2.set(playerRef,{name:name.trim(),isHost:false,joinedAt:Date.now()});
    setLoading(false);
    onJoined({lobbyCode:upperCode,myName:name.trim(),isHost:false});
  };

  return <main style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"calc(100vh - 65px)",padding:`${T.s48} ${T.s24}`}}>
    <div style={{animation:"float 4s ease-in-out infinite",marginBottom:T.s48}}><LuminaLogo size="lg"/></div>
    <div style={{width:"100%",maxWidth:380}}>
      <div style={{display:"flex",gap:T.s8,marginBottom:T.s24}}>
        <button onClick={()=>{setTab("create");setErr("");}} style={{flex:1,padding:`${T.s12} 0`,borderRadius:T.md,cursor:"pointer",background:tab==="create"?T.primaryDim:T.surface,color:tab==="create"?T.primary:T.textMuted,border:`1px solid ${tab==="create"?T.primaryBorder:T.border}`,fontWeight:700,fontSize:13}}>✨ Lobi Kur</button>

// ── FLOATING CHAT (sol alt köşe) ─────────────────────────────────────────────
function FloatingChat({lobbyCode,myName,players,phase,fb,isHost,nightNum,myPlayer}){
  const[open,setOpen]=useState(false);
  const[minimized,setMinimized]=useState(false);
  const[msgs,setMsgs]=useState([]);
  const[input,setInput]=useState("");
  const[unread,setUnread]=useState(0);
  const scrollRef=useRef();
  const lastSeenRef=useRef(0);

  const chatKey=phase==="gece"?`vampireChat/${nightNum}`:"morningChat";
  const isVampire=isHost||myPlayer?.rol?.takim==="karanlık";
  const isNight=phase==="gece";

  useEffect(()=>{
    if(!fb||!lobbyCode)return;
    if(isNight&&!isVampire){setMsgs([]);return;}
    const cRef=fb.ref(fb.db,`lobbies/${lobbyCode}/${chatKey}`);
    const unsub=fb.onValue(cRef,(snap)=>{
      const d=snap.val();
      const arr=d?Object.values(d).sort((a,b)=>a.ts-b.ts):[];
      setMsgs(arr);
      if(!open&&arr.length>lastSeenRef.current){
        setUnread(arr.length-lastSeenRef.current);
      }
    });
    return()=>unsub();
  },[fb,lobbyCode,chatKey,isNight,isVampire]);

  useEffect(()=>{
    if(open&&!minimized){lastSeenRef.current=msgs.length;setUnread(0);}
  },[open,minimized,msgs.length]);

  useEffect(()=>{
    if(scrollRef.current&&open&&!minimized)scrollRef.current.scrollTop=scrollRef.current.scrollHeight;
  },[msgs,open,minimized]);

  const canChat=isNight?(isVampire&&(isHost||myPlayer?.durum==="canlı")):(isHost||myPlayer?.durum==="canlı");
  const accentColor=isNight?"#c0392b":T.primary;
  const accentBorder=isNight?"rgba(192,57,43,0.5)":T.primaryBorder;

  const send=()=>{
    const txt=input.trim();if(!txt||!fb||!lobbyCode||(!isNight&&!canChat))return;
    const cRef=fb.ref(fb.db,`lobbies/${lobbyCode}/${chatKey}`);
    fb.push(cRef,{sender:myName,text:txt,ts:Date.now(),isHost:!!isHost});
    setInput("");
  };

  // Gece — vampir değilse gösterme
  if(isNight&&!isVampire&&!isHost)return null;

  const label=isNight?"🧛 Karanlık":"☀️ Köy Meydanı";
  const alivePlayers=players.filter(p=>p.durum==="canlı"&&!p.isHost);
  const vampireTeammates=players.filter(p=>p.rol?.takim==="karanlık"&&p.durum==="canlı"&&!p.isHost);

  return <>
    {/* Floating button — sol alt */}
    <button onClick={()=>{if(!open){setOpen(true);setMinimized(false);}else if(minimized){setMinimized(false);}else{setOpen(false);}}} style={{
      position:"fixed",bottom:"calc(76px + var(--vv-offset))",left:20,zIndex:410,
      width:54,height:54,borderRadius:"50%",
      background:open&&!minimized?accentColor:`rgba(20,10,50,0.92)`,
      border:`2px solid ${accentBorder}`,
      color:open&&!minimized?"#fff":accentColor,
      fontSize:24,cursor:"pointer",
      boxShadow:`0 4px 20px rgba(0,0,0,0.5)`,
      display:"flex",alignItems:"center",justifyContent:"center",
      transition:"background 0.2s ease, transform 0.15s ease",
      transform:open&&!minimized?"scale(1.08)":"scale(1)"
    }} title={label}>{isNight?"🧛":"💬"}
      {unread>0&&(!open||minimized)&&<div style={{position:"absolute",top:-4,right:-4,width:20,height:20,borderRadius:"50%",background:T.danger,color:"#fff",fontSize:11,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",border:"2px solid #0d0a1f"}}>{unread>9?"9+":unread}</div>}
    </button>

    {/* Chat panel */}
    {open&&<div style={{
      position:"fixed",bottom:"calc(140px + var(--vv-offset))",left:20,zIndex:410,
      width:380,maxWidth:"calc(100vw - 40px)",
      background:"linear-gradient(160deg,rgba(15,10,40,0.98),rgba(8,6,22,0.98))",
      border:`1.5px solid ${accentBorder}`,borderRadius:T.lg,
      boxShadow:"0 12px 48px rgba(0,0,0,0.7)",
      animation:"fadeUp 200ms ease-out",
      display:"flex",flexDirection:"column",overflow:"hidden",
      maxHeight:minimized?52:"70vh"
    }}>
      {/* Header — her zaman görünür */}
      <div style={{padding:`${T.s10||"10px"} ${T.s12}`,borderBottom:minimized?"none":`1px solid rgba(255,255,255,0.07)`,display:"flex",alignItems:"center",gap:T.s8,background:isNight?"rgba(192,57,43,0.12)":"rgba(243,156,18,0.08)",cursor:"pointer",flexShrink:0}} onClick={()=>setMinimized(m=>!m)}>
        <span style={{fontFamily:"'IM Fell English',serif",color:accentColor,fontSize:14,letterSpacing:1,flex:1}}>{label}</span>
        {!isNight&&<Tag color={T.success} size="sm">{alivePlayers.length} canlı</Tag>}
        {isNight&&<Tag color="#c0392b" size="sm">Gece {nightNum}</Tag>}
        {unread>0&&minimized&&<div style={{width:20,height:20,borderRadius:"50%",background:T.danger,color:"#fff",fontSize:11,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{unread>9?"9+":unread}</div>}
        <button onClick={(e)=>{e.stopPropagation();setOpen(false);}} style={{background:"none",border:"none",color:T.textMuted,cursor:"pointer",fontSize:14,padding:"2px 6px",lineHeight:1,marginLeft:T.s4}}>✕</button>
        <span style={{color:T.textMuted,fontSize:12,cursor:"pointer"}}>{minimized?"▲":"▼"}</span>
      </div>
      {/* Messages */}
      {!minimized&&<>
      {isNight&&isVampire&&vampireTeammates.length>0&&<div style={{display:"flex",gap:T.s4,flexWrap:"wrap",padding:`${T.s8} ${T.s12}`,background:"rgba(192,57,43,0.08)",borderBottom:"1px solid rgba(192,57,43,0.22)",flexShrink:0}}>
        <span style={{fontSize:10,color:"#c0392b",letterSpacing:1,marginRight:T.s4,flexShrink:0,alignSelf:"center"}}>KARANLIKTAKILER:</span>
        {vampireTeammates.map(v=><Tag key={v.id} color="#c0392b" size="sm">{v.rol?.emoji} {v.ad}</Tag>)}
      </div>}
      <div ref={scrollRef} style={{flex:1,overflowY:"auto",padding:`${T.s8} ${T.s12}`,display:"flex",flexDirection:"column",gap:T.s6,minHeight:200}}>
        {msgs.length===0&&<div style={{textAlign:"center",padding:`${T.s24} 0`}}>
          <p style={{fontSize:12,color:T.textMuted,fontStyle:"italic"}}>{isNight?"Karanlık sessiz...":"Köy uyanıyor..."}</p>
        </div>}
        {msgs.map((m,i)=>{
          const isMe=m.sender===myName;
          const sameSenderAsPrev=i>0&&msgs[i-1].sender===m.sender&&!!msgs[i-1].isHost===!!m.isHost;
          return <div key={i} style={{display:"flex",flexDirection:"column",alignItems:isMe?"flex-end":"flex-start",gap:1,marginTop:sameSenderAsPrev?0:T.s4}}>
            {!sameSenderAsPrev&&<span style={{fontSize:11,color:T.textMuted,marginLeft:isMe?0:4,marginRight:isMe?4:0}}>{m.isHost?"👑 ":isNight?"🧛 ":"☀️ "}{m.sender}</span>}
            <div style={{maxWidth:"82%",background:isMe?(isNight?"rgba(192,57,43,0.25)":"rgba(243,156,18,0.18)"):"rgba(255,255,255,0.07)",border:`1px solid ${isMe?(isNight?"rgba(192,57,43,0.5)":"rgba(243,156,18,0.4)"):"rgba(255,255,255,0.1)"}`,borderRadius:isMe?"14px 14px 4px 14px":"14px 14px 14px 4px",padding:`6px ${T.s12}`,fontSize:13,color:T.textPrimary,lineHeight:1.5,wordBreak:"break-word"}}>
              {m.text}
            </div>
          </div>;
        })}
      </div>
      {/* Input */}
      {canChat?<div style={{padding:`${T.s8} ${T.s12}`,borderTop:`1px solid rgba(255,255,255,0.07)`,display:"flex",gap:T.s6,flexShrink:0}}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}} placeholder={isNight?"Karanlıkta fısılda...":"Köyde konuş..."} maxLength={200} style={{flex:1,background:isNight?"rgba(192,57,43,0.08)":"rgba(243,156,18,0.06)",border:`1px solid ${isNight?"rgba(192,57,43,0.3)":"rgba(243,156,18,0.25)"}`,borderRadius:T.md,padding:`${T.s8} ${T.s10||"10px"}`,color:T.textPrimary,fontSize:13,outline:"none",fontFamily:"'Nunito',sans-serif"}}/>
        <button onClick={send} disabled={!input.trim()} style={{padding:`${T.s8} ${T.s12}`,borderRadius:T.md,border:`1px solid ${accentBorder}`,background:accentColor,color:"#fff",fontWeight:700,fontSize:15,cursor:"pointer",opacity:input.trim()?1:0.4,transition:"opacity 0.15s",flexShrink:0}}>↑</button>
      </div>:<div style={{padding:`${T.s8} ${T.s12}`,borderTop:`1px solid rgba(255,255,255,0.07)`,flexShrink:0}}><p style={{fontSize:11,color:T.textMuted,textAlign:"center"}}>Sadece canlı oyuncular yazabilir.</p></div>}
      </>}
    </div>}
  </>;
}

// ── PRESENCE / DISCONNECT TRACKING ───────────────────────────────────────────
function usePresence(fb,lobbyCode,myName,isHost){
  useEffect(()=>{
    if(!fb||!lobbyCode||!myName)return;
    const presRef=fb.ref(fb.db,`lobbies/${lobbyCode}/presence/${myName}`);
    const connRef=fb.ref(fb.db,".info/connected");
    const unsub=fb.onValue(connRef,(snap)=>{
      if(snap.val()===true){
        fb.set(presRef,{online:true,ts:Date.now(),isHost:!!isHost});
        // Disconnect olunca offline yaz
        try{
          const{onDisconnect}=window.__FBExt||{};
          if(onDisconnect){onDisconnect(presRef).set({online:false,ts:Date.now(),isHost:!!isHost});}
        }catch(e){}
      }
    });
    return()=>unsub();
  },[fb,lobbyCode,myName,isHost]);
}

function ChatMessage({m,isMe,accentColor,accentBorder,showTag=true}){
  // Güvenli unique key için ts+sender kullan, index'e güvenme
  return <div style={{display:"flex",flexDirection:"column",alignItems:isMe?"flex-end":"flex-start",gap:3,marginBottom:2,marginTop:showTag?T.s4:0}}>
    {showTag&&<span style={{fontSize:10,color:"rgba(255,255,255,0.35)",paddingLeft:isMe?0:4,paddingRight:isMe?4:0}}>{m.prefix||""}{m.sender}</span>}
    <div style={{maxWidth:"78%",background:isMe?accentColor:"rgba(255,255,255,0.06)",border:`1px solid ${isMe?accentBorder:"rgba(255,255,255,0.09)"}`,borderRadius:isMe?"14px 14px 4px 14px":"14px 14px 14px 4px",padding:"8px 13px",fontSize:13,color:"#f5e6c8",lineHeight:1.55,wordBreak:"break-word"}}>
      {m.text}
    </div>
  </div>;
}

function VampireChat({players,nightNum,myName,isHost,fb,lobbyCode,myPlayer}){
  const[msgs,setMsgs]=useState([]);
  const[input,setInput]=useState("");
  const scrollRef=useRef();
  const isVampire=isHost||myPlayer?.rol?.takim==="karanlık";
  useEffect(()=>{
    if(!fb||!lobbyCode)return;
    const cRef=fb.ref(fb.db,`lobbies/${lobbyCode}/vampireChat/${nightNum}`);
    const unsub=fb.onValue(cRef,(snap)=>{
      const d=snap.val();
      if(d){

// ── MOBİL KLAVYE FIX ────────────────────────────────────────────────────────
function useMobileKeyboardFix(){
  useEffect(()=>{
    const vv=window.visualViewport;
    if(!vv)return;
    const handle=()=>{
      const offset=window.innerHeight-vv.height-vv.offsetTop;
      document.documentElement.style.setProperty('--vv-offset',offset>0?offset+'px':'0px');
    };
    vv.addEventListener('resize',handle);
    vv.addEventListener('scroll',handle);
    return()=>{vv.removeEventListener('resize',handle);vv.removeEventListener('scroll',handle);};
  },[]);
}

// ── WAKELOCK + FULLSCREEN ─────────────────────────────────────────────────────
function useWakeLock(){
  const wakeLockRef=useRef(null);
  useEffect(()=>{
    const req=async()=>{try{if('wakeLock' in navigator){wakeLockRef.current=await navigator.wakeLock.request('screen');}}catch(e){}};
    req();
    const handleVis=()=>{if(document.visibilityState==='visible')req();};
    document.addEventListener('visibilitychange',handleVis);
    return()=>{document.removeEventListener('visibilitychange',handleVis);wakeLockRef.current?.release().catch(()=>{});};
  },[]);
}

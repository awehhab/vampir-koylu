// ── GAME SCREEN ───────────────────────────────────────────────────────────────
function GameScreen({players:initP,nightOrder,roles,onEnd,onPhaseChange,isHost,lobbyCode,myName,isSpectator,fb,onNewGame}){
  useWakeLock();useMobileKeyboardFix();
  const[players,setPlayers]=useState(initP);
  const[phase,setPhase]=useState("gündüz");
  const[round,setRound]=useState(1);
  const[logs,setLogs]=useState([]);
  const[tab,setTab]=useState("oyuncular");
  const[nightKey,setNightKey]=useState(0);
  const[voteKey,setVoteKey]=useState(0);
  const[dayKey,setDayKey]=useState(0);
  const[nightStep,setNightStep]=useState(0);
  const[nightActions,setNightActions]=useState([]);
  const[lastNightRecap,setLastNightRecap]=useState(null);
  const[nightDocHist,setNightDocHist]=useState({});
  const[nightResolving,setNightResolving]=useState(false);
  const[phaseFlash,setPhaseFlash]=useState(null);
  const[showRoles,setShowRoles]=useState(false);
  const[spectators,setSpectators]=useState([]);
  const[gameOver,setGameOver]=useState(null);
  const[revealedRole,setRevealedRole]=useState(null);
  const[morningNews,setMorningNews]=useState([]);
  const[lynchAnnounce,setLynchAnnounce]=useState(null);
  const[gevezeAnnounce,setGevezeAnnounce]=useState(null);
  const[baskanAnnounce,setBaskanAnnounce]=useState(null);
  const[showMorningPopup,setShowMorningPopup]=useState(false);
  const[pendingMorningNews,setPendingMorningNews]=useState([]);
  const[morningRevealedCount,setMorningRevealedCount]=useState(0);
  const[skipToast,setSkipToast]=useState(null);
  const[nightResolved,setNightResolved]=useState(false);
  const[lastWords,setLastWords]=useState(null);
  const[lastWordsSent,setLastWordsSent]=useState(false);
  const[presence,setPresence]=useState({});
  const[lastWordsToast,setLastWordsToast]=useState(null);
  const[activeDeathNote,setActiveDeathNote]=useState(null);
  const[showContactPicker,setShowContactPicker]=useState(false);
  const[contactTarget,setContactTarget]=useState(null);
  const[contactText,setContactText]=useState("");
  const[hostMsgToast,setHostMsgToast]=useState(null);
  const seenSkipKeys=useRef(new Set());
  const seenHostMsgKeys=useRef(new Set());
  const seenLastWordsKeys=useRef(new Set());
  const noteNamesRef=useRef([]);
  const noteIdxRef=useRef(0);

  // Presence listener — kimin bağlı olduğunu takip et
  useEffect(()=>{
    if(!fb||!lobbyCode)return;
    const presRef=fb.ref(fb.db,`lobbies/${lobbyCode}/presence`);
    const unsub=fb.onValue(presRef,(snap)=>{
      const d=snap.val();
      setPresence(d||{});
    });
    // Kendi presence'ını yaz
    if(myName){
      const myPresRef=fb.ref(fb.db,`lobbies/${lobbyCode}/presence/${myName}`);
      fb.set(myPresRef,{online:true,ts:Date.now(),isHost:!!isHost});
      // Sayfa kapanınca temizle
      const cleanup=()=>fb.set(myPresRef,{online:false,ts:Date.now()});
      window.addEventListener("beforeunload",cleanup);
      return()=>{unsub();window.removeEventListener("beforeunload",cleanup);};
    }
    return()=>unsub();
  },[fb,lobbyCode,myName,isHost]);

  const checkGameOver=useCallback((currentPlayers)=>{
    if(!isHost)return;
    const alive=currentPlayers.filter(p=>p.durum==="canlı"&&!p.isHost);
    const vampCount=alive.filter(p=>p.rol?.takim==="karanlık").length;
    const serialKillerCount=alive.filter(p=>p.rol?.isSerialKiller).length;
    const goodCount=alive.filter(p=>p.rol?.takim==="iyi").length;
    const neutralNonSKCount=alive.filter(p=>p.rol?.takim==="nötr"&&!p.rol?.isSerialKiller&&!p.rol?.isJester).length;
    if(alive.length===0)return;
    // Seri katil: tek kişi kalırsa kazanır
    if(alive.length===1&&serialKillerCount===1){
      setGameOver({winner:"seri_katil",reason:"Seri Katil herkesi öldürdü! Seri Katil kazandı!"});
      if(fb&&lobbyCode)fb.set(fb.ref(fb.db,`lobbies/${lobbyCode}/gameOver`),{winner:"seri_katil",reason:"Seri Katil herkesi öldürdü!"});
      return;
    }
    // İyiler kazanır: tüm vampirler ve tüm seri katiller yok edilmeli
    if(vampCount===0&&serialKillerCount===0){
      setGameOver({winner:"iyi",reason:"Tüm tehditler yok edildi! Köy kurtuldu!"});
      if(fb&&lobbyCode)fb.set(fb.ref(fb.db,`lobbies/${lobbyCode}/gameOver`),{winner:"iyi",reason:"Tüm tehditler yok edildi!"});
      return;
    }
    // Karanlık kazanır: vampir sayısı >= köylü (iyi + nötr non-SK) sayısı
    if(vampCount>0&&vampCount>=goodCount+neutralNonSKCount){
      setGameOver({winner:"karanlık",reason:"Vampirler köyü ele geçirdi!"});
      if(fb&&lobbyCode)fb.set(fb.ref(fb.db,`lobbies/${lobbyCode}/gameOver`),{winner:"karanlık",reason:"Vampirler köyü ele geçirdi!"});
      return;
    }
  },[isHost,fb,lobbyCode]);

  const log=useCallback((tip,parts,isNight=false,label=null)=>{
    const p=typeof parts==="string"?[{t:"text",v:parts}]:parts;
    const entry={tip,zaman:ts(),parts:p,isNight,...(label?{label}:{})};
    setLogs(l=>[...l,entry]);
    if(isHost&&fb){const logsRef=fb.ref(fb.db,`lobbies/${lobbyCode}/logs`);fb.push(logsRef,entry);}
  },[isHost,lobbyCode,fb]);

  useEffect(()=>{
    if(!fb||!lobbyCode)return;
    const gameRef=fb.ref(fb.db,`lobbies/${lobbyCode}/game`);
    const unsub=fb.onValue(gameRef,(snap)=>{
      const data=snap.val();if(!data)return;
      if(!isHost){
        if(data.players)setPlayers(data.players);
        if(data.phase){
          const newPhase=data.phase;
          setPhase(newPhase);onPhaseChange(newPhase);
          // Gece başlarken önceki gece sonuçlarını temizle
          if(newPhase==="gece"){setRevealedRole(null);setGevezeAnnounce(null);}
        }
        if(data.round)setRound(data.round);
      }
    });
    return()=>unsub();
  },[fb,lobbyCode,isHost]);

  useEffect(()=>{
    if(!fb||!lobbyCode||isHost)return;
    const goRef=fb.ref(fb.db,`lobbies/${lobbyCode}/gameOver`);
    const unsub=fb.onValue(goRef,(snap)=>{
      const d=snap.val();
      if(d)setGameOver(d);
    });
    return()=>unsub();
  },[fb,lobbyCode,isHost]);

  // Asılan kişi rol duyurusu — herkese Firebase üzerinden gelir
  useEffect(()=>{
    if(!fb||!lobbyCode||isHost)return;
    const laRef=fb.ref(fb.db,`lobbies/${lobbyCode}/lynchAnnounce`);
    const unsub=fb.onValue(laRef,(snap)=>{
      const d=snap.val();
      if(d&&d.ts&&Date.now()-d.ts<10000){setLynchAnnounce(d);setTimeout(()=>setLynchAnnounce(null),5000);}
    });
    return()=>unsub();
  },[fb,lobbyCode,isHost]);

  // Geveze açıklaması — herkese Firebase üzerinden gelir, sadece gündüz gözükür
  useEffect(()=>{
    if(!fb||!lobbyCode)return;
    const gaRef=fb.ref(fb.db,`lobbies/${lobbyCode}/gevezeAnnounce`);
    const unsub=fb.onValue(gaRef,(snap)=>{
      const d=snap.val();
      if(d&&d.ts&&d.round===round&&phase==="gündüz"){setGevezeAnnounce(d);}
      else if(!d){setGevezeAnnounce(null);}
    });
    return()=>unsub();
  },[fb,lobbyCode,isHost,phase,round]);

  // Belediye Başkanı onayı — herkese Firebase üzerinden gelir, sadece gündüz gözükür
  useEffect(()=>{
    if(!fb||!lobbyCode)return;
    const baRef=fb.ref(fb.db,`lobbies/${lobbyCode}/baskanAnnounce`);
    const unsub=fb.onValue(baRef,(snap)=>{
      const d=snap.val();
      if(d&&d.ts&&d.round===round&&phase==="gündüz"){setBaskanAnnounce(d);}
      else if(!d){setBaskanAnnounce(null);}
    });
    return()=>unsub();
  },[fb,lobbyCode,isHost,phase,round]);

  // Skip notif listener — yönetici için "X rolü atladı" tostu
  useEffect(()=>{
    if(!fb||!lobbyCode||!isHost)return;
    const snRef=fb.ref(fb.db,`lobbies/${lobbyCode}/skipNotifs`);
    const unsub=fb.onValue(snRef,(snap)=>{
      const d=snap.val();if(!d)return;
      const entries=Object.entries(d);
      const latest=entries.filter(([k])=>!seenSkipKeys.current.has(k)).sort((a,b)=>a[1].ts-b[1].ts);
      latest.forEach(([k,v])=>{
        seenSkipKeys.current.add(k);
        if(Date.now()-v.ts<15000){

  const resolveNight=async(actions)=>{
    // Engelleme uygula: escort/kabus_vampir tarafından ziyaret edilen kişiler rolünü kullanamaz
    // Mutlak öldürme (ultimate killType) engellemeye takılmaz
    const blocks=actions.filter(a=>a.tip==="kabus_block");
    const nonSkipActions=actions.filter(a=>a.tip!=="skip");
    // Engelleme, sadece SIRADA ÖNCE gerçekleştiyse geçerlidir (rol kullanım önceliği).
    // Bir rol kendi sırasında hareket ettiyse, ondan sonra sırası gelen bir engelleyici onu artık etkileyemez.
    const effectiveActions=nonSkipActions.filter(a=>{
      if(a.tip==="kabus_block")return true; // blok kendisi her zaman geçer
      const actor=a.actorId?players.find(p=>p.id===a.actorId):players.find(p=>p.rol?.id===a.roleId);
      if(!actor)return true;
      const aIdx=actions.indexOf(a);
      const priorBlock=blocks.find(b=>b.targetId===actor.id&&actions.indexOf(b)<aIdx);
      if(!priorBlock)return true;
      // Engellendi ama mutlak öldürme veya cadı iksiri ise geçer
      const rolDef=roles.find(r=>r.id===a.roleId);
      if(rolDef?.killType==="ultimate")return true;
      if(a.tip==="witch_kill"||a.tip==="witch_protect")return true; // Cadı iksirleri engellenemez
      // Engelleme logu
      log("block",[mkText(`🚫 `),mkPlayer(actor),mkText(` bu gece engellendi — rol kullanamadı!`,{color:T.danger})],true);
      return false; // engellendi
    });
    const kills=effectiveActions.filter(a=>["kill","witch_kill"].includes(a.tip)&&a.roleId!=="hirsiz");
    const protects=effectiveActions.filter(a=>["protect","witch_protect"].includes(a.tip));
    let updated=[...players];
    updated=updated.map(p=>{
      const k=kills.find(x=>x.targetId===p.id);if(!k)return p;
      // Vampir seri katili öldüremez
      const killer=k.actorId?players.find(x=>x.id===k.actorId):players.find(x=>x.rol?.id===k.roleId);
      if(k.tip==="kill"&&killer?.rol?.takim==="karanlık"&&p.rol?.isSerialKiller){
        const killerName=killer?.ad||k.roleId;
        log("protect",[mkText(`🔪 ${killerName} Seri Katil'i hedef aldı — ancak Seri Katil vampirler tarafından öldürülemez! `,{color:T.warning}),mkPlayer(p),mkText(" yaşıyor!")],true);
        return p;
      }
      const isWitchKill=k.tip==="witch_kill";
      const prot=!isWitchKill?protects.find(x=>x.targetId===p.id):null;
      if(prot){
        const pr=roles.find(r=>r.id===prot.roleId),kr=roles.find(r=>r.id===k.roleId);
        if((pr?.defType==="ultimate"?2:pr?.defType==="standard"?1:0)>=(kr?.killType==="ultimate"?2:1)){
          const killerName=(k.actorId?players.find(x=>x.id===k.actorId):players.find(x=>x.rol?.id===k.roleId))?.ad||k.roleId;
          const protName=players.find(x=>x.rol?.id===prot.roleId)?.ad||prot.roleId;
          log("protect",[mkText(`🛡️ ${killerName} → `),mkPlayer(p),mkText(` öldürmek istedi, ama ${protName} korudu. `,{color:T.success}),mkPlayer(p),mkText(` yaşıyor!`)],true);
          return p;
        }
      }
      const killerName=(k.actorId?players.find(x=>x.id===k.actorId):players.find(x=>x.rol?.id===k.roleId))?.ad||k.roleId;
      log("kill",[mkText(`${killerName} → `),mkPlayer(p),mkText(" öldürdü! ("),mkRole(p.rol),mkText(")")],true);
      return{...p,durum:"ölü",...(k.deathNote?{deathNote:k.deathNote}:{})};
    });

    // Cadı öldürmesi
    effectiveActions.filter(a=>a.tip==="witch_kill").forEach(a=>{
      const witchIdx=a.actorId?updated.findIndex(x=>x.id===a.actorId):updated.findIndex(x=>x.rol?.id==="kadin");
      if(witchIdx>=0&&(updated[witchIdx].abilityUses?.a5??1)>0){
        updated[witchIdx]={...updated[witchIdx],abilityUses:{...updated[witchIdx].abilityUses,a5:0}};
      }
    });
    // Cadı koruma iksiri — MUTLAK KORUMA: engelleme geçemez, her türlü öldürmeye karşı korur
    // Not: witch_protect effectiveActions'dan gelir — ama cadı escort tarafından engellenebilir.
    // Ancak cadı koru iksiri kullanıyorsa ve engellenmemişse, koruma mutlaktır.
    // Ayrıca raw actions içinde de witch_protect var mı kontrol et (escort engellemiş olsa bile cadı iksiri geçmeli değil;
    // sadece escort engellenmemişse effectiveActions'da olur — bu doğru davranış).
    effectiveActions.filter(a=>a.tip==="witch_protect").forEach(a=>{
      const t=updated.find(p=>p.id===a.targetId);
      if(t){
        const witchIdx=a.actorId?updated.findIndex(x=>x.id===a.actorId):updated.findIndex(x=>x.rol?.id==="kadin");
        if(witchIdx>=0)updated[witchIdx]={...updated[witchIdx],abilityUses:{...updated[witchIdx].abilityUses,a6:0}};
        // Mutlak koruma: hedef ölmüşse (herhangi bir şekilde) dirilt — witch_kill hariç
        const wasKilledByNonWitch=kills.find(x=>x.targetId===a.targetId&&x.tip!=="witch_kill");
        if(wasKilledByNonWitch&&updated.find(p=>p.id===a.targetId)?.durum==="ölü"){
          updated=updated.map(x=>x.id===a.targetId?{...x,durum:"canlı"}:x);
          const witchName=players.find(x=>x.rol?.id==="kadin")?.ad||"Cadı";
          log("protect",[mkText(`🧙‍♀️ ${witchName} koru iksiriyle `),mkPlayer(t),mkText(" mutlak koruma altına aldı!",{color:T.success})],true);
        }
        // Şerif vurmuşsa da koru (sheriff_shoot ayrı işlendiği için burada da kontrol et)
        const wasKilledBySheriff=effectiveActions.find(x=>x.targetId===a.targetId&&x.tip==="sheriff_shoot");
        if(wasKilledBySheriff&&updated.find(p=>p.id===a.targetId)?.durum==="ölü"){
          updated=updated.map(x=>x.id===a.targetId?{...x,durum:"canlı"}:x);
          const witchName=players.find(x=>x.rol?.id==="kadin")?.ad||"Cadı";
          log("protect",[mkText(`🧙‍♀️ ${witchName} koru iksiriyle `),mkPlayer(t),mkText(" şerif mermisinden korudu!",{color:T.success})],true);
        }
      }
    });
    // Hırsız: hedefi öldür ve rolünü al
    effectiveActions.filter(a=>a.roleId==="hirsiz"&&a.tip==="kill").forEach(a=>{
      const thief=a.actorId?updated.find(p=>p.id===a.actorId):updated.find(p=>p.rol?.id==="hirsiz");
      const target=updated.find(p=>p.id===a.targetId);
      if(!thief||!target)return;
      // Hırsız zaten rol çalmışsa (hirsiz değilse id) işlem yapma
      if(thief.rol?.id!=="hirsiz")return;
      // Seri katil hedef alınamaz (zaten kill tipinde ama ek güvenlik)
      if(target.rol?.isSerialKiller){
        log("protect",[mkText(`🦝 Hırsız Seri Katil'i hedef aldı ama başaramadı!`,{color:T.warning})],true);
        return;
      }
      // Hedefi öldür
      updated=updated.map(p=>{
        if(p.id===target.id)return{...p,durum:"ölü"};
        if(p.id===thief.id){
          // Hırsız'a hedefin rolünü ver — tüm ability kullanımları sıfırlanır, yeni role göre ayarlanır
          const stolenRole={...target.rol};
          const newAbilityUses=Object.fromEntries((stolenRole.abilities||[]).map(ab=>[ab.id,ab.kullanim]));
          log("kill",[mkText(`🦝 Hırsız → `),mkPlayer(target),mkText(` öldürdü ve rolünü çaldı: `),mkRole(stolenRole)],true);
          // Takım değişimi logla (önemli: vampir rolü çalındıysa karanlık takımına geçer)
          if(stolenRole.takim&&stolenRole.takim!=="nötr"){
            const teamLabel=TEAMS[stolenRole.takim]?.label||stolenRole.takim;
            log("day_announce",[mkText(`🦝 Hırsız artık ${teamLabel} takımında! (${stolenRole.ad} rolüyle)`,{color:stolenRole.renk||T.warning})],true);
          }
          return{...p,rol:stolenRole,abilityUses:newAbilityUses};
        }
        return p;
      });
    });
    // Hırsız rol çaldıktan sonra kazanma koşulunu hemen kontrol et
    checkGameOver(updated);

    // Şerif ateşi — doktor/cadı koruması varsa hedef ölmez ama şerif mermi harcar
    effectiveActions.filter(a=>a.tip==="sheriff_shoot").forEach(a=>{
      const t=updated.find(p=>p.id===a.targetId);
      const sheriff=a.actorId?updated.find(p=>p.id===a.actorId):updated.find(p=>p.rol?.id==="serif");
      if(!t||!sheriff||sheriff.durum==="ölü")return;
      // Mermi harcan
      updated=updated.map(x=>{
        if(x.id===sheriff.id){const ab8=(x.abilityUses?.a8??2)-1;return{...x,abilityUses:{...x.abilityUses,a8:Math.max(0,ab8)}};}
        return x;
      });
      // Koruma kontrolü — doktor veya cadı koru iksiri korumuşsa şerif mermisi de geçmez
      const prot=protects.find(x=>x.targetId===a.targetId);
      if(prot){
        const pr=roles.find(r=>r.id===prot.roleId);
        if((pr?.defType==="ultimate"?2:pr?.defType==="standard"?1:0)>=1){
          const protName=players.find(x=>x.rol?.id===prot.roleId)?.ad||prot.roleId;
          log("protect",[mkText(`🛡️ Şerif → `),mkPlayer(t),mkText(` ateş etti ama ${protName} korudu! `,{color:T.success}),mkPlayer(t),mkText(` yaşıyor!`)],true);
          return;
        }
      }
      if(t.durum==="ölü"){
        log("kill",[mkText(`🤠 Şerif → `),mkPlayer(t),mkText(" ateş etti ama hedef bu gece zaten başka bir şekilde ölmüştü.",{color:T.textMuted})],true);
        return;
      }
      const isEvil=t.rol?.takim==="karanlık"||t.rol?.takim==="nötr";
      updated=updated.map(x=>x.id===a.targetId?{...x,durum:"ölü"}:x);
      if(!isEvil){
        updated=updated.map(x=>x.id===sheriff.id?{...x,durum:"ölü"}:x);
        log("kill",[mkText(`🤠 Şerif `),mkPlayer(t),mkText(" vurdu ama masumdı! Şerif de öldü!",{color:T.danger})],true);
      } else {
        log("kill",[mkText(`🤠 Şerif → `),mkPlayer(t),mkText(" vurdu! ("),mkRole(t.rol),mkText(")")],true);
      }
    });

    // Rahip diriltme — gece uygulanmaz; gündüze ertelenir (pendingRevives olarak sakla)
    const pendingReviveIds=[];
    effectiveActions.filter(a=>a.tip==="revive").forEach(a=>{
      const t=players.find(p=>p.id===a.targetId);
      if(t){
        const rahipIdx=updated.findIndex(x=>x.rol?.id==="rahip");
        if(rahipIdx>=0)updated[rahipIdx]={...updated[rahipIdx],abilityUses:{...updated[rahipIdx].abilityUses,a9:0}};
        // Oyuncuyu HEMEN öldürme (zaten ölü) ama gündüze kadar ölü bırak
        pendingReviveIds.push(a.targetId);
        log("revive",[mkText("⛪ Rahip gece bir kişiyi seçti — sabah dirilecek.")],true);
      }
    });

    // Gece bu turda öldürülen oyuncuların id seti
    const killedThisNight=new Set(updated.filter(p=>p.durum==="ölü"&&players.find(x=>x.id===p.id)?.durum==="canlı").map(p=>p.id));

    // reveal (gözcü, cadı rol bak vb.) — sadece reveal yetkisi olanlara, gündüze ertelenir
    const pendingReveals=[];
    effectiveActions.filter(a=>a.tip==="reveal").forEach(a=>{
      const t=players.find(p=>p.id===a.targetId);
      const seer=a.actorId?players.find(p=>p.id===a.actorId):players.find(p=>p.rol?.id===a.roleId);
      if(seer&&killedThisNight.has(seer.id))return;
      if(seer?.rol?.id==="kadin"){
        const witchIdx=updated.findIndex(x=>x.rol?.id==="kadin");
        if(witchIdx>=0)updated[witchIdx]={...updated[witchIdx],abilityUses:{...updated[witchIdx].abilityUses,a4:0}};
      }
      if(seer?.rol?.id==="geveze"){
        const gevezeIdx=updated.findIndex(x=>x.rol?.id==="geveze");
        if(gevezeIdx>=0)updated[gevezeIdx]={...updated[gevezeIdx],abilityUses:{...updated[gevezeIdx].abilityUses,a10:0}};
      }
      if(t&&t.rol){
        const isGeveze=seer?.rol?.id==="geveze";
        log("reveal",[mkText(`🔮 ${seer?.ad||"?"} → `),mkPlayer(t),mkText(" rolünü gördü: "),mkRole(t.rol)],true);
        pendingReveals.push({seerId:seer?.id,seerRoleId:a.roleId,targetId:t.id,targetName:t.ad,targetRol:{id:t.rol.id||"",ad:t.rol.ad||"?",emoji:t.rol.emoji||"❓",renk:t.rol.renk||T.accent,takim:t.rol.takim||"nötr"},isGeveze,round});
      }
    });

    setPlayers(updated);

    // Sabah haberlerini topla
    const morningNews=[];
    players.filter(p=>!p.isHost).forEach(p=>{
      const wasAlive=p.durum==="canlı";
      const nowDead=updated.find(x=>x.id===p.id)?.durum==="ölü";
      if(wasAlive&&nowDead){
        const ka=actions.find(x=>x.targetId===p.id&&["kill","witch_kill","sheriff_shoot"].includes(x.tip));
        morningNews.push({type:"death",name:p.ad,note:ka?.deathNote||null,rolAd:p.rol?.ad||null,rolEmoji:p.rol?.emoji||null,rolRenk:p.rol?.renk||null,killerTip:ka?.tip||null});
      }
    });
    players.filter(p=>p.rol?.id==="serif"&&p.durum==="canlı").forEach(p=>{
      const nowDead=updated.find(x=>x.id===p.id)?.durum==="ölü";
      if(nowDead&&!morningNews.find(n=>n.name===p.ad)){
        morningNews.push({type:"death",name:p.ad,note:null,rolAd:p.rol?.ad||null,rolEmoji:p.rol?.emoji||null,rolRenk:p.rol?.renk||null,killerTip:"sheriff_shoot"});
      }
    });
    // Rahip diriltilenler sabah haberlerine ekle
    pendingReviveIds.forEach(rid=>{
      const t=updated.find(p=>p.id===rid);
      if(t)morningNews.push({type:"revive",name:t.ad});
    });

    await new Promise(resolve=>{
      if(fb&&lobbyCode){
        const gameRef=fb.ref(fb.db,`lobbies/${lobbyCode}/game`);
        // Pending revive ve reveal'leri Firebase'e yaz — gündüz başlayınca uygulanacak
        const pendingRef=fb.ref(fb.db,`lobbies/${lobbyCode}/pendingDayActions`);
        Promise.all([
          fb.update(gameRef,{players:updated}),
          morningNews.length>0?fb.set(fb.ref(fb.db,`lobbies/${lobbyCode}/morningNews`),morningNews):fb.remove(fb.ref(fb.db,`lobbies/${lobbyCode}/morningNews`)),
          (pendingReviveIds.length>0||pendingReveals.length>0)?fb.set(pendingRef,{reviveIds:pendingReviveIds,reveals:pendingReveals,round}):fb.remove(pendingRef),
        ]).then(()=>resolve()).catch(()=>resolve());
      } else resolve();
    });
    setTimeout(()=>{
      checkGameOver(updated);
      setNightResolving(false);
      setNightResolved(true);
    },0);
  };

  const alive=players.filter(p=>p.durum==="canlı"&&!p.isHost);
  const dead=players.filter(p=>p.durum==="ölü"&&!p.isHost);
  const night=phase==="gece",activeColor=night?T.accent:T.primary,activeDim=night?T.accentDim:T.primaryDim,activeBorder=night?T.accentBorder:T.primaryBorder;
  const myPlayer=players.find(p=>p.ad===myName);
  const isVampireOrHost=isHost||myPlayer?.rol?.takim==="karanlık";
  const TABS=[{id:"oyuncular",label:"Oyuncular",icon:"👥"},{id:"eylem",label:night?"Rol Sırası":"Oylama",icon:night?"🌙":"⚖️"},{id:"günlük",label:"Günlük",icon:"📜"}];
  const allPlayers=players.filter(p=>!p.isHost);

  // Popup/duyuru elementleri — bileşen değil, doğrudan JSX değişkeni olarak tanımla
  // (iç bileşen tanımı React'te her render'da farklı referans oluşturur → error #130)
  const skipToastEl=skipToast?<div style={{position:"fixed",top:80,left:"50%",transform:"translateX(-50%)",zIndex:560,background:"rgba(30,20,60,0.97)",border:`1px solid ${T.accentBorder}`,borderRadius:T.lg,padding:`${T.s8} ${T.s24}`,boxShadow:"0 8px 32px rgba(0,0,0,0.6)",animation:"fadeUp 300ms ease-out",whiteSpace:"nowrap"}}>
    <span style={{fontSize:13,color:T.accent}}>{skipToast}</span>
  </div>:null;
  const hostMsgToastEl=hostMsgToast?<div style={{position:"fixed",top:80,left:"50%",transform:"translateX(-50%)",zIndex:565,width:380,maxWidth:"90vw",background:"linear-gradient(160deg,rgba(35,20,65,0.98),rgba(13,10,31,0.98))",border:`1.5px solid ${T.primary}`,borderRadius:T.lg,padding:`${T.s12} ${T.s16}`,boxShadow:`0 12px 48px rgba(0,0,0,0.7), 0 0 0 1px ${T.primaryBorder}`,animation:"fadeUp 300ms ease-out"}}>
    <div style={{display:"flex",alignItems:"center",gap:T.s6,marginBottom:T.s4}}>
      <span style={{fontSize:15}}>👑</span>
      <span style={{fontFamily:"'IM Fell English',serif",color:T.primary,fontSize:13,letterSpacing:1.5,fontWeight:700}}>YÖNETİCİDEN MESAJ</span>
    </div>
    <div style={{fontSize:14,color:T.textPrimary,lineHeight:1.5,wordBreak:"break-word",whiteSpace:"pre-wrap"}}>{hostMsgToast}</div>
  </div>:null;
  const contactModalEl=showContactPicker?<div style={{position:"fixed",inset:0,zIndex:700,background:"rgba(0,0,0,0.6)",display:"flex",alignItems:"center",justifyContent:"center",padding:T.s16}} onClick={()=>{setShowContactPicker(false);setContactTarget(null);setContactText("");}}>
    <div onClick={e=>e.stopPropagation()} style={{width:420,maxWidth:"100%",background:"linear-gradient(160deg,rgba(25,15,55,0.98),rgba(10,8,26,0.98))",border:`1px solid ${T.primaryBorder}`,borderRadius:T.lg,padding:T.s20||20,boxShadow:"0 12px 48px rgba(0,0,0,0.7)"}}>
      <div style={{fontFamily:"'IM Fell English',serif",color:T.primary,fontSize:16,letterSpacing:1,marginBottom:T.s12}}>💬 İletişime Geç</div>
      <p style={{fontSize:12,color:T.textMuted,marginBottom:T.s10||10}}>Bir oyuncu seç ve ona küçük bir uyarı mesajı gönder (ör. rolünü kullanmayı unuttu).</p>
      <div style={{display:"flex",gap:T.s6,flexWrap:"wrap",marginBottom:T.s12,maxHeight:140,overflowY:"auto"}}>
        {allPlayers.filter(p=>p.durum!=="ölü").map(p=><button key={p.id} onClick={()=>setContactTarget(p.id)} style={{padding:"6px 12px",borderRadius:20,border:`1px solid ${contactTarget===p.id?T.primary:"rgba(255,255,255,0.15)"}`,background:contactTarget===p.id?T.primaryDim:"rgba(255,255,255,0.04)",color:contactTarget===p.id?T.primary:T.textPrimary,fontSize:12,fontWeight:600,cursor:"pointer"}}>{p.ad}</button>)}
      </div>
      <textarea value={contactText} onChange={e=>setContactText(e.target.value)} maxLength={200} placeholder="Mesajını yaz..." style={{width:"100%",minHeight:70,background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:T.md,padding:T.s10||10,color:T.textPrimary,fontSize:13,fontFamily:"'Nunito',sans-serif",outline:"none",resize:"vertical"}}/>
      <div style={{display:"flex",gap:T.s8,marginTop:T.s12,justifyContent:"flex-end"}}>
        <Btn variant="ghost" onClick={()=>{setShowContactPicker(false);setContactTarget(null);setContactText("");}}>Vazgeç</Btn>
        <Btn variant="primary" onClick={sendContactMessage} disabled={!contactTarget||!contactText.trim()}>Gönder</Btn>
      </div>
    </div>
  </div>:null;
  // Sabah popup: ölüm kartları başta gizli, yönetici tek tek açar
  const deaths=pendingMorningNews.filter(n=>n.type==="death");
  const revives=pendingMorningNews.filter(n=>n.type==="revive");
  const allRevealed=morningRevealedCount>=deaths.length;

  // Sinematik death note: kart açılınca popup tetikle VE Firebase'e yaz ki oyuncular aynı anda görsün
  const openDeathCard=()=>{
    if(!isHost||morningRevealedCount>=deaths.length)return;
    const showingIndex=morningRevealedCount+1; // Bu kart artık "açık" — count bu değere yükselir
    setMorningRevealedCount(showingIndex);
    // Firebase'e hemen yaz: oyuncular bu count değerini görünce aynı kartı listede açar (pop-up burada YOK, o "Kapat"tan sonra sırayla gelir)
    if(fb&&lobbyCode)fb.set(fb.ref(fb.db,`lobbies/${lobbyCode}/morningReveal`),{count:showingIndex,ts:Date.now()});
  };
  const closeDeathNote=()=>{
    if(isHost){
      noteIdxRef.current+=1;
      const names=noteNamesRef.current;
      const next=noteIdxRef.current<names.length?pendingMorningNews.find(n=>n.type==="death"&&n.name===names[noteIdxRef.current]):null;
      setActiveDeathNote(next||null);
      if(fb&&lobbyCode)fb.set(fb.ref(fb.db,`lobbies/${lobbyCode}/morningReveal`),{count:morningRevealedCount,closed:true,noteNames:names,noteIdx:noteIdxRef.current,ts:Date.now()});
    } else {
      setActiveDeathNote(null);
    }
  };

  const morningPopupEl=showMorningPopup&&pendingMorningNews.length>0?<div style={{position:"fixed",inset:0,zIndex:600,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,0.75)",backdropFilter:"blur(8px)",animation:"fadeIn 300ms ease-out"}}>
    <div style={{background:"linear-gradient(160deg,rgba(30,10,10,0.98),rgba(13,10,31,0.98))",border:`1px solid ${T.dangerBorder}`,borderRadius:T.lg,padding:T.s24,maxWidth:400,width:"92%",textAlign:"center",boxShadow:"0 16px 64px rgba(0,0,0,0.8)",animation:"fadeUp 300ms ease-out"}}>
      <div style={{fontSize:44,marginBottom:T.s8}}>🌅</div>
      <div style={{fontFamily:"'IM Fell English',serif",color:T.primary,fontSize:18,letterSpacing:3,marginBottom:T.s4}}>Sabah Oldu</div>
      {deaths.length>0&&<div style={{fontSize:13,color:T.danger,fontWeight:700,marginBottom:T.s16,background:T.dangerDim,border:`1px solid ${T.dangerBorder}`,borderRadius:T.md,padding:`${T.s6} ${T.s12}`}}>💀 Bu gece {deaths.length} kişi öldü</div>}
      <div style={{display:"flex",flexDirection:"column",gap:T.s8,marginBottom:T.s16}}>
        {deaths.map((n,i)=>{
          const revealed=i<morningRevealedCount;
          return <div key={i} onClick={!revealed&&isHost&&i===morningRevealedCount?openDeathCard:undefined}
            style={{background:revealed?T.dangerDim:"rgba(255,255,255,0.04)",border:`1px solid ${revealed?T.dangerBorder:"rgba(255,255,255,0.08)"}`,borderRadius:T.md,padding:`${T.s12} ${T.s16}`,textAlign:"left",cursor:isHost&&i===morningRevealedCount&&!revealed?"pointer":"default",transition:"all 0.3s ease",position:"relative",overflow:"hidden"}}>
            {revealed?(<>
              <div style={{display:"flex",alignItems:"center",gap:T.s8,animation:"fadeUp 300ms ease-out"}}>
                <span style={{fontSize:20}}>💀</span>
                <span style={{fontWeight:700,color:T.danger,fontSize:14}}>{n.name} öldü.</span>
              </div>
              {n.note&&<div style={{marginTop:T.s6,fontSize:12,color:T.danger,fontStyle:"italic",paddingLeft:28,animation:"fadeUp 300ms ease-out"}}>📝 "{n.note}"</div>}
            </>):(<div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div style={{display:"flex",alignItems:"center",gap:T.s8}}>
                <span style={{fontSize:20}}>❓</span>
                <span style={{fontWeight:700,color:"rgba(255,255,255,0.25)",fontSize:13,letterSpacing:2}}>??? Gizli</span>
              </div>
              {isHost&&i===morningRevealedCount&&<span style={{fontSize:11,color:T.accent,border:`1px solid ${T.accentBorder}`,borderRadius:20,padding:"2px 8px",animation:"pulse 1.2s ease infinite"}}>🩸 Aç ▶</span>}
            </div>)}
          </div>;
        })}
        {revives.map((n,i)=><div key={"r"+i} style={{background:T.successDim,border:`1px solid ${T.successBorder}`,borderRadius:T.md,padding:`${T.s8} ${T.s16}`,display:"flex",alignItems:"center",gap:T.s8}}>
          <span style={{fontSize:20}}>✨</span><span style={{fontWeight:700,color:T.success}}>{n.name} hayata döndü!</span>
        </div>)}
      </div>
      {isHost&&allRevealed&&<button onClick={()=>{
        setShowMorningPopup(false);
        noteNamesRef.current=deaths.map(d=>d.name);
        noteIdxRef.current=0;
        setActiveDeathNote(deaths.length>0?deaths[0]:null);
        if(fb&&lobbyCode)fb.set(fb.ref(fb.db,`lobbies/${lobbyCode}/morningReveal`),{count:morningRevealedCount,closed:true,noteNames:noteNamesRef.current,noteIdx:0,ts:Date.now()});
      }} style={{width:"100%",padding:`${T.s10||"10px"} 0`,borderRadius:T.md,border:`1px solid ${T.border}`,background:T.surface,color:T.textSecondary,fontWeight:700,fontSize:13,cursor:"pointer"}}>✓ Kapat</button>}
      {isHost&&!allRevealed&&<p style={{fontSize:11,color:T.textMuted}}>🩸 Kartların üstüne basarak tek tek aç</p>}
      {!isHost&&<p style={{fontSize:11,color:T.textMuted}}>Yönetici açıyor...</p>}
    </div>
  </div>:null;

  const activeDeathNoteEl=activeDeathNote?<DeathNotePopup death={activeDeathNote} onClose={closeDeathNote} isHost={isHost}/>:null;
  const lastWordsEl=lastWords&&!lastWordsSent&&!isHost?<div style={{position:"fixed",inset:0,zIndex:650,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,0.85)",backdropFilter:"blur(8px)",animation:"fadeIn 300ms ease-out"}}>

      <div style={{display:"flex",alignItems:"center",gap:T.s12}}>
        <div style={{width:52,height:52,borderRadius:T.md,background:myPlayer.rol?.renk+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,border:`1px solid ${myPlayer.rol?.renk+"55"}`}}>{myPlayer.rol?.emoji}</div>
        <div>
          <div style={{fontSize:11,color:T.textMuted,letterSpacing:2,marginBottom:T.s4}}>SENİN ROLÜN</div>
          <div style={{fontFamily:"'IM Fell English',serif",fontSize:18,color:myPlayer.rol?.renk||T.primary}}>{myPlayer.rol?.ad}</div>
          <div style={{fontSize:12,color:T.textSecondary,marginTop:T.s4}}>{myPlayer.rol?.aciklama}</div>
        </div>
        <div style={{marginLeft:"auto"}}><Pill label={TEAMS[myPlayer.rol?.takim]?.label} color={TEAMS[myPlayer.rol?.takim]?.color}/></div>
      </div>
    </GlassCard>}

    {!isHost&&!isSpectator&&myPlayer&&myPlayer.durum==="ölü"&&<GlassCard style={{padding:T.s12,marginBottom:T.s16,border:`1px solid ${T.dangerBorder}`,background:T.dangerDim,textAlign:"center"}}>
      <p style={{color:T.danger,fontSize:13}}>💀 Öldünüz. Oyunu sadece izleyebilirsiniz.</p>
    </GlassCard>}

    {/* FIX: Kahin sonucu — tam veri kontrolü yapılıyor, boş/eksik veri gösterilmiyor */}
    {!isHost&&!isSpectator&&revealedRole&&revealedRole.targetName&&revealedRole.targetRol?.ad&&<GlassCard style={{padding:T.s16,marginBottom:T.s16,border:`1px solid ${T.accentBorder}`,background:"rgba(167,139,250,0.06)"}}>
      <div style={{display:"flex",alignItems:"center",gap:T.s12}}>
        <div style={{width:48,height:48,borderRadius:T.md,background:(revealedRole.targetRol?.renk||T.accent)+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,border:`1px solid ${(revealedRole.targetRol?.renk||T.accent)+"55"}`}}>{revealedRole.targetRol?.emoji||"❓"}</div>
        <div>
          <div style={{fontSize:11,color:T.textMuted,letterSpacing:2,marginBottom:T.s4}}>🔮 {revealedRole.round}. GECE SONUCU</div>
          <div style={{fontFamily:"'IM Fell English',serif",fontSize:15,color:T.accent}}>
            <strong style={{color:T.textPrimary}}>{revealedRole.targetName}</strong>
            {" → "}
            <span style={{color:revealedRole.targetRol?.renk||T.accent}}>{revealedRole.targetRol?.emoji} {revealedRole.targetRol?.ad}</span>
          </div>
          <div style={{marginTop:T.s4,display:"flex",gap:T.s4}}>
            <Tag color={TEAMS[revealedRole.targetRol?.takim]?.color||T.accent} size="sm">{TEAMS[revealedRole.targetRol?.takim]?.label||"?"}</Tag>
          </div>
        </div>
      </div>
    </GlassCard>}

    {spectators.length>0&&<GlassCard style={{padding:`${T.s8} ${T.s16}`,marginBottom:T.s12}}>
      <span style={{fontSize:11,color:T.textMuted}}>👁 Gözlemciler: </span>
      {spectators.map((s,i)=><Tag key={i} color={T.accent} size="sm">{s.name}</Tag>)}
    </GlassCard>}

    {gevezeAnnounceEl}
    {baskanAnnounceEl}

    {phase==="gündüz"&&<DayTimer key={dayKey} lobbyCode={lobbyCode} isHost={isHost} fb={fb}/>}
    {phase==="gece"&&<DayTimer key={"night_"+nightKey} lobbyCode={lobbyCode} isHost={isHost} fb={fb} isNight={true}/>}

    <div style={{display:"flex",gap:T.s8,marginBottom:T.s16}}>
      {TABS.map(({id,label,icon})=><button key={id} onClick={()=>setTab(id)} style={{flex:1,padding:`${T.s8} 0`,borderRadius:T.md,cursor:"pointer",background:tab===id?activeDim:T.surface,color:tab===id?activeColor:T.textMuted,border:`1px solid ${tab===id?activeBorder:T.border}`,fontWeight:700,fontSize:12,display:"flex",flexDirection:"column",alignItems:"center",gap:T.s4}}><span style={{fontSize:16}}>{icon}</span>{label}</button>)}
    </div>

    <div key={tab} className="enter">
      {tab==="oyuncular"&&<div style={{display:"flex",flexDirection:"column",gap:T.s8}}>
        {allPlayers.slice().sort((a,b)=>({canlı:0,izleyici:1,ölü:2}[a.durum]||0)-({canlı:0,izleyici:1,ölü:2}[b.durum]||0)).map(p=><PlayerCard key={p.id} player={p} onStatus={setStatus} onAnnounce={announce} onKick={isHost?kickPlayer:null} phase={phase} isHost={isHost} isOnline={presence[p.ad]?.online!==false}/>)}
      </div>}
      {tab==="eylem"&&(night
        ?<NightActionQueue key={nightKey} players={players} nightOrder={nightOrder} roles={roles} onResolve={resolveNightSafe} onDayStart={handleDayStart} nightResolved={nightResolved} nightNum={round} isHost={isHost} lobbyCode={lobbyCode} myName={myName} fb={fb} hostStep={nightStep} hostActions={nightActions} hostDocHist={nightDocHist} onHostStep={setNightStep} onHostActions={setNightActions} onHostDocHist={setNightDocHist} externalResolving={nightResolving}/>
        :<VotingPanel key={voteKey} players={players} round={round} onLynch={handleLynch} isHost={isHost} lobbyCode={lobbyCode} myName={myName} fb={fb} onSkipToNight={switchToNight}/>
      )}
      {tab==="günlük"&&<GameLog logs={logs} isHost={isHost}/>}
    </div>

    <FloatingChat lobbyCode={lobbyCode} myName={myName} players={players} phase={phase} fb={fb} isHost={isHost} nightNum={round} myPlayer={myPlayer}/>
    <Notepad myName={myName}/>
    <RoleLibraryScreen roles={roles} onSave={()=>{}} open={showRoles} onClose={()=>setShowRoles(false)} readOnly/>
  </div>;
}

// ── REPLAY SCREEN ────────────────────────────────────────────────────────────
function ReplayScreen({lobbyCode,replayData,onBack}){
  const[loading,setLoading]=useState(!replayData);
  const[data,setData]=useState(replayData);
  const fb=useFB();

  useEffect(()=>{
    if(replayData){setData(replayData);setLoading(false);return;}
    if(!fb||!lobbyCode)return;
    setLoading(true);
    fb.get(fb.ref(fb.db,`lobbies/${lobbyCode}`)).then(snap=>{
      if(snap.exists())setData(snap.val());
      setLoading(false);
    }).catch(()=>setLoading(false));
  },[lobbyCode,replayData]);

  if(loading){
    return <div style={{minHeight:"60vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{textAlign:"center"}}><Spinner size={40}/><p style={{marginTop:T.s16,color:T.textMuted}}>Oyun yükleniyor...</p></div>
    </div>;
  }
  if(!data){
    return <div style={{minHeight:"60vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:T.s16}}>
      <div style={{fontSize:48}}>📭</div>
      <p style={{color:T.textMuted}}>Oyun verisi bulunamadı.</p>
      <Btn variant="primary" onClick={onBack}>← Ana Sayfaya Dön</Btn>
    </div>;
  }

  const logs=data.gameLog?Object.values(data.gameLog):[];
  const finalPlayers=data.finalPlayers||[];
  const gameOver=data.game?.gameOver;
  const endedAt=data.endedAt?new Date(data.endedAt).toLocaleString("tr-TR"):null;
  const aliveAtEnd=finalPlayers.filter(p=>!p.isHost&&p.durum==="canlı");
  const deadAtEnd=finalPlayers.filter(p=>!p.isHost&&p.durum==="ölü");

  const tipMeta={
    kill:{icon:"💀",label:"Ölüm",color:"#e74c3c"},
    protect:{icon:"🛡️",label:"Koruma",color:"#27ae60"},
    reveal:{icon:"🔮",label:"Rol Bak",color:"#a78bfa"},
    vote:{icon:"⚖️",label:"Oylama",color:"#f39c12"},
    phase:{icon:"🌙",label:"Faz",color:"#a78bfa"},
    announce:{icon:"👑",label:"Duyuru",color:"#f39c12"},
    revive:{icon:"✨",label:"Dirilt",color:"#27ae60"},
    day_announce:{icon:"📢",label:"Sabah",color:"#f39c12"},
    block:{icon:"🚫",label:"Engel",color:"#e74c3c"},
    default:{icon:"📜",label:"",color:"rgba(255,255,255,0.4)"},
  };

  const renderPart=(part,i)=>{
    if(part.t==="player"){return <span key={i} style={{color:part.rol?.renk||T.primary,fontWeight:700}}>{part.rol?.emoji} {part.v}</span>;}
    if(part.t==="role"){return <span key={i} style={{color:part.data?.renk||T.accent,fontWeight:700}}>{part.data?.emoji} {part.v}</span>;}
    return <span key={i} style={part.style||{}}>{part.v}</span>;
  };

  return <div className="enter" style={{padding:`${T.s24} ${T.s16}`,maxWidth:700,margin:"0 auto"}}>
    {/* Header */}
    <GlassCard style={{padding:T.s24,marginBottom:T.s16,textAlign:"center",border:`1px solid ${T.accentBorder}`,background:"rgba(167,139,250,0.06)"}}>
      <div style={{fontSize:52,marginBottom:T.s8}}>📼</div>
      <div style={{fontFamily:"'Uncial Antiqua',serif",fontSize:26,letterSpacing:6,color:T.accent,marginBottom:T.s4}}>
        {lobbyCode}
      </div>
      <div style={{fontFamily:"'IM Fell English',serif",color:T.primary,fontSize:16,letterSpacing:3,marginBottom:T.s4}}>Oyun Tekrarı</div>
      {endedAt&&<p style={{color:T.textMuted,fontSize:12}}>🕐 {endedAt} tarihinde sona erdi</p>}
      <div style={{marginTop:T.s16,display:"inline-flex",alignItems:"center",gap:T.s6,background:"rgba(231,76,60,0.12)",border:"1px solid rgba(231,76,60,0.3)",borderRadius:20,padding:"4px 14px"}}>
        <span style={{fontSize:11,color:T.danger,fontWeight:700,letterSpacing:2}}>🚫 SALT OKUNUR — OYNANAMAZ</span>
      </div>
    </GlassCard>

    {/* Oyun Sonu Sonucu */}
    {data.game?.gameOver&&<GlassCard style={{padding:T.s20||"20px",marginBottom:T.s16,border:`1px solid ${T.primaryBorder}`,background:T.primaryDim}}>
      <div style={{fontFamily:"'IM Fell English',serif",color:T.primary,fontSize:15,letterSpacing:2,marginBottom:T.s8}}>🏆 Oyun Sonucu</div>
      <p style={{color:T.textSecondary,fontSize:14}}>{data.game.gameOver.reason||"Oyun tamamlandı."}</p>
    </GlassCard>}

    {/* Hayatta kalanlar / ölenler */}
    {finalPlayers.length>0&&<div style={{marginBottom:T.s16}}>
      {aliveAtEnd.length>0&&<div style={{marginBottom:T.s12}}>
        <p style={{fontSize:11,color:T.success,letterSpacing:3,marginBottom:T.s8,fontWeight:700}}>✅ HAYATTA KALANLAR</p>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(190px,1fr))",gap:T.s8}}>
          {aliveAtEnd.map(p=><div key={p.id} style={{display:"flex",alignItems:"center",gap:T.s10||"10px",background:"rgba(39,174,96,0.10)",borderRadius:T.lg,padding:`${T.s10||"10px"} ${T.s12}`,border:"1px solid rgba(39,174,96,0.28)"}}>
            <div style={{width:38,height:38,borderRadius:T.md,background:(p.rol?.renk||T.success)+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0,border:`1px solid ${(p.rol?.renk||T.success)}44`}}>{p.rol?.emoji}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:700,color:T.textPrimary,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.ad}</div>
              <div style={{display:"flex",gap:3,marginTop:2,flexWrap:"wrap"}}>
                <Tag color={p.rol?.renk||T.success} size="sm">{p.rol?.ad}</Tag>
                <Tag color={TEAMS[p.rol?.takim]?.color||T.accent} size="sm">{TEAMS[p.rol?.takim]?.label||"?"}</Tag>
              </div>
            </div>
          </div>)}
        </div>
      </div>}
      {deadAtEnd.length>0&&<div>
        <p style={{fontSize:11,color:T.danger,letterSpacing:3,marginBottom:T.s8,fontWeight:700}}>💀 ÖLENLER</p>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(190px,1fr))",gap:T.s8}}>
          {deadAtEnd.map(p=><div key={p.id} style={{display:"flex",alignItems:"center",gap:T.s10||"10px",background:"rgba(231,76,60,0.07)",borderRadius:T.lg,padding:`${T.s10||"10px"} ${T.s12}`,border:"1px solid rgba(231,76,60,0.18)",opacity:0.85}}>
            <div style={{width:38,height:38,borderRadius:T.md,background:"rgba(231,76,60,0.12)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0,border:"1px solid rgba(231,76,60,0.25)"}}>💀</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:700,color:T.textMuted,fontSize:13,textDecoration:"line-through",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.ad}</div>
              <Tag color={p.rol?.renk||T.danger} size="sm">{p.rol?.emoji} {p.rol?.ad}</Tag>
            </div>
          </div>)}
        </div>
      </div>}
    </div>}

    {/* Oyun Günlüğü */}
    <GlassCard style={{padding:T.s16,marginBottom:T.s24}}>
      <div style={{display:"flex",alignItems:"center",gap:T.s8,marginBottom:T.s12}}>
        <span>📜</span>
        <span style={{fontFamily:"'IM Fell English',serif",color:T.primary,fontSize:15,letterSpacing:2}}>Oyun Günlüğü</span>
        <Tag color={T.accent} size="sm">{logs.length} kayıt</Tag>
      </div>
      <div style={{maxHeight:480,overflowY:"auto",display:"flex",flexDirection:"column",gap:T.s4}}>
        {logs.length===0&&<p style={{fontSize:12,color:T.textMuted,textAlign:"center",padding:T.s24}}>📭 Kayıt bulunamadı.</p>}
        {logs.map((log,i)=>{
          const meta=tipMeta[log.tip]||tipMeta.default;
          return <div key={i} style={{display:"flex",gap:T.s8,alignItems:"flex-start",background:log.isNight?"rgba(88,80,180,0.10)":"rgba(255,255,255,0.03)",borderRadius:T.sm,padding:`${T.s6} ${T.s12}`,borderLeft:`3px solid ${meta.color}`,marginBottom:2}}>
            <span style={{fontSize:13,flexShrink:0,marginTop:2}}>{meta.icon}</span>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:T.s4,marginBottom:2}}>
                {meta.label&&<span style={{fontSize:9,color:meta.color,fontWeight:700,letterSpacing:1,textTransform:"uppercase",background:meta.color+"18",borderRadius:3,padding:"1px 5px"}}>{meta.label}</span>}
                <span style={{fontSize:9,color:T.textMuted}}>{log.zaman}</span>
                {log.isNight&&<span style={{fontSize:9,color:T.accent,letterSpacing:1,background:T.accentDim,borderRadius:3,padding:"1px 5px"}}>GECE</span>}
              </div>
              <span style={{fontSize:12,color:T.textSecondary,lineHeight:1.6}}>{(log.parts||[{t:"text",v:log.mesaj||""}]).map((part,j)=>renderPart(part,j))}</span>
            </div>
          </div>;
        })}
      </div>
    </GlassCard>

    <Btn variant="primary" onClick={onBack} style={{width:"100%",justifyContent:"center",gap:T.s8,padding:"14px 0",fontSize:15}}>🏠 Ana Sayfaya Dön</Btn>
  </div>;
}

// ── SETUP WAITING SCREEN (oyuncular için) ────────────────────────────────────
function SetupWaitingScreen({lobbyCode,myName}){
  const fb=useFB();
  const[roleCounts,setRoleCounts]=useState({});
  const[tick,setTick]=useState(0);
  const[dots,setDots]=useState(".");
  const[playerCount,setPlayerCount]=useState(0);

  // Rol dağılımını Firebase'den anlık dinle
  useEffect(()=>{
    if(!fb||!lobbyCode)return;
    const rcRef=fb.ref(fb.db,`lobbies/${lobbyCode}/setupCounts`);
    const unsub=fb.onValue(rcRef,(snap)=>{
      setRoleCounts(snap.val()||{});
    });
    return()=>unsub();
  },[fb,lobbyCode]);

  // Oyuncu sayısını dinle
  useEffect(()=>{
    if(!fb||!lobbyCode)return;
    const pRef=fb.ref(fb.db,`lobbies/${lobbyCode}/players`);
    const unsub=fb.onValue(pRef,(snap)=>{
      const d=snap.val();
      if(d)setPlayerCount(Object.values(d).filter(p=>!p.isHost).length);
    });
    return()=>unsub();
  },[fb,lobbyCode]);

  // Üç nokta animasyonu
  useEffect(()=>{
    const opts=[".","..",".","..","...","..",".","."];
    let i=0;
    const t=setInterval(()=>{i=(i+1)%opts.length;setDots(opts[i]);},400);
    return()=>clearInterval(t);
  },[]);

  // Çark animasyonu için tick
  useEffect(()=>{
    const t=setInterval(()=>setTick(n=>n+1),50);
    return()=>clearInterval(t);
  },[]);

  const totalAssigned=Object.values(roleCounts).reduce((a,b)=>a+b,0);
  const progress=playerCount>0?Math.min(100,Math.round((totalAssigned/playerCount)*100)):0;

  // Çark için ayar simgeleri listesi — kaotik görünüm için
  const assignedRoles=DEFAULT_ROLES.filter(r=>(roleCounts[r.id]||0)>0);

  return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"calc(100vh - 130px)",padding:T.s24}}>
    <div style={{textAlign:"center",maxWidth:440,width:"100%"}}>

      {/* Ana çark animasyonu */}
      <div style={{position:"relative",width:160,height:160,margin:"0 auto",marginBottom:T.s32}}>
        {/* Dış halka döner */}
        <svg width="160" height="160" style={{position:"absolute",inset:0,animation:"spin 4s linear infinite",transformOrigin:"80px 80px"}}>
          <circle cx="80" cy="80" r="70" fill="none" stroke="rgba(167,139,250,0.12)" strokeWidth="2"/>
          <circle cx="80" cy="80" r="70" fill="none" stroke={T.accent} strokeWidth="2.5"
            strokeDasharray="60 380" strokeLinecap="round"/>
          <circle cx="80" cy="80" r="70" fill="none" stroke={T.primary} strokeWidth="2.5"
            strokeDasharray="30 410" strokeLinecap="round" strokeDashoffset="-110"/>
        </svg>
        {/* İç halka ters döner */}
        <svg width="160" height="160" style={{position:"absolute",inset:0,animation:"spin 3s linear infinite reverse",transformOrigin:"80px 80px"}}>
          <circle cx="80" cy="80" r="52" fill="none" stroke="rgba(243,156,18,0.08)" strokeWidth="1.5"/>
          <circle cx="80" cy="80" r="52" fill="none" stroke={T.primary} strokeWidth="2"
            strokeDasharray="20 306" strokeLinecap="round"/>
          <circle cx="80" cy="80" r="52" fill="none" stroke="rgba(167,139,250,0.5)" strokeWidth="2"
            strokeDasharray="15 311" strokeLinecap="round" strokeDashoffset="-60"/>
        </svg>
        {/* Merkez içerik */}
        <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
          <div style={{fontSize:36,animation:"float 2.5s ease-in-out infinite"}}>⚙️</div>
          <div style={{fontFamily:"'Uncial Antiqua',serif",fontSize:11,color:T.accent,letterSpacing:2,marginTop:6}}>KURULUM</div>
        </div>
        {/* Dönen noktalar */}
        {[0,1,2,3,4,5].map(i=>{
          const angle=(tick*3+i*60)*Math.PI/180;
          const r=74;
          const x=80+r*Math.cos(angle);
          const y=80+r*Math.sin(angle);
          const size=i%2===0?5:3;
          const col=i%2===0?T.accent:T.primary;
          return <div key={i} style={{position:"absolute",left:x-size/2,top:y-size/2,width:size,height:size,borderRadius:"50%",background:col,boxShadow:`0 0 6px ${col}`,transition:"none"}}/>;
        })}
      </div>

      {/* Başlık */}
      <div style={{fontFamily:"'IM Fell English',serif",color:T.accent,fontSize:22,letterSpacing:3,marginBottom:T.s8,animation:"pulse 2s ease-in-out infinite"}}>
        Kurucu oyunu kuruyor{dots.slice(0,dots.length)}
      </div>
      <p style={{color:T.textMuted,fontSize:13,marginBottom:T.s24}}>Roller atanıyor, birazdan başlıyorsunuz!</p>

      {/* Rol dağılımı — anlık */}
      {totalAssigned>0&&<div style={{background:"rgba(255,255,255,0.04)",borderRadius:T.lg,border:`1px solid ${T.border}`,padding:`${T.s12} ${T.s16}`,marginBottom:T.s16,textAlign:"left"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:T.s12}}>
          <span style={{fontFamily:"'IM Fell English',serif",color:T.primary,fontSize:13,letterSpacing:2}}>Rol Dağılımı</span>
          <span style={{fontSize:11,color:totalAssigned===playerCount?T.success:T.warning,fontWeight:700,background:totalAssigned===playerCount?"rgba(39,174,96,0.12)":"rgba(243,156,18,0.12)",border:`1px solid ${totalAssigned===playerCount?"rgba(39,174,96,0.3)":"rgba(243,156,18,0.3)"}`,borderRadius:20,padding:"2px 10px"}}>
            {totalAssigned}/{playerCount}
          </span>
        </div>
        {/* Progress bar */}
        <div style={{height:4,background:"rgba(255,255,255,0.06)",borderRadius:4,marginBottom:T.s12,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${progress}%`,background:`linear-gradient(90deg,${T.accent},${T.primary})`,borderRadius:4,transition:"width 0.4s ease"}}/>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:T.s6}}>
          {assignedRoles.map(r=>{
            const cnt=roleCounts[r.id]||0;
            return <div key={r.id} style={{display:"flex",alignItems:"center",gap:T.s8,animation:"fadeUp 300ms ease-out"}}>
              <span style={{fontSize:16,flexShrink:0}}>{r.emoji}</span>
              <span style={{flex:1,color:T.textPrimary,fontSize:13,fontWeight:600}}>{r.ad}</span>
              <div style={{display:"flex",gap:3}}>
                {Array.from({length:cnt}).map((_,i)=><div key={i} style={{width:18,height:18,borderRadius:4,background:r.renk+"22",border:`1px solid ${r.renk}55`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:r.renk,fontWeight:700}}>✓</div>)}
              </div>
            </div>;
          })}
        </div>
        {assignedRoles.length===0&&<p style={{fontSize:12,color:T.textMuted,textAlign:"center"}}>Kurucu henüz rol seçmedi...</p>}
      </div>}

      {totalAssigned===0&&<div style={{background:T.accentDim,border:`1px solid ${T.accentBorder}`,borderRadius:T.md,padding:T.s12,marginBottom:T.s16}}>
        <p style={{color:T.accent,fontSize:12}}>⏳ Kurucu rol dağılımını ayarlıyor...</p>
      </div>}

      {/* Oyuncu bilgisi */}
      <div style={{display:"flex",alignItems:"center",gap:T.s8,justifyContent:"center"}}>
        <div style={{width:8,height:8,borderRadius:"50%",background:T.success,animation:"pulse 2s ease infinite"}}/>
        <span style={{fontSize:12,color:T.textMuted}}>{playerCount} oyuncu lobide • <span style={{color:T.accent,fontWeight:700}}>{myName}</span> olarak bağlısın</span>
      </div>
    </div>
  </div>;
}

// ── SETUP SCREEN ──────────────────────────────────────────────────────────────
function SetupScreen({onStart,roleLibrary,lobbyPlayers,lobbyCode}){
  const[counts,setCounts]=useState({});
  const[tab,setTab]=useState("roller");
  const[nightOrder,setNightOrder]=useState(DEFAULT_ORDER);
  const[dragIdx,setDragIdx]=useState(null);
  const fb=useFB();
  const names=lobbyPlayers.filter(p=>!p.isHost).map(p=>p.name);
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  const ok=names.length>=2&&total===names.length;
  const upd=(id,d)=>setCounts(c=>{
    const next={...c,[id]:Math.max(0,(c[id]||0)+d)};
    // Firebase'e anlık yaz (oyuncular görebilsin)
    if(fb&&lobbyCode){
      const cleaned=Object.fromEntries(Object.entries(next).filter(([,v])=>v>0));
      fb.set(fb.ref(fb.db,`lobbies/${lobbyCode}/setupCounts`),cleaned);
    }
    return next;
  });

  useEffect(()=>{
    const activeRoleIds=roleLibrary.filter(r=>(counts[r.id]||0)>0).map(r=>r.id);
    setNightOrder(()=>{
      const sorted=[
        ...CANONICAL_NIGHT_ORDER.filter(id=>activeRoleIds.includes(id)),
        ...activeRoleIds.filter(id=>!CANONICAL_NIGHT_ORDER.includes(id))
      ];
      return sorted;
    });
  },[counts]);

  const dragOver=(e,idx)=>{
    e.preventDefault();
    if(dragIdx===null||dragIdx===idx)return;
    setNightOrder(prev=>{
      const arr=[...prev];
      const[moved]=arr.splice(dragIdx,1);
      arr.splice(idx,0,moved);
      return arr;
    });
    setDragIdx(idx);
  };

  const start=()=>{
    const shuffled=[...names].sort(()=>Math.random()-.5);
    const pool=[];
    roleLibrary.forEach(r=>{for(let i=0;i<(counts[r.id]||0);i++)pool.push(r);});
    onStart(
      shuffled.map((name,i)=>({id:i,ad:name,rol:pool[i],baslangicRol:pool[i],durum:"canlı",abilityUses:Object.fromEntries((pool[i]?.abilities||[]).map(a=>[a.id,a.kullanim])),oySayisi:1,kimlikAcik:false})),
      nightOrder
    );
  };

  return <div className="enter" style={{padding:`${T.s24} ${T.s16}`,maxWidth:700,margin:"0 auto"}}>
    <GlassCard style={{padding:`${T.s12} ${T.s16}`,marginBottom:T.s16,background:"rgba(167,139,250,0.08)",border:`1px solid ${T.accentBorder}`}}>
      <p style={{fontSize:12,color:T.accent}}>👑 Yönetici oyun dışındadır. Sadece oyuncular role atanır.</p>
    </GlassCard>
    <div style={{display:"flex",gap:T.s8,marginBottom:T.s24}}>
      {[["oyuncular","👥 Oyuncular"],["roller","🎭 Roller"],["sira","🌙 Gece Sırası"]].map(([t,label])=><button key={t} onClick={()=>setTab(t)} style={{flex:1,padding:`${T.s12} 0`,borderRadius:T.md,cursor:"pointer",background:tab===t?T.primaryDim:T.surface,color:tab===t?T.primary:T.textMuted,border:`1px solid ${tab===t?T.primaryBorder:T.border}`,fontWeight:700,fontSize:12,transition:`all ${T.base}`}}>{label}</button>)}
    </div>
    {tab==="oyuncular"&&<GlassCard style={{padding:T.s24}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:T.s16}}>
        <span style={{fontFamily:"'IM Fell English',serif",color:T.primary,fontSize:16,letterSpacing:2}}>Oyuncular</span>
        <Tag color={T.accent}>{names.length} oyuncu</Tag>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:T.s8}}>
        {names.map((name,i)=><div key={i} style={{display:"flex",gap:T.s12,alignItems:"center",background:"rgba(255,255,255,0.03)",borderRadius:T.md,padding:`${T.s12} ${T.s16}`,border:`1px solid ${T.border}`}}>
          <div style={{width:30,height:30,borderRadius:T.sm,background:T.accentDim,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><span style={{fontFamily:"'IM Fell English',serif",color:T.accent,fontSize:13}}>{i+1}</span></div>
          <span style={{fontWeight:700,color:T.textPrimary}}>{name}</span>
        </div>)}
      </div>
      <p style={{fontSize:12,color:T.textMuted,marginTop:T.s12,textAlign:"center"}}>Katılım bekleniyorsa sayfa otomatik güncellenir.</p>
    </GlassCard>}
    {tab==="roller"&&<GlassCard style={{padding:T.s24}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:T.s16}}>
        <span style={{fontFamily:"'IM Fell English',serif",color:T.primary,fontSize:16,letterSpacing:2}}>Rol Dağılımı</span>
        <Tag color={total===names.length?T.success:T.danger}>{total}/{names.length}</Tag>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:T.s8}}>
        {roleLibrary.map(r=>{const cnt=counts[r.id]||0;return <div key={r.id} style={{display:"flex",alignItems:"center",gap:T.s12,background:"rgba(255,255,255,0.03)",borderRadius:T.md,padding:`${T.s12} ${T.s16}`,border:`1px solid ${cnt>0?r.renk+"44":T.border}`,transition:`border-color ${T.base}`}}>
          <span style={{fontSize:22,flexShrink:0}}>{r.emoji}</span>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:700,color:T.textPrimary,fontSize:14}}>{r.ad}</div>
            <div style={{display:"flex",gap:T.s4,marginTop:T.s4,flexWrap:"wrap"}}><Pill label={TEAMS[r.takim]?.label} color={TEAMS[r.takim]?.color}/><Pill label={DEF_T[r.defType]} color={T.accent}/></div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:T.s8}}>
            <Btn variant="icon" onClick={()=>upd(r.id,-1)} style={{width:28,height:28,padding:0,justifyContent:"center",fontSize:16}}>−</Btn>
            <span style={{fontFamily:"'IM Fell English',serif",color:cnt>0?r.renk:T.textMuted,fontSize:16,minWidth:20,textAlign:"center"}}>{cnt}</span>
            <Btn variant="icon" onClick={()=>upd(r.id,1)} style={{width:28,height:28,padding:0,justifyContent:"center",fontSize:16}}>+</Btn>
          </div>
        </div>;})}
      </div>
    </GlassCard>}
    {tab==="sira"&&<GlassCard style={{padding:T.s24}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:T.s8}}>
        <span style={{fontFamily:"'IM Fell English',serif",color:T.primary,fontSize:16,letterSpacing:2}}>🌙 Gece Eylem Sırası</span>
        <Tag color={T.accent} size="sm">{nightOrder.length} rol</Tag>
      </div>
      <p style={{fontSize:12,color:T.textMuted,marginBottom:T.s16,lineHeight:1.6}}>
        Üstteki rol geceyi önce oynar. Sürükle-bırak ile sırayı değiştir.<br/>
        <span style={{color:T.warning}}>⚠️ Önemli:</span> Doktor vampirin üstündeyse korunan kişi ölmez. Vampir üstteyse önce öldürür, doktor sonra gelir ve geç kalır.
      </p>
      {nightOrder.length===0
        ?<p style={{fontSize:13,color:T.textMuted,textAlign:"center",padding:T.s24}}>Önce "Roller" sekmesinden rol ekle.</p>
        :<div style={{display:"flex",flexDirection:"column",gap:T.s8}}>
          {nightOrder.map((rid,idx)=>{
            const r=roleLibrary.find(x=>x.id===rid);
            if(!r)return null;
            return <div
              key={rid}
              draggable
              onDragStart={()=>setDragIdx(idx)}
              onDragOver={(e)=>dragOver(e,idx)}
              onDragEnd={()=>setDragIdx(null)}
              style={{display:"flex",alignItems:"center",gap:T.s12,background:dragIdx===idx?"rgba(167,139,250,0.15)":r.renk+"11",borderRadius:T.md,padding:`${T.s12} ${T.s16}`,border:`1px solid ${dragIdx===idx?T.accentBorder:r.renk+"44"}`,cursor:"grab",userSelect:"none",touchAction:"none",transition:`background ${T.fast}`}}>
              <span style={{fontSize:11,color:T.textMuted,minWidth:18,textAlign:"center",fontWeight:700}}>{idx+1}</span>
              <span style={{fontSize:20}}>{r.emoji}</span>
              <span style={{flex:1,fontWeight:700,color:T.textPrimary,fontSize:14}}>{r.ad}</span>
              <span style={{fontSize:11,color:T.textMuted}}>☰</span>
            </div>;
          })}
        </div>}
    </GlassCard>}

    <Btn variant="primary" onClick={start} disabled={!ok} style={{marginTop:T.s16,width:"100%",justifyContent:"center",gap:T.s8,padding:"15px 0",borderRadius:T.lg,fontSize:15}}>🔀 Rolleri Karıştır ve Oyunu Başlat</Btn>
    {!ok&&names.length>0&&<p style={{textAlign:"center",fontSize:11,color:T.textMuted,marginTop:T.s8}}>{total!==names.length?`Rol (${total}) ve oyuncu (${names.length}) sayısı eşleşmeli`:"En az 2 oyuncu gerekli"}</p>}
  </div>;
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const fb=useFB();
  const[session,setSession]=useState(()=>loadSession());
  const[screen,setScreen]=useState(session?"restoring":"join");
  const[lobbyPlayers,setLobbyPlayers]=useState([]);
  const[spectators,setSpectators]=useState([]);
  const[gamePlayers,setGamePlayers]=useState([]);
  const[roleLibrary]=useState(DEFAULT_ROLES);
  const[bgPhase,setBgPhase]=useState("gündüz");
  const[anim,setAnim]=useState(true);
  const[fbReady,setFbReady]=useState(!!window.__FB);
  const[lobbyClosed,setLobbyClosed]=useState(false);

  useEffect(()=>{
    if(window.__FB){setFbReady(true);return;}
    const interval=setInterval(()=>{if(window.__FB){setFbReady(true);clearInterval(interval);}},200);
    return()=>clearInterval(interval);
  },[]);

  const[replayData,setReplayData]=useState(null);

  useEffect(()=>{
    if(!session||!fbReady||!window.__FB)return;
    if(screen!=="restoring")return;
    const fb2=window.__FB;
    const lobbyRef=fb2.ref(fb2.db,`lobbies/${session.lobbyCode}/status`);
    fb2.get(lobbyRef).then(snap=>{
      const status=snap.val();
      if(!status||status==="ended"||status==="abandoned"){saveSession(null);setSession(null);setScreen("join");return;}
      if(status==="finished"){
        // Replay moduna gir
        if(session.isReplay){go("replay");return;}
        saveSession(null);setSession(null);setScreen("join");return;
      }
      if(status==="waiting")go("lobby");
      else if(status==="setup")go(session.isHost?"setup":"setup");
      else if(status==="playing")go("game");
      else go("join");
    }).catch(()=>{saveSession(null);setSession(null);setScreen("join");});
  },[fbReady,session]);

  const go=(s)=>{setAnim(false);setTimeout(()=>{setScreen(s);setAnim(true);},180);};

  const handleJoined=async(info)=>{
    if(info.isReplay){
      // Replay modunda Firebase'den oyun verisini yükle
      if(window.__FB){
        const fb2=window.__FB;
        const lobbySnap=await fb2.get(fb2.ref(fb2.db,`lobbies/${info.lobbyCode}`));
        if(lobbySnap.exists()){
          setReplayData(lobbySnap.val());
        }
      }
      setSession(info);
      go("replay");
      return;
    }
    setSession(info);saveSession(info);
    if(info.isSpectator)go("game");
    else go("lobby");
  };

  useEffect(()=>{
    if(!session||!fbReady||!window.__FB)return;
    const fb2=window.__FB;
    const playersRef=fb2.ref(fb2.db,`lobbies/${session.lobbyCode}/players`);
    const unsub=fb2.onValue(playersRef,(snap)=>{
      const data=snap.val();
      if(data)setLobbyPlayers(Object.values(data));
    });
    return()=>unsub();
  },[session,fbReady]);

  useEffect(()=>{
    if(!session||!fbReady||!window.__FB)return;
    const fb2=window.__FB;
    const sRef=fb2.ref(fb2.db,`lobbies/${session.lobbyCode}/spectators`);
    const unsub=fb2.onValue(sRef,(snap)=>{
      const d=snap.val();if(d)setSpectators(Object.values(d));else setSpectators([]);
    });
    return()=>unsub();
  },[session,fbReady]);

  useEffect(()=>{
    if(!session||!fbReady||!window.__FB||session.isHost)return;
    const fb2=window.__FB;
    const statusRef=fb2.ref(fb2.db,`lobbies/${session.lobbyCode}/status`);
    const unsub=fb2.onValue(statusRef,(snap)=>{
      const status=snap.val();
      if(status==="setup")go("setup");
      if(status==="playing")go("game");
      if(status==="ended"||status===null||status==="abandoned"){
        setLobbyClosed(true);
        saveSession(null);setSession(null);
      }
      if(status==="finished"){
        setLobbyClosed(true);
        saveSession(null);setSession(null);
      }
    });
    return()=>unsub();
  },[session,fbReady]);

  useEffect(()=>{
    if(!session||!fbReady||!window.__FB||session.isHost)return;
    const fb2=window.__FB;
    const playersRef=fb2.ref(fb2.db,`lobbies/${session.lobbyCode}/game/players`);
    const unsub=fb2.onValue(playersRef,(snap)=>{
      const data=snap.val();
      if(data&&Array.isArray(data))setGamePlayers(data);
    });
    return()=>unsub();
  },[session,fbReady]);

  const handleStartSetup=async()=>{
    if(!session||!fbReady||!window.__FB)return;
    const fb2=window.__FB;
    await fb2.set(fb2.ref(fb2.db,`lobbies/${session.lobbyCode}/status`),"setup");
    go("setup");
  };

  const[gameNightOrder,setGameNightOrder]=useState(DEFAULT_ORDER);

  const handleGameStart=async(players,nightOrder)=>{
    if(!session||!fbReady||!window.__FB)return;
    const fb2=window.__FB;
    const order=nightOrder||DEFAULT_ORDER;
    setGameNightOrder(order);
    await fb2.set(fb2.ref(fb2.db,`lobbies/${session.lobbyCode}/game`),{players,phase:"gündüz",round:1,nightOrder:order});
    await fb2.set(fb2.ref(fb2.db,`lobbies/${session.lobbyCode}/status`),"playing");
    setGamePlayers(players);
    go("game");
  };

  const handleEnd=async()=>{
    if(session?.isHost&&fbReady&&window.__FB){
      const fb2=window.__FB;
      // Oyun günlüğünü ve son oyuncu durumunu kaydet (replay için)
      const gameSnap=await fb2.get(fb2.ref(fb2.db,`lobbies/${session.lobbyCode}/game`));
      const logsSnap=await fb2.get(fb2.ref(fb2.db,`lobbies/${session.lobbyCode}/logs`));
      const gameData=gameSnap.val();
      const logsData=logsSnap.val();
      await fb2.update(fb2.ref(fb2.db,`lobbies/${session.lobbyCode}`),{
        status:"finished",
        endedAt:Date.now(),
        gameLog:logsData||null,
        finalPlayers:gameData?.players||null,
      });
    }else if(session&&fbReady&&window.__FB&&session.isSpectator){
      const fb2=window.__FB;
      await fb2.remove(fb2.ref(fb2.db,`lobbies/${session.lobbyCode}/spectators/${session.myName}`));
    }
    saveSession(null);setSession(null);setGamePlayers([]);setLobbyPlayers([]);
    go("join");
  };

  // Yeni Oyun: yeni kodlu temiz bir lobi oluştur, mevcut oyuncuları (rolsüz/temiz halde) oraya taşı,
  // eski lobiye bir yönlendirme sinyali bırak — herkes otomatik olarak yeni lobiye geçer, kimse düşmez/atılmaz.
  const handleNewGame=async(currentPlayers)=>{
    if(!session?.isHost||!fbReady||!window.__FB)return;
    const fb2=window.__FB;
    const newCode=genLobbyCode();
    const cleanPlayers={};
    (currentPlayers||[]).filter(p=>!p.isHost).forEach(p=>{cleanPlayers[p.ad]={name:p.ad,isHost:false,joinedAt:Date.now()};});
    cleanPlayers[session.myName]={name:session.myName,isHost:true,joinedAt:Date.now()};
    await fb2.set(fb2.ref(fb2.db,`lobbies/${newCode}`),{code:newCode,status:"waiting",createdAt:Date.now(),players:cleanPlayers});
    await fb2.set(fb2.ref(fb2.db,`lobbies/${session.lobbyCode}/newGameCode`),{code:newCode,ts:Date.now()});
  };

  // Eski lobide bir "newGameCode" sinyali belirirse herkes (host dahil) otomatik yeni lobiye geçer
  useEffect(()=>{
    if(!session||!fbReady||!window.__FB)return;
    const fb2=window.__FB;
    const ngRef=fb2.ref(fb2.db,`lobbies/${session.lobbyCode}/newGameCode`);
    const unsub=fb2.onValue(ngRef,(snap)=>{
      const d=snap.val();
      if(d&&d.code&&d.code!==session.lobbyCode){
        const newSession={...session,lobbyCode:d.code};
        saveSession(newSession);setSession(newSession);
        setGamePlayers([]);setLobbyPlayers([]);
        go("lobby");
      }
    });
    return()=>unsub();
  },[session,fbReady]);

  if(screen==="restoring"){
    return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{textAlign:"center"}}><Spinner size={40}/><p style={{marginTop:T.s16,color:T.textMuted,fontSize:13}}>Oturum geri yükleniyor...</p></div>
    </div>;
  }

  if(lobbyClosed){
    return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#0d0a1f"}}>
      <PhaseBackground phase="gece"/>
      <div style={{position:"relative",zIndex:1,textAlign:"center",padding:T.s32,maxWidth:400}}>
        <div style={{fontSize:64,marginBottom:T.s16}}>🚪</div>
        <div style={{fontFamily:"'IM Fell English',serif",color:T.danger,fontSize:22,letterSpacing:3,marginBottom:T.s12}}>Lobi Kapandı</div>
        <p style={{color:T.textSecondary,fontSize:14,marginBottom:T.s32,lineHeight:1.7}}>Lobi oturumu sona erdi veya terk edildi.<br/>Yeni bir lobiye katılabilirsin.</p>
        <Btn variant="primary" onClick={()=>setLobbyClosed(false)} style={{justifyContent:"center",gap:T.s8,padding:"14px 32px",fontSize:15,width:"100%"}}>🏠 Ana Sayfaya Dön</Btn>
      </div>
    </div>;
  }

  return <div style={{minHeight:"100vh",width:"100%",position:"relative",overflow:"hidden"}}>
    <PhaseBackground phase={bgPhase}/>
    <div style={{position:"relative",zIndex:1,opacity:anim?1:0,transition:"opacity 0.18s ease-out"}}>
      <nav style={{padding:`${T.s12} ${T.s16}`,display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:`1px solid ${T.border}`,background:"rgba(0,0,0,0.22)",backdropFilter:"blur(16px)",position:"sticky",top:0,zIndex:50,gap:T.s8,flexWrap:"wrap"}}>
        <div style={{display:"flex",alignItems:"center",gap:T.s12}}>
          {screen!=="join"&&<Btn variant="icon" onClick={handleEnd} ariaLabel="Ana sayfa">←</Btn>}
          <LuminaLogo size="sm"/>
        </div>
        {session&&<div style={{display:"flex",gap:T.s8,alignItems:"center",flexWrap:"wrap"}}>
          {screen==="game"&&<RoleCountBadge players={gamePlayers.filter(p=>!p.isHost)} isHost={session.isHost} roles={roleLibrary}/>}
          {screen==="game"&&<RoleBookButton roles={roleLibrary}/>}
          <Tag color={T.accent} size="sm">#{session.lobbyCode}</Tag>
          <Tag color={session.isHost?T.primary:session.isSpectator?T.accent:T.textMuted} size="sm">
            {session.myName}{session.isHost?" 👑":session.isSpectator?" 👁":""}
          </Tag>
        </div>}
      </nav>
      {screen==="join"&&<JoinScreen onJoined={handleJoined}/>}
      {screen==="lobby"&&session&&<LobbyWaiting lobbyCode={session.lobbyCode} players={lobbyPlayers} spectators={spectators} isHost={session.isHost} myName={session.myName} onStartSetup={handleStartSetup}/>}
      {screen==="setup"&&session?.isHost&&<SetupScreen onStart={handleGameStart} roleLibrary={roleLibrary} lobbyPlayers={lobbyPlayers} lobbyCode={session.lobbyCode}/>}
      {screen==="setup"&&!session?.isHost&&<SetupWaitingScreen lobbyCode={session?.lobbyCode} myName={session?.myName}/>}
      {screen==="game"&&session&&<GameScreen players={gamePlayers} nightOrder={gameNightOrder} roles={roleLibrary} onEnd={handleEnd} onNewGame={handleNewGame} onPhaseChange={setBgPhase} isHost={session.isHost} lobbyCode={session.lobbyCode} myName={session.myName} isSpectator={session.isSpectator} fb={window.__FB}/>}
      {screen==="replay"&&<ReplayScreen lobbyCode={session?.lobbyCode} replayData={replayData} onBack={()=>{saveSession(null);setSession(null);setReplayData(null);go("join");}}/>}
      <footer style={{textAlign:"center",padding:`${T.s16} 0 ${T.s24}`,borderTop:"1px solid rgba(255,255,255,0.04)"}}><span style={{fontSize:12,color:"rgba(167,139,250,0.5)"}}>discord.gg/lumina • Lumina Vampir Köylü</span></footer>
    </div>
  </div>;
}

function mountApp(){
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
}
if(window.__FB){
  mountApp();
}else{
  window.addEventListener("fb-ready",mountApp,{once:true});
  setTimeout(()=>{if(!document.getElementById("root").hasChildNodes())mountApp();},4000);
}
</script>
</body>

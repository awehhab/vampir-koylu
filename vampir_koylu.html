// Escort/Kabus Vampir engellemesi bir oyuncuyu gerçekten etkiliyor mu? (resolveNight ile aynı kurallar)
function isEffectivelyBlocked(actorId,roleId,tip,actionsSoFar){
  if(!actorId)return false;
  const blockedIds=new Set((actionsSoFar||[]).filter(a=>a.tip==="kabus_block").map(a=>a.targetId));
  if(!blockedIds.has(actorId))return false;
  const rolDef=DEFAULT_ROLES.find(r=>r.id===roleId);
  if(rolDef?.killType==="ultimate")return false; // Seri Katil, Cadı vb. mutlak roller engellenemez
  if(tip==="witch_kill"||tip==="witch_protect")return false; // Cadı iksirleri engellenemez
  return true;
}
function getEligible(roleId,ability,actor,allPlayers,nightNum,docHist){
  const dh=docHist||{};
  const alive=allPlayers.filter(p=>p.durum==="canlı"&&!p.isHost);
  const dead=allPlayers.filter(p=>p.durum==="ölü"&&!p.isHost);
  if(!ability)return{targets:alive,reason:null};
  if(ability.tip==="kill"){
    let pool=alive.filter(p=>p.id!==actor?.id);
    // Vampirler kendi takımını hedef alamaz
    if(actor?.rol?.takim==="karanlık"){pool=pool.filter(p=>p.rol?.takim!==actor.rol.takim);}
    // Hırsız seri katili hedef alamaz
    if(actor?.rol?.id==="hirsiz"){pool=pool.filter(p=>!p.rol?.isSerialKiller);}
    return{targets:pool,reason:pool.length===0?"Hedef alınabilecek oyuncu yok.":null};
  }
  if(ability.tip==="protect"){
    // Her doktor kendi geçmişine göre kilitlenir — başka doktorun geçmişi bu doktoru etkilemez
    // dh yapısı: { [actorId]: { [targetId]: [geceler...] } }
    const actorKey=String(actor?.id);
    const myHist=(dh[actorKey]||{});
    const pool=alive.filter(p=>{
      const h=(myHist[String(p.id)]||[]);
      const last2=h.slice(-2);
      return!(last2.length>=2&&last2[last2.length-2]===nightNum-2&&last2[last2.length-1]===nightNum-1);
    });
    return{targets:pool,reason:pool.length===0?"Koruyabileceğin kimse yok.":null};
  }
  if(ability.tip==="reveal"){const pool=alive.filter(p=>p.id!==actor?.id);return{targets:pool,reason:pool.length===0?"Bakabileceğin kimse yok.":null};}
  if(ability.tip==="revive"){
    // Rahip: ölüleri hedef alabilir (iyi/kötü fark etmez), sadece 1 kez kullanım
    if((actor?.abilityUses?.a9??ability.kullanim)===0)return{targets:[],reason:"Diriltme hakkın bitti."};
    return{targets:dead,reason:dead.length===0?"Diriltebileceğin ölü oyuncu yok.":null};
  }
  if(ability.tip==="announce")return{targets:[],reason:null,selfAction:true};
  if(ability.tip==="witch_kill"){const pool=alive.filter(p=>p.id!==actor?.id);return{targets:pool,reason:pool.length===0?"Hedef yok.":null};}
  if(ability.tip==="witch_protect"){const pool=alive.filter(p=>!p.isHost);return{targets:pool,reason:pool.length===0?"Hedef yok.":null};}
  if(ability.tip==="sheriff_shoot"){const kalan=actor?.abilityUses?.a8??ability.kullanim;if(kalan===0)return{targets:[],reason:"Mermilerin bitti."};const pool=alive.filter(p=>p.id!==actor?.id);return{targets:pool,reason:pool.length===0?"Hedef yok.":null};}
  if(ability.tip==="kabus_block"){const pool=alive.filter(p=>p.id!==actor?.id);return{targets:pool,reason:pool.length===0?"Hedef yok.":null};}
  const pool=alive.filter(p=>p.id!==actor?.id);
  return{targets:pool,reason:pool.length===0?"Hedef alınabilecek oyuncu yok.":null};
}

function FocusInput({value,onChange,placeholder,style,rows,onKeyDown,maxLength,type}){

  const s={background:"rgba(255,255,255,0.05)",border:`1px solid ${foc?T.accent:T.border}`,borderRadius:T.md,padding:`${T.s12} ${T.s16}`,color:T.textPrimary,fontSize:14,outline:"none",width:"100%",boxShadow:foc?`0 0 0 2px ${T.accent}33`:"none",transition:`border-color ${T.base},box-shadow ${T.base}`,...style};

function Sheet({open,onClose,title,children}){
  if(!open)return null;

function PhaseBackground({phase}){
  const[current,setCurrent]=useState(phase);
  const[transitioning,setTransitioning]=useState(false);
  const[bgOpacity,setBgOpacity]=useState(1);
  useEffect(()=>{
    if(phase===current)return;
    setTransitioning(true);setBgOpacity(0);
    const t1=setTimeout(()=>{setCurrent(phase);setBgOpacity(1);},600);
    const t2=setTimeout(()=>setTransitioning(false),1200);
    return()=>{clearTimeout(t1);clearTimeout(t2);};
  },[phase]);
  const night=current==="gece";
  return <>
    <div style={{position:"fixed",inset:0,zIndex:0,background:night?"radial-gradient(ellipse at 20% 35%, #2d1b69 0%, #1a0f3c 40%, #0d0a1f 100%)":"radial-gradient(ellipse at 85% 0%, #c9730a 0%, #7a3d00 18%, #3d1060 50%, #0d0a1f 90%)",opacity:bgOpacity,transition:"opacity 0.6s ease"}}/>
    <div style={{position:"fixed",top:"5%",left:"10%",width:350,height:350,borderRadius:"50%",background:night?"rgba(88,80,180,0.14)":"rgba(243,156,18,0.18)",filter:"blur(90px)",zIndex:0,pointerEvents:"none",opacity:bgOpacity,transition:"opacity 0.6s ease"}}/>
    {night?<>
      {[...Array(12)].map((_,i)=><div key={i} style={{position:"fixed",top:`${5+i*7}%`,left:`${(i*13)%90+5}%`,width:i%3===0?3:2,height:i%3===0?3:2,borderRadius:"50%",background:"#fff",opacity:bgOpacity*0.6,zIndex:0,pointerEvents:"none",animation:`starBlink ${1.5+i*0.3}s ease-in-out ${i*0.2}s infinite`,transition:"opacity 0.6s ease"}}/>)}
      <div style={{position:"fixed",top:"8%",right:"12%",fontSize:"clamp(32px,6vw,52px)",zIndex:0,pointerEvents:"none",animation:"moonrise 1.2s ease-out both",filter:"drop-shadow(0 0 20px rgba(167,139,250,0.6))",opacity:bgOpacity*0.7,transition:"opacity 0.6s ease"}}>🌙</div>
    </>:<>
      <div style={{position:"fixed",top:"6%",right:"10%",fontSize:"clamp(32px,6vw,52px)",zIndex:0,pointerEvents:"none",animation:"sunrise 1.2s ease-out both",filter:"drop-shadow(0 0 30px rgba(243,156,18,0.8))",opacity:bgOpacity*0.75,transition:"opacity 0.6s ease"}}>☀️</div>
      {[{top:"15%",left:"5%",w:180},{top:"10%",left:"35%",w:220},{top:"20%",right:"25%",w:150}].map((c,i)=><div key={i} style={{position:"fixed",top:c.top,left:c.left,right:c.right,width:c.w,height:40,borderRadius:20,background:"rgba(255,255,255,0.06)",filter:"blur(12px)",zIndex:0,pointerEvents:"none",animation:`cloudDrift ${3+i}s ease-in-out ${i*0.5}s infinite alternate`,opacity:bgOpacity,transition:"opacity 0.6s ease"}}/>)}
    </>}
  </>;

// ── TIMER (Firebase sync) ─────────────────────────────────────────────────────
function DayTimer({lobbyCode,isHost,fb,isNight}){
  const timerKey=isNight?"nightTimer":"timer";
  const[status,setStatus]=useState("idle");
  const[leftSecs,setLeft]=useState(300);
  const[totalSecs,setTotal]=useState(300);
  const leftRef=useRef(300),totalRef=useRef(300),tickRef=useRef(null),startTsRef=useRef(null),startLeftRef=useRef(300);
  useEffect(()=>()=>clearInterval(tickRef.current),[]);
  useEffect(()=>{
    if(!fb||!lobbyCode)return;
    const tRef=fb.ref(fb.db,`lobbies/${lobbyCode}/${timerKey}`);
    const unsub=fb.onValue(tRef,(snap)=>{
      const d=snap.val();if(!d)return;
      const st=d.status||"idle";
      const tot=d.total||0;
      setTotal(tot);totalRef.current=tot;
      if(!isHost){
        setStatus(st);
        if(st==="running"&&d.serverLeft!=null&&d.serverTs!=null){
          // Interpolate from server time for smooth sync
          const elapsed=Math.max(0,Math.floor((Date.now()-d.serverTs)/1000));
          const synced=Math.max(0,d.serverLeft-elapsed);
          leftRef.current=synced;setLeft(synced);
          startLeftRef.current=synced;startTsRef.current=Date.now();
          stopTick();
          tickRef.current=setInterval(()=>{
            leftRef.current--;setLeft(leftRef.current);
            if(leftRef.current<=0){stopTick();setStatus("expired");playAlarm();}
          },1000);
        } else if(st==="paused"||st==="idle"||st==="expired"){
          stopTick();
          if(d.left!=null){leftRef.current=d.left;setLeft(d.left);}
        }
      }
    });
    return()=>unsub();
  },[fb,lobbyCode,isHost,timerKey]);

  const pushTimer=(s,l,t)=>{
    if(!isHost||!fb||!lobbyCode)return;
    fb.set(fb.ref(fb.db,`lobbies/${lobbyCode}/${timerKey}`),{status:s,left:l,total:t,serverLeft:l,serverTs:Date.now()});
  };
  const stopTick=()=>{clearInterval(tickRef.current);tickRef.current=null;};
  const startTick=(fromLeft)=>{
    stopTick();
    leftRef.current=fromLeft;
    tickRef.current=setInterval(()=>{
      leftRef.current--;setLeft(leftRef.current);
      if(isHost)pushTimer("running",leftRef.current,totalRef.current);
      if(leftRef.current<=0){stopTick();setStatus("expired");if(isHost)pushTimer("expired",0,totalRef.current);playAlarm();}
    },1000);
  };
  const start=(secs)=>{leftRef.current=secs;totalRef.current=secs;setLeft(secs);setTotal(secs);setStatus("running");startTick(secs);pushTimer("running",secs,secs);};
  const pause=()=>{stopTick();setStatus("paused");pushTimer("paused",leftRef.current,totalRef.current);};
  const resume=()=>{setStatus("running");startTick(leftRef.current);pushTimer("running",leftRef.current,totalRef.current);};
  const reset=()=>{stopTick();leftRef.current=0;totalRef.current=0;setLeft(0);setTotal(0);setStatus("idle");pushTimer("idle",0,0);};
  const addTime=(secs)=>{leftRef.current+=secs;totalRef.current+=secs;setLeft(l=>l+secs);setTotal(t=>t+secs);if(status!=="running"){setStatus("running");startTick(leftRef.current);}pushTimer("running",leftRef.current,totalRef.current);};

  const m=Math.floor(leftSecs/60),s=leftSecs%60;
  const pct=totalSecs>0?Math.max(0,Math.min(100,(leftSecs/totalSecs)*100)):0;
  const urgent=status==="running"&&leftSecs>0&&leftSecs<=30;
  const circ=2*Math.PI*15;
  const baseColor=isNight?"#a78bfa":"#f39c12";
  const timerColor=urgent?T.danger:status==="running"?baseColor:T.textMuted;
  const strokeDash=circ*(pct/100);

  if(!isHost){
    if(status==="idle")return null;
    const barColor=urgent?"rgba(231,76,60,0.8)":isNight?"rgba(167,139,250,0.7)":"rgba(243,156,18,0.7)";
    return <div style={{padding:`${T.s8} ${T.s16}`,marginBottom:T.s12,background:"rgba(255,255,255,0.04)",borderRadius:T.md,border:`1px solid ${urgent?T.dangerBorder:isNight?T.accentBorder:T.primaryBorder}`,display:"flex",alignItems:"center",gap:T.s12}}>
      {/* Progress arc */}
      <div style={{flexShrink:0}}>
        <svg width="38" height="38" style={{transform:"rotate(-90deg)",display:"block"}}>
          <circle cx="19" cy="19" r="15" fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="3"/>
          <circle cx="19" cy="19" r="15" fill="none" stroke={timerColor} strokeWidth="3"
            strokeDasharray={`${strokeDash} ${circ}`} strokeLinecap="round"
            style={{transition:"stroke-dasharray 0.9s linear, stroke 0.3s ease"}}/>
        </svg>
      </div>
      <span style={{fontFamily:"'Uncial Antiqua',serif",fontSize:24,letterSpacing:4,color:timerColor,minWidth:64,
        animation:urgent?"blink 0.8s ease-in-out infinite":undefined,
        transition:"color 0.3s ease"}}>
        {String(m).padStart(2,"0")}:{String(s).padStart(2,"0")}
      </span>
      {status==="paused"&&<span style={{fontSize:10,color:T.textMuted,letterSpacing:2,background:"rgba(255,255,255,0.06)",borderRadius:4,padding:"2px 6px"}}>DURAKLATILDI</span>}
      {status==="expired"&&<span style={{fontSize:12,color:T.danger,fontWeight:700}}>⏰ Süre doldu!</span>}
      <span style={{fontSize:11,color:T.textMuted,marginLeft:"auto"}}>{isNight?"🌙":"☀️"}</span>
      {/* Bottom bar */}
      <div style={{position:"absolute",bottom:0,left:0,height:2,width:`${pct}%`,background:barColor,borderRadius:"0 0 0 4px",transition:"width 0.9s linear"}}/>
    </div>;
  }

  return <GlassCard style={{padding:`${T.s8} ${T.s16}`,marginBottom:T.s12,border:`1px solid ${status==="expired"?T.dangerBorder:status!=="idle"?(isNight?"rgba(167,139,250,0.4)":"rgba(243,156,18,0.4)"):T.border}`,position:"relative",overflow:"hidden"}}>
    {/* Background progress bar */}
    {status==="running"&&totalSecs>0&&<div style={{position:"absolute",inset:0,width:`${pct}%`,background:isNight?"rgba(167,139,250,0.06)":"rgba(243,156,18,0.05)",transition:"width 0.9s linear",pointerEvents:"none"}}/>}
    {status==="idle"&&<div style={{display:"flex",alignItems:"center",gap:T.s8,flexWrap:"wrap",position:"relative"}}>
      <span style={{fontSize:11,color:T.textMuted,letterSpacing:2,flexShrink:0}}>{isNight?"🌙":"⏱"} SÜRE SEÇ</span>
      <div style={{display:"flex",gap:T.s4,flexWrap:"wrap"}}>
        {[[1,60],[2,120],[3,180],[5,300],[10,600]].map(([lbl,secs])=><button key={lbl} onClick={()=>start(secs)} style={{padding:`${T.s4} ${T.s8}`,borderRadius:T.sm,border:`1px solid ${T.border}`,background:T.surface,color:T.textSecondary,fontSize:12,fontWeight:700,cursor:"pointer",transition:"background 0.15s ease"}}>{lbl}dk</button>)}
      </div>
    </div>}
    {status==="expired"&&<div style={{display:"flex",alignItems:"center",gap:T.s8,flexWrap:"wrap",position:"relative"}}>
      <span style={{fontSize:13,color:T.danger,fontWeight:700}}>⏰ Süre doldu!</span>
      <span style={{fontSize:11,color:T.textMuted}}>Ekle:</span>
      {[1,2,5].map(mn=><button key={mn} onClick={()=>addTime(mn*60)} style={{padding:`${T.s4} ${T.s8}`,borderRadius:T.sm,border:`1px solid ${T.border}`,background:T.surface,color:T.textSecondary,fontSize:11,fontWeight:700,cursor:"pointer"}}>+{mn}dk</button>)}
      <Btn variant="icon" onClick={reset} ariaLabel="Sıfırla" style={{padding:"5px",marginLeft:"auto"}}>↺</Btn>
    </div>}
    {(status==="running"||status==="paused")&&<div style={{display:"flex",alignItems:"center",gap:T.s10||T.s12,position:"relative"}}>
      {/* Arc */}
      <div style={{flexShrink:0}}>
        <svg width="38" height="38" style={{transform:"rotate(-90deg)",display:"block"}}>
          <circle cx="19" cy="19" r="15" fill="none" stroke="rgba(255,255,255,0.07)" strokeWidth="3"/>
          <circle cx="19" cy="19" r="15" fill="none" stroke={timerColor} strokeWidth="3"
            strokeDasharray={`${strokeDash} ${circ}`} strokeLinecap="round"
            style={{transition:"stroke-dasharray 0.9s linear, stroke 0.3s ease"}}/>
        </svg>
      </div>
      <span style={{fontFamily:"'Uncial Antiqua',serif",fontSize:24,letterSpacing:5,color:timerColor,minWidth:64,
        animation:urgent?"blink 0.8s ease-in-out infinite":undefined,
        transition:"color 0.3s ease"}}>
        {String(m).padStart(2,"0")}:{String(s).padStart(2,"0")}
      </span>
      {status==="paused"&&<span style={{fontSize:10,color:T.textMuted,letterSpacing:2,background:"rgba(255,255,255,0.06)",borderRadius:4,padding:"2px 6px"}}>DURAKLATILDI</span>}
      <div style={{display:"flex",gap:T.s4,marginLeft:"auto",alignItems:"center"}}>
        {[1,2,5].map(mn=><button key={mn} onClick={()=>addTime(mn*60)} style={{padding:"3px 7px",borderRadius:T.sm,border:`1px solid ${T.border}`,background:"transparent",color:T.textMuted,fontSize:11,fontWeight:700,cursor:"pointer"}}>+{mn}dk</button>)}
        {status==="running"&&<Btn variant="icon" onClick={pause} ariaLabel="Duraklat" style={{padding:"5px"}}>⏸</Btn>}
        {status==="paused"&&<Btn variant="icon" onClick={resume} ariaLabel="Devam et" style={{padding:"5px"}}>▶</Btn>}
        <Btn variant="icon" onClick={reset} ariaLabel="Sıfırla" style={{padding:"5px",color:T.danger,borderColor:T.dangerBorder}}>↺</Btn>
      </div>
    </div>}
  </GlassCard>;
}

// ── PLAYER CARD ───────────────────────────────────────────────────────────────
function PlayerCard({player,onStatus,onAnnounce,onKick,phase,isHost,isOnline}){
  const[open,setOpen]=useState(false);
  const s=STATUS[player.durum]||STATUS.canlı;
  const isDead=player.durum==="ölü";
  const isDisconnected=isOnline===false&&!isDead;
  const avatarBg=isHost?(player.rol?.renk||T.accent)+"22":"rgba(255,255,255,0.07)";
  const avatarBorder=isHost?`1px solid ${(player.rol?.renk||T.accent)+"44"}`:`1px solid rgba(255,255,255,0.10)`;
  return <div style={{opacity:isDead?0.5:isDisconnected?0.65:1,transition:`opacity ${T.base}`}}>
    <GlassCard style={{padding:`${T.s12} ${T.s16}`,border:`1px solid ${isDead?"rgba(255,255,255,0.04)":isDisconnected?"rgba(231,76,60,0.25)":phase==="gece"?T.accentBorder:T.border}`}}>
      <div style={{display:"flex",alignItems:"center",gap:T.s12}}>
        <div style={{position:"relative",flexShrink:0}}>
          <div style={{width:42,height:42,borderRadius:T.md,background:avatarBg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,border:avatarBorder}}>{isDead?"💀":isHost?player.rol?.emoji:"👤"}</div>
          {!isDead&&<div style={{position:"absolute",bottom:-2,right:-2,width:10,height:10,borderRadius:"50%",background:isDisconnected?"#e74c3c":"#27ae60",border:"2px solid #0d0a1f"}}/>}
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",alignItems:"center",gap:T.s6,flexWrap:"wrap"}}>
            <span style={{fontWeight:700,fontSize:15,color:isDead?T.textMuted:T.textPrimary,textDecoration:isDead?"line-through":"none",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{player.ad}</span>
            {isDisconnected&&<span style={{fontSize:10,color:T.danger,background:"rgba(231,76,60,0.12)",border:`1px solid rgba(231,76,60,0.3)`,borderRadius:3,padding:"1px 5px",letterSpacing:0.5,fontWeight:700}}>bağlantı kesildi</span>}
          </div>
          <div style={{display:"flex",gap:T.s4,marginTop:T.s4,flexWrap:"wrap"}}>
            <Tag color={s.color} size="sm">{s.label}</Tag>
            {isHost&&<Tag color={isDead?"#555":player.rol?.renk} size="sm">{player.rol?.ad}</Tag>}
            {player.kimlikAcik&&<Tag color={T.primary} size="sm">👑 Belediye Başkanı</Tag>}
          </div>
          {isDead&&player.will&&<div style={{marginTop:T.s4,fontSize:11,color:"rgba(243,156,18,0.75)",fontStyle:"italic",background:"rgba(243,156,18,0.06)",border:"1px solid rgba(243,156,18,0.2)",borderRadius:T.sm,padding:"3px 8px"}}>📜 "{player.will}"</div>}
          {isDead&&player.deathNote&&<div style={{marginTop:T.s4,fontSize:11,color:"#f39c12",fontStyle:"italic",background:"rgba(243,156,18,0.10)",border:"1px solid rgba(243,156,18,0.35)",borderRadius:T.sm,padding:"3px 8px"}}>📝 "{player.deathNote}"</div>}
          {isDead&&player.lastWords&&<div style={{marginTop:T.s4,fontSize:11,color:T.primary,fontStyle:"italic",background:T.primaryDim,border:`1px solid ${T.primaryBorder}`,borderRadius:T.sm,padding:"3px 8px"}}>💬 "{player.lastWords}"</div>}
        </div>
        {isHost&&<div style={{display:"flex",gap:T.s4,flexShrink:0}}>
          {player.rol?.id==="baskan"&&!player.kimlikAcik&&!isDead&&phase==="gündüz"&&<Btn variant="icon" onClick={()=>onAnnounce(player.id)} style={{color:T.primary,borderColor:T.primaryBorder}}>👑</Btn>}
          <Btn variant="icon" onClick={()=>setOpen(o=>!o)}>⚙</Btn>
        </div>}
      </div>
      {open&&isHost&&<div className="enter" style={{marginTop:T.s12,paddingTop:T.s12,borderTop:"1px solid rgba(255,255,255,0.07)",display:"flex",gap:T.s8,flexWrap:"wrap"}}>
        {!isDead&&<button onClick={()=>{onStatus(player.id,"ölü");setOpen(false);}} style={{flex:1,minWidth:80,padding:`${T.s8} 0`,borderRadius:T.md,border:`1px solid ${T.dangerBorder}`,background:T.dangerDim,color:T.danger,fontWeight:700,fontSize:12,cursor:"pointer"}}>💀 Öldür</button>}
        {isDead&&<button onClick={()=>{onStatus(player.id,"canlı");setOpen(false);}} style={{flex:1,minWidth:80,padding:`${T.s8} 0`,borderRadius:T.md,border:`1px solid ${T.successBorder}`,background:T.successDim,color:T.success,fontWeight:700,fontSize:12,cursor:"pointer"}}>✓ Canlandır</button>}
        <button onClick={()=>{onStatus(player.id,"izleyici");setOpen(false);}} style={{flex:1,minWidth:80,padding:`${T.s8} 0`,borderRadius:T.md,border:`1px solid ${T.accentBorder}`,background:player.durum==="izleyici"?T.accentDim:T.surface,color:T.accent,fontWeight:700,fontSize:12,cursor:"pointer"}}>👁 İzleyiciye Al</button>
        {onKick&&<button onClick={()=>{setOpen(false);onKick(player.id);}} style={{flex:1,minWidth:80,padding:`${T.s8} 0`,borderRadius:T.md,border:"1px solid rgba(230,126,34,0.4)",background:"rgba(230,126,34,0.1)",color:"#e67e22",fontWeight:700,fontSize:12,cursor:"pointer"}}>🚫 At</button>}
      </div>}
    </GlassCard>
  </div>;
}

// ── ROLE BOOK (kitapçık) ──────────────────────────────────────────────────────
function RoleBookButton({roles}){
  const[open,setOpen]=useState(false);
  const[expanded,setExpanded]=useState(null);
  return <>
    <button onClick={()=>setOpen(o=>!o)} style={{background:T.accentDim,border:`1px solid ${T.accentBorder}`,borderRadius:"50%",width:36,height:36,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:16,color:T.accent}} title="Rol Kitabı">📚</button>
    {open&&<div onClick={()=>setOpen(false)} style={{position:"fixed",inset:0,zIndex:200,display:"flex",alignItems:"flex-start",justifyContent:"flex-end",paddingTop:70,paddingRight:16}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"linear-gradient(160deg,rgba(22,14,50,0.98),rgba(13,10,31,0.98))",border:`1px solid ${T.border}`,borderRadius:T.lg,padding:T.s16,minWidth:260,maxWidth:340,maxHeight:"80vh",overflowY:"auto",boxShadow:"0 8px 32px rgba(0,0,0,0.5)",animation:"fadeUp 200ms ease-out"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:T.s12}}>
          <span style={{fontFamily:"'IM Fell English',serif",color:T.accent,fontSize:14,letterSpacing:2}}>📚 Rol Kitabı</span>
          <Btn variant="icon" onClick={()=>setOpen(false)} ariaLabel="Kapat" style={{padding:"4px"}}>✕</Btn>
        </div>
        {[...roles].sort((a,b)=>{const ai=ROLE_BADGE_ORDER.indexOf(a.id);const bi=ROLE_BADGE_ORDER.indexOf(b.id);if(ai===-1&&bi===-1)return 0;if(ai===-1)return 1;if(bi===-1)return -1;return ai-bi;}).map(r=><div key={r.id} style={{background:"rgba(255,255,255,0.03)",borderRadius:T.md,border:`1px solid ${r.renk}33`,marginBottom:T.s6,overflow:"hidden"}}>
          <div style={{display:"flex",alignItems:"center",gap:T.s8,padding:`${T.s10||"10px"} ${T.s12}`,cursor:"pointer"}} onClick={()=>setExpanded(expanded===r.id?null:r.id)}>
            <span style={{fontSize:18}}>{r.emoji}</span>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,color:T.textPrimary,fontSize:13}}>{r.ad}</div>
              <div style={{display:"flex",gap:T.s4,marginTop:2,flexWrap:"wrap"}}>
                <Pill label={TEAMS[r.takim]?.label} color={TEAMS[r.takim]?.color}/>
              </div>
            </div>
            <span style={{fontSize:11,color:T.textMuted}}>{expanded===r.id?"▲":"▼"}</span>
          </div>
          {expanded===r.id&&<div style={{padding:`0 ${T.s12} ${T.s12}`,borderTop:"1px solid rgba(255,255,255,0.06)"}}>
            <p style={{fontSize:12,color:T.textSecondary,margin:`${T.s8} 0`,lineHeight:1.6}}>{r.aciklama}</p>
            {r.abilities?.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:T.s4}}>{r.abilities.map(a=><Tag key={a.id} color={r.renk}>{a.ad} ({a.kullanim===-1?"∞":`${a.kullanim}×`})</Tag>)}</div>}
          </div>}
        </div>)}
      </div>
    </div>}
  </>;
}

// ── ROLE COUNT BADGE ──────────────────────────────────────────────────────────
function RoleCountBadge({players,isHost,roles}){
  const[open,setOpen]=useState(false);
  // Tüm oyuncular (host hariç) — ölüler dahil, başlangıç rol sayıları sabit kalır
  const allNonHost=players.filter(p=>!p.isHost);
  const roleCounts=allNonHost.reduce((acc,p)=>{const baseRol=p.baslangicRol||p.rol;const rid=baseRol?.id||"?";const rad=baseRol?.ad||"?";acc[rid]=acc[rid]||{ad:rad,emoji:baseRol?.emoji||"❓",renk:baseRol?.renk||T.accent,count:0};acc[rid].count++;return acc;},{});
  // Rol sırasını ROLE_BADGE_ORDER'a göre sırala (rol kullanma sırası)
  const sortedRoles=Object.entries(roleCounts).sort(([a],[b])=>{const ai=ROLE_BADGE_ORDER.indexOf(a);const bi=ROLE_BADGE_ORDER.indexOf(b);if(ai===-1&&bi===-1)return 0;if(ai===-1)return 1;if(bi===-1)return -1;return ai-bi;}).map(([,v])=>v);
  return <>
    <button onClick={()=>setOpen(o=>!o)} style={{background:T.accentDim,border:`1px solid ${T.accentBorder}`,borderRadius:"50%",width:36,height:36,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:16,color:T.accent}} title="Rol Sayıları">🎭</button>
    {open&&<div onClick={()=>setOpen(false)} style={{position:"fixed",inset:0,zIndex:200,display:"flex",alignItems:"flex-start",justifyContent:"flex-end",paddingTop:70,paddingRight:16}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"linear-gradient(160deg,rgba(22,14,50,0.98),rgba(13,10,31,0.98))",border:`1px solid ${T.border}`,borderRadius:T.lg,padding:T.s16,minWidth:200,maxWidth:260,boxShadow:"0 8px 32px rgba(0,0,0,0.5)",animation:`fadeUp 200ms ease-out`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:T.s12}}>
          <span style={{fontFamily:"'IM Fell English',serif",color:T.accent,fontSize:14,letterSpacing:2}}>Rol Sayıları</span>
          <Btn variant="icon" onClick={()=>setOpen(false)} ariaLabel="Kapat" style={{padding:"4px"}}>✕</Btn>
        </div>
        <p style={{fontSize:11,color:T.textMuted,marginBottom:T.s12}}>Rol sayıları oyun başındaki ayara göre sabittir.</p>
        {sortedRoles.map(r=><div key={r.ad} style={{display:"flex",alignItems:"center",gap:T.s8,padding:`${T.s8} ${T.s12}`,background:"rgba(255,255,255,0.03)",borderRadius:T.md,marginBottom:T.s4,border:`1px solid ${r.renk}33`}}>
          <span style={{fontSize:18}}>{r.emoji}</span>
          <span style={{flex:1,fontWeight:700,fontSize:13,color:T.textPrimary}}>{r.ad}</span>
          <span style={{fontFamily:"'Uncial Antiqua',serif",fontSize:16,color:r.renk,fontWeight:700}}>{r.count}</span>
        </div>)}
        {sortedRoles.length===0&&<p style={{fontSize:12,color:T.textMuted,textAlign:"center"}}>Henüz oyuncu yok.</p>}
      </div>
    </div>}
  </>;
}
